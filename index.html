<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMS/SFA Pro - Quản Lý Sales & Phân Tuyến Điểm Bán</title>
<meta name="theme-color" content="#12213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
  :root { --navy:#12213D; --amber:#FCA311; --paper:#F6F1E6; --line:#D9D0BC; --muted:#6B6558; --green:#2D6A4F; --red:#C1121F; --purple:#5B3A8E; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--navy);color:#1a1a1a;padding:8px;}
  .app{max-width:1360px;margin:0 auto;}
  .panel{background:var(--paper);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,0.3);margin-top:10px;}
  h1,h2,h3,h4{font-family:'Oswald',sans-serif;color:var(--navy);}
  .topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;flex-wrap:wrap;gap:8px;}
  .nav-btns{display:flex;gap:4px;flex-wrap:wrap;}
  .btn{background:var(--navy);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-purple{background:var(--purple);color:#fff;}
  .btn-sm{padding:4px 8px;font-size:11px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .badge{display:inline-block;padding:3px 8px;background:#EFE7D6;border-radius:4px;font-size:11px;font-weight:700;}
  .badge-success{background:#D8F3DC;color:var(--green);}
  .badge-pending{background:#FFF3BF;color:#B57700;}
  .badge-danger{background:#F8D7DA;color:var(--red);}
  input, select, textarea { width:100%; padding:8px; margin:4px 0 8px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:13px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:6px; border-bottom:1px solid var(--line); font-size:12px; }
  th { background:#EFE7D6; color:var(--navy); }
  .login-box{max-width:400px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.4);}
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;z-index:999;}
  .modal-content{background:#fff;padding:20px;border-radius:16px;width:90%;max-width:420px;max-height:85vh;overflow-y:auto;}
  .hidden{display:none !important;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:1200;}
  
  /* Style riêng cho bảng chọn hàng Sales */
  .sales-table th { text-align: center; }
  .sales-table td { text-align: center; }
  .btn-qty-num { background: #e9ecef; border: 1px solid #ced4da; color: #333; width: 28px; height: 28px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  .btn-qty-num:hover { background: var(--amber); color: #000; }

  @media (max-width: 768px) {
    body { padding: 4px; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .nav-btns { width: 100%; overflow-x: auto; padding-bottom: 4px; flex-wrap: nowrap; }
    .grid { grid-template-columns: 1fr !important; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
  }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    updatePassword, reauthenticateWithCredential, EmailAuthProvider, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs,
    serverTimestamp, enableIndexedDbPersistence, query, orderBy, limit, where, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCGCHPxhUnZzwjXhfw3hcy-9VPi9RrZ6HY",
    authDomain: "project-4126159910229398131.firebaseapp.com",
    projectId: "project-4126159910229398131",
    storageBucket: "project-4126159910229398131.firebasestorage.app",
    messagingSenderId: "87655220343",
    appId: "1:87655220343:web:15576d27653acbee16f272",
    measurementId: "G-JK9WGF52FY"
  };

  const app = initializeApp(firebaseConfig);
  const authSvc = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  const secondaryApp = initializeApp(firebaseConfig, "secondary");
  const secondaryAuth = getAuth(secondaryApp);

  let currentUser = null;
  let currentTab = 'sales';
  let stores = [], orders = [], users = [], checkins = [], products = [], auditLogs = [];
  let currentCart = {};
  let activeVisitedStore = null;

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
    const R = 6371e3, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  window.handleLogin = async function(e) {
    e.preventDefault();
    const email = document.getElementById('logUser').value.trim();
    const pass = document.getElementById('logPass').value.trim();
    try {
      await signInWithEmailAndPassword(authSvc, email, pass);
    } catch (err) { alert("Sai tài khoản hoặc mật khẩu."); }
  };

  onAuthStateChanged(authSvc, async (user) => {
    if (!user) {
      currentUser = null;
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('appView').classList.add('hidden');
      return;
    }
    const profileSnap = await getDoc(doc(db, "users", user.uid));
    if (!profileSnap.exists()) return alert("Tài khoản chưa phân quyền.");
    const profile = profileSnap.data();
    currentUser = { uid: user.uid, email: user.email, name: profile.name, code: profile.code, role: profile.role };
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    currentTab = (profile.role === 'sales') ? 'sales' : 'dashboard';
    attachListeners();
    renderUI();
  });

  window.handleLogout = async function() { await signOut(authSvc); };

  window.doCheckinWithPhoto = function(storeId) {
    const store = stores.find(s => s.id === storeId);
    const fileInput = document.getElementById(`img_${store.id}`);
    if (!fileInput || !fileInput.files[0]) return alert("⛔ CHỤP ẢNH TẠI ĐIỂM BÁN!");
    navigator.geolocation.getCurrentPosition(async pos => {
      activeVisitedStore = store;
      toast(`✅ Checked-in: ${store.code}_${store.name}`);
      renderUI();
    }, () => alert("⛔ LỖI GPS!"), { enableHighAccuracy: true });
  };

  // Chọn nhanh số lượng bằng dãy phím 1-9
  window.selectQuickQty = function(prdId, qty) {
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    currentCart[prdId].qty = qty;
    renderUI();
  };

  window.updateCartDetail = function(prdId, field, val) {
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    currentCart[prdId][field] = Number(val) || 0;
    renderUI();
  };

  window.submitOrder = async function() {
    if (!activeVisitedStore) return alert("Chưa chọn quầy hàng!");
    const items = [];
    let total = 0;
    products.forEach(p => {
      const c = currentCart[p.id];
      if (c && (c.qty > 0 || c.kien > 0 || c.le > 0)) {
        const itemTotal = (p.price || 0) * (c.qty || 1);
        total += itemTotal;
        items.push({ id: p.id, code: p.code, name: p.name, qty: c.qty, kien: c.kien, le: c.le, dvt: p.dvt || 'Hộp', price: p.price });
      }
    });

    if (items.length === 0) return alert("Vui lòng chọn số lượng hàng!");

    await addDoc(collection(db, "orders"), {
      salesUid: currentUser.uid, salesName: currentUser.name, salesCode: currentUser.code,
      storeId: activeVisitedStore.id, maDTPN: `${activeVisitedStore.code}_${activeVisitedStore.name}`,
      items, amount: total, status: 'Chờ duyệt', createdAt: serverTimestamp()
    });
    toast("🚀 Đã lập toa đơn thành công!");
    currentCart = {}; activeVisitedStore = null; renderUI();
  };

  window.addStore = async function(e) {
    e.preventDefault();
    const code = document.getElementById('stCode').value.trim();
    const name = document.getElementById('stName').value.trim();
    const address = document.getElementById('stAddr').value.trim();
    const routeDay = document.getElementById('stRoute').value;
    await addDoc(collection(db, "stores"), { code, name, address, routeDay, createdAt: serverTimestamp() });
    toast("Đã thêm điểm bán/tuyến!");
    document.getElementById('stForm').reset();
  };

  window.deleteStore = async function(id) {
    if(confirm("Xóa tuyến/điểm bán này?")) await deleteDoc(doc(db, "stores", id));
  };

  function attachListeners() {
    onSnapshot(collection(db, "stores"), snap => { stores = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
    onSnapshot(collection(db, "products"), snap => { products = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
    onSnapshot(collection(db, "orders"), snap => { orders = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
    if (currentUser.role === 'admin') {
      onSnapshot(collection(db, "users"), snap => { users = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
    }
  }

  function renderUI() {
    if (!currentUser) return;
    document.getElementById('userInfo').innerText = `[${currentUser.code}] ${currentUser.name}`;
    const isAdmin = currentUser.role === 'admin', isManager = currentUser.role === 'manager';
    const main = document.getElementById('mainContent');

    if (currentTab === 'sales') {
      const todayDateStr = new Date().toLocaleDateString('vi-VN');
      main.innerHTML = `
        <h2>Bảng Bán Hàng & Chăm Sóc Quầy</h2>
        <div class="grid">
          <div class="card">
            <h3>📍 Danh Sách Điểm Bán / Quầy</h3>
            ${stores.map(s => `
              <div style="padding:8px 0; border-bottom:1px dashed #ccc;">
                <b>${s.code||'KH'}_${s.name}</b> <span class="badge badge-pending">${s.routeDay||'Tuyến'}</span><br>
                <small>${s.address||''}</small><br>
                <input type="file" id="img_${s.id}" accept="image/*" capture="environment">
                <button class="btn btn-amber btn-sm" style="width:100%;margin-top:4px;" onclick="doCheckinWithPhoto('${s.id}')">📍 Check-in Mở Bảng Chọn Hàng</button>
              </div>
            `).join('')}
          </div>

          <div class="card" style="grid-column: span 2;">
            ${activeVisitedStore ? `
              <div style="background:#fff3bf; padding:12px; border-radius:8px; margin-bottom:12px;">
                <h2 style="color:var(--navy);">MaDTPN: <span style="color:var(--red);">${activeVisitedStore.code||'20Anh'}_${activeVisitedStore.name}</span></h2>
                <h4 style="margin-top:4px;">Toa đơn ngày ${todayDateStr}</h4>
              </div>

              <!-- BẢNG CHỌN SỐ LƯỢNG MÃ VTHH (1 đến 9) -->
              <h4>📦 Bảng Chọn Nhanh Số Lượng (1 - 9)</h4>
              <table class="sales-table" style="margin-bottom:16px;">
                <thead>
                  <tr>
                    <th style="text-align:left;">Mã VTHH</th>
                    <th style="text-align:left;">Tên Hàng</th>
                    <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
                  </tr>
                </thead>
                <tbody>
                  ${products.map(p => {
                    const selectedQty = currentCart[p.id]?.qty || 0;
                    return `
                      <tr>
                        <td style="text-align:left;"><b>${p.code}</b></td>
                        <td style="text-align:left;">${p.name}</td>
                        ${[1,2,3,4,5,6,7,8,9].map(n => `
                          <td>
                            <button class="btn-qty-num" style="${selectedQty===n?'background:var(--amber);font-weight:bold;':''}" onclick="selectQuickQty('${p.id}', ${n})">${n}</button>
                          </td>
                        `).join('')}
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>

              <!-- BẢNG CHI TIẾT VẬT TƯ -->
              <h4 style="margin-top:16px;">📋 Chi Tiết Vật Tư Trình Ký & Tồn Kho</h4>
              <table>
                <thead>
                  <tr>
                    <th>MaVT</th>
                    <th>TenVT</th>
                    <th>Dvt</th>
                    <th>Kiện</th>
                    <th>Lẻ</th>
                    <th>Quy cách</th>
                    <th>SL tồn</th>
                  </tr>
                </thead>
                <tbody>
                  ${products.map(p => {
                    const c = currentCart[p.id] || { kien: 0, le: 0 };
                    return `
                      <tr>
                        <td><b>${p.code}</b></td>
                        <td>${p.name}</td>
                        <td>${p.dvt || 'Hộp'}</td>
                        <td><input type="number" value="${c.kien}" style="width:50px;margin:0;" onchange="updateCartDetail('${p.id}', 'kien', this.value)"></td>
                        <td><input type="number" value="${c.le}" style="width:50px;margin:0;" onchange="updateCartDetail('${p.id}', 'le', this.value)"></td>
                        <td><small>${p.quycach || '1x24'}</small></td>
                        <td><span class="badge ${p.stock<=10?'badge-danger':'badge-success'}">${p.stock || 0}</span></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>

              <button class="btn btn-green" style="width:100%; margin-top:16px; padding:12px; font-size:16px;" onclick="submitOrder()">🚀 GỬI TOA ĐƠN HÀNG</button>
            ` : `<div style="text-align:center;padding:40px;color:var(--muted);"><h3>🔒 Chọn "Check-in" quầy để mở Toa đơn hàng.</h3></div>`}
          </div>
        </div>
      `;
    }

    else if (currentTab === 'stores' && (isAdmin || isManager)) {
      main.innerHTML = `
        <h2>Quản Lý Tuyến & Phân Tuyến Điểm Bán</h2>
        <div class="grid">
          <div class="card">
            <h3>+ Thêm / Phân Tuyến Mới</h3>
            <form id="stForm" onsubmit="addStore(event)">
              <label>Mã Khách Hàng (Mã DTPN):</label><input type="text" id="stCode" placeholder="20Anh" required>
              <label>Tên Quầy / Tiệm:</label><input type="text" id="stName" placeholder="Quầy Ánh Đồng Xoài" required>
              <label>Địa Chỉ:</label><input type="text" id="stAddr" placeholder="Đồng Xoài, Bình Phước" required>
              <label>Tuyến Phân Phối:</label>
              <select id="stRoute">
                <option>Tuyến Thứ 2 - Thứ 4 - Thứ 6</option>
                <option>Tuyến Thứ 3 - Thứ 5 - Thứ 7</option>
                <option>Tuyến Cả Tuần</option>
              </select>
              <button class="btn btn-green" style="width:100%;">+ Lưu Điểm Bán</button>
            </form>
          </div>
          <div class="card" style="grid-column: span 2;">
            <h3>Danh Sách Tuyến Điểm Bán</h3>
            <table>
              <thead>
                <tr><th>Mã DTPN</th><th>Tên Quầy</th><th>Địa Chỉ</th><th>Tuyến</th><th>Thao Tác</th></tr>
              </thead>
              <tbody>
                ${stores.map(s => `
                  <tr>
                    <td><b>${s.code||'KH'}</b></td>
                    <td><b>${s.name}</b></td>
                    <td>${s.address||''}</td>
                    <td><span class="badge badge-pending">${s.routeDay||'Cả tuần'}</span></td>
                    <td><button class="btn btn-red btn-sm" onclick="deleteStore('${s.id}')">Xóa</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
  }

  window.switchTab = function(tab) { currentTab = tab; renderUI(); };
</script>
</head>

<body>
<div class="app">
  <div id="loginView" class="login-box">
    <h2 style="text-align:center;margin-bottom:12px;">DMS/SFA PRO</h2>
    <form onsubmit="handleLogin(event)">
      <label>Email:</label><input type="email" id="logUser" required autocomplete="username">
      <label>Mật Khẩu:</label><input type="password" id="logPass" required autocomplete="current-password">
      <button class="btn btn-amber" style="width:100%;padding:12px;margin-top:10px;">🔑 ĐĂNG NHẬP</button>
    </form>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div><h1 style="color:var(--amber);">DMS SFA — TOA HÀNG QUẦY</h1><small id="userInfo"></small></div>
      <div class="nav-btns">
        <button class="btn btn-amber" onclick="switchTab('sales')">🛒 Toa Bán Hàng</button>
        <button class="btn" onclick="switchTab('stores')">🏬 Quản Lý Tuyến</button>
        <button class="btn btn-red" onclick="handleLogout()">Đăng Xuất</button>
      </div>
    </div>
    <div class="panel" id="mainContent"></div>
  </div>
</div>
</body>
</html>
