  .badge-danger{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;}
  
  input, select, textarea { width:100%; padding:12px 14px; margin:6px 0 10px; border:1px solid #CBD5E1; border-radius:12px; font-family:inherit; font-size:14px; background:#F8FAFC; }
  input:focus, select:focus { border-color:var(--primary); outline:none; background:#fff; box-shadow:0 0 0 4px rgba(79, 70, 229, 0.12); }
  
  .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 8px; border-radius: 12px; border: 1px solid #E2E8F0; }

  .stat-card{background:linear-gradient(135deg, #1E1B4B 100%, #312E81 0%);color:#fff;border-radius:16px;padding:16px;box-shadow:0 10px 25px rgba(30,27,75,0.3);margin-bottom:10px;}
  .stat-number{font-size:24px;font-weight:800;color:#F8FAFC;margin-top:4px;font-family:'Quicksand',sans-serif;}
  
  .progress-bar{background:rgba(255,255,255,0.15);border-radius:8px;height:8px;width:100%;margin-top:8px;overflow:hidden;}
  .progress-fill{background:var(--emerald-gradient);height:100%;width:0%;border-radius:8px;}
  
  #map { height: 320px; width: 100%; border-radius: 14px; margin-top: 10px; border: 2px solid #E2E8F0; }
  .watermark-img{max-width:100%;border-radius:12px;margin-top:8px;border:2px solid #1E1B4B;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 24px;border-radius:28px;font-size:13px;font-weight:700;z-index:1200;box-shadow:0 15px 35px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);text-align:center;width:90%;max-width:400px;}
  
  .btn-qty-num { background: #F1F5F9; border: 1px solid #CBD5E1; color: #334155; width: 36px; height: 36px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  .btn-qty-num:active { background: var(--amber); color: #0F172A; }
  
  .history-box { background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 12px; padding: 12px; margin-top: 12px; max-height: 200px; overflow-y: auto; }
  .history-item { border-bottom: 1px solid #E2E8F0; padding: 6px 0; font-size: 12px; }
  
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15, 23, 42, 0.85);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:center;z-index:999;padding:12px;}
  .modal-content{background:#fff;padding:22px;border-radius:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,0.5);}
  .hidden{display:none !important;}

  @media (min-width: 768px) {
    body { padding: 16px; }
    .grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .grid-products { grid-template-columns: 360px minmax(0, 1fr); }
    .nav-btns { width: auto; overflow-x: visible; }
  }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    updatePassword, reauthenticateWithCredential, EmailAuthProvider, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs,
    serverTimestamp, enableIndexedDbPersistence, query, orderBy, limit, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCGCHPxhUnZzwjXhfw3hcy-9VPi9RrZ6HY",
    authDomain: "project-4126159910229398131.firebaseapp.com",
    projectId: "project-4126159910229398131",
    storageBucket: "project-4126159910229398131.firebasestorage.app",
    messagingSenderId: "87655220343",
    appId: "1:87655220343:web:15576d27653acbee16f272",
    measurementId: "G-JK9WGF52FY"
  };

  const app = initializeApp(firebaseConfig);
  const authSvc = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  const secondaryApp = initializeApp(firebaseConfig, "secondary");
  const secondaryAuth = getAuth(secondaryApp);

  let currentUser = null;
  let currentTab = 'sales';
  let stores = [], orders = [], users = [], checkins = [], kpiTargets = [];
  
  let products = [
    { id: "p1", code: "11YS/", name: "Young Star Slim BC", dvt: "cây", stockDau: 51, stockCuoi: 34, tyLeQuyDoi: 50, dvt1: "sl_LE", price: 15000 },
    { id: "p2", code: "11Z1", name: "TLSG_Quẹt Đ/tử", dvt: "cái", stockDau: 38, stockCuoi: 38, tyLeQuyDoi: 1000, dvt1: "", price: 5000 },
    { id: "p3", code: "11SGSX/", name: "Sài Gòn Star xanh super slim BC", dvt: "cây", stockDau: 2567, stockCuoi: 3369, tyLeQuyDoi: 50, dvt1: "sl_LE", price: 18000 }
  ];

  let currentCart = {};
  let activeVisitedStore = null;
  let html5QrScanner = null;
  let isMapVisible = false;
  let leafletMapInstance = null;
  let managerMarker = null;
  let searchStoreTerm = "", filterRoute = "ALL";
  let isReturnOrderMode = false;
  let orderFilterKeyword = "", orderFilterStatus = "ALL";

  let adminSearchPrd = "";
  let adminFilterDvt = "ALL";
  let adminSortBy = "code";

  let customerSearchKey = "";

  let idbDb = null;
  function initIndexedDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open("DMS_OfflineDB", 2);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { idbDb = request.result; resolve(idbDb); };
      request.onupgradeneeded = (e) => {
        const dbInstance = e.target.result;
        if (!dbInstance.objectStoreNames.contains("offlineOrders")) dbInstance.createObjectStore("offlineOrders", { keyPath: "id", autoIncrement: true });
        if (!dbInstance.objectStoreNames.contains("offlineCheckins")) dbInstance.createObjectStore("offlineCheckins", { keyPath: "id", autoIncrement: true });
      };
    });
  }

  async function saveToOfflineStore(storeName, data) {
    if (!idbDb) await initIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = idbDb.transaction([storeName], "readwrite");
      const store = transaction.objectStore(storeName);
      const request = store.add(data);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function getFromOfflineStore(storeName) {
    if (!idbDb) await initIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = idbDb.transaction([storeName], "readonly");
      const store = transaction.objectStore(storeName);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function clearOfflineStore(storeName) {
    if (!idbDb) await initIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = idbDb.transaction([storeName], "readwrite");
      const store = transaction.objectStore(storeName);
      const request = store.clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  window.addEventListener('online', async () => {
    toast("🌐 Đã kết nối mạng! Đang đồng bộ dữ liệu Offline...");
    try {
      const pendingOrders = await getFromOfflineStore("offlineOrders");
      for (const ord of pendingOrders) { delete ord.id; await addDoc(collection(db, "orders"), ord); }
      await clearOfflineStore("offlineOrders");

      const pendingCheckins = await getFromOfflineStore("offlineCheckins");
      for (const chk of pendingCheckins) { delete chk.id; await addDoc(collection(db, "checkins"), chk); }
      await clearOfflineStore("offlineCheckins");
      toast("✅ Đồng bộ dữ liệu thành công!");
      renderUI();
    } catch (e) {}
  });

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
    const R = 6371e3, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  const MAX_PHOTO_BASE64_BYTES = 700 * 1024;

  function createWatermarkedImage(file, infoText) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const draw = (maxWidth, quality) => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const stripH = Math.max(50, Math.round(canvas.height * 0.16));
            ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
            ctx.fillRect(0, canvas.height - stripH, canvas.width, stripH);
            ctx.fillStyle = "#F59E0B";
            ctx.font = "bold 13px Plus Jakarta Sans, sans-serif";
            ctx.fillText(`📍 DMS: ${infoText.storeName}`, 12, canvas.height - stripH + 18);
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "10px Plus Jakarta Sans, sans-serif";
            ctx.fillText(`NV: [${infoText.salesCode}] ${infoText.salesName}`, 12, canvas.height - stripH + 34);
            ctx.fillText(`GPS: ${infoText.lat.toFixed(5)}, ${infoText.lng.toFixed(5)} | ${new Date().toLocaleString('vi-VN')}`, 12, canvas.height - stripH + 48);
            return canvas.toDataURL("image/jpeg", quality);
          };

          let dataUrl = draw(480, 0.55);
          if (dataUrl.length > MAX_PHOTO_BASE64_BYTES) dataUrl = draw(360, 0.45);
          resolve(dataUrl);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  window.handleLogin = async function(e) {
    e.preventDefault();
    const email = document.getElementById('logUser').value.trim();
    const pass = document.getElementById('logPass').value.trim();
    try {
      await signInWithEmailAndPassword(authSvc, email, pass);
    } catch (err) { alert("Sai tài khoản hoặc mật khẩu."); }
  };

  onAuthStateChanged(authSvc, async (user) => {
    if (!user) {
      currentUser = null;
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('appView').classList.add('hidden');
      return;
    }
    const profileSnap = await getDoc(doc(db, "users", user.uid));
    if (!profileSnap.exists()) return alert("Tài khoản chưa phân quyền.");
    const profile = profileSnap.data();
    if (profile.active === false) { alert("⛔ Tài khoản bị khóa."); await signOut(authSvc); return; }
    currentUser = { uid: user.uid, email: user.email, name: profile.name, code: profile.code, role: profile.role };
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    
    const hashTab = window.location.hash.replace('#', '');
    if (hashTab && ['dashboard', 'sales', 'stores', 'customers', 'orders', 'productsAdmin', 'kpi', 'audit', 'users'].includes(hashTab)) {
      currentTab = hashTab;
    } else {
      currentTab = (profile.role === 'sales') ? 'sales' : 'dashboard';
    }

    await initIndexedDB();
    attachListeners();
    renderUI();
  });

  window.handleLogout = async function() { await signOut(authSvc); };
  window.openChangePasswordModal = function() { document.getElementById('changePassModal').classList.remove('hidden'); };
  window.closeChangePasswordModal = function() { document.getElementById('changePassModal').classList.add('hidden'); };

  window.submitChangePassword = async function(e) {
    e.preventDefault();
    const oldP = document.getElementById('oldPassInput').value;
    const newP = document.getElementById('newPassInput').value;
    const confirmP = document.getElementById('confirmPassInput').value;
    if (newP !== confirmP) return alert("Mật khẩu mới không trùng khớp!");
    try {
      const cred = EmailAuthProvider.credential(authSvc.currentUser.email, oldP);
      await reauthenticateWithCredential(authSvc.currentUser, cred);
      await updatePassword(authSvc.currentUser, newP);
      alert("✅ Đổi mật khẩu thành công!");
      closeChangePasswordModal();
    } catch (err) { alert("⛔ Mật khẩu cũ không đúng."); }
  };

  window.pinStoreGPS = function(storeId) {
    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      if (navigator.onLine) await updateDoc(doc(db, "stores", storeId), { lat, lng });
      toast(`📌 Đã ghim GPS thành công!`);
      renderUI();
    }, () => alert("Lỗi lấy vị trí GPS điện thoại."));
  };

  window.doCheckinWithPhoto = function(storeId) {
    const store = stores.find(s => s.id === storeId);
    const fileInput = document.getElementById(`img_${store.id}`);
    if (!fileInput || !fileInput.files[0]) return alert("⛔ BẮT BUỘC CHỤP ẢNH TẠI ĐIỂM BÁN!");
    const file = fileInput.files[0];

    navigator.geolocation.getCurrentPosition(async pos => {
      const userLat = pos.coords.latitude, userLng = pos.coords.longitude, accuracy = pos.coords.accuracy;
      
      if (navigator.onLine && (!store.lat || store.lat === 0 || !store.lng || store.lng === 0)) {
        try {
          await updateDoc(doc(db, "stores", storeId), { lat: userLat, lng: userLng });
          store.lat = userLat; store.lng = userLng;
        } catch (e) {}
      }

      let distance = 0;
      if (store.lat && store.lng) {
        distance = getDistanceMeters(userLat, userLng, store.lat, store.lng);
        if (distance > 30) return alert(`⛔ CHECK-IN THẤT BẠI!\nKhoảng cách: ${Math.round(distance)}m (>30m).`);
      }

      try {
        const photo = await createWatermarkedImage(file, { storeName: store.name, salesCode: currentUser.code, salesName: currentUser.name, lat: userLat, lng: userLng });
        const checkinData = {
          salesUid: currentUser.uid, salesName: currentUser.name, salesCode: currentUser.code,
          storeName: store.name, storeId: store.id, lat: userLat, lng: userLng, accuracy, distance,
          photo, status: 'Checked-in (<30m)', createdAt: new Date()
        };

        if (navigator.onLine) {
          await addDoc(collection(db, "checkins"), { ...checkinData, createdAt: serverTimestamp() });
        } else {
          await saveToOfflineStore("offlineCheckins", checkinData);
          toast("📴 Đã lưu Check-in Offline!");
        }

        activeVisitedStore = store;
        toast(`✅ Checked-in thành công!`);
        renderUI();
      } catch (err) { alert("Lỗi lưu check-in: " + err.message); }
    }, () => alert("⛔ Hãy bật GPS trên điện thoại."), { enableHighAccuracy: true });
  };

  window.uploadPOSMPhoto = function(storeId) {
    const fileInput = document.getElementById(`posm_${storeId}`);
    if (!fileInput || !fileInput.files[0]) return alert("Chọn ảnh POSM!");
    navigator.geolocation.getCurrentPosition(async pos => {

  window.selectQuickQty = function(prdId, qty) {
    const p = products.find(x => x.id === prdId);
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    currentCart[prdId].qty = qty;
    const packRatio = p?.tyLeQuyDoi || 50;
    currentCart[prdId].kien = packRatio > 0 ? Math.floor(qty / packRatio) : 0;
    currentCart[prdId].le = packRatio > 0 ? qty % packRatio : qty;
    renderUI();
  };

  window.updateCartDetail = function(prdId, field, val) {
    const p = products.find(x => x.id === prdId);
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    currentCart[prdId][field] = Number(val) || 0;
    const packRatio = p?.tyLeQuyDoi || 50;
    if (field === 'kien' || field === 'le') {
      currentCart[prdId].qty = (currentCart[prdId].kien * packRatio) + currentCart[prdId].le;
    }
    renderUI();
  };

  window.loadLastOrder = function() {
    if (!activeVisitedStore) return;
    const lastOrd = orders.filter(o => o.storeId === activeVisitedStore.id && o.status !== 'Đã hủy').sort((a,b) => (b.createdAt?.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt?.toMillis ? a.createdAt.toMillis() : 0))[0];
    if (!lastOrd || !lastOrd.items) return alert("Quầy này chưa có đơn cũ!");
    currentCart = {};
    lastOrd.items.forEach(it => { currentCart[it.id] = { qty: it.qty||0, kien: it.kien||0, le: it.le||0 }; });
    toast("🔄 Đã tải lại toa đơn gần nhất!");

    toast(isReturnOrderMode ? "🔄 Chế độ: ĐƠN TRẢ HÀNG" : "🛒 Chế độ: ĐƠN BÁN HÀNG");
    renderUI();

  window.submitOrder = async function() {
    if (!activeVisitedStore) return alert("Chưa chọn quầy hàng!");
    const items = [];
    let rawSubtotal = 0;

    products.forEach(p => {
      const c = currentCart[p.id];
      if (c && (c.qty > 0 || c.kien > 0 || c.le > 0)) {
        const itemTotal = (p.price || 0) * (c.qty || 1);
        rawSubtotal += itemTotal;
        items.push({ id: p.id, code: p.code, name: p.name, dvt: p.dvt || 'cây', qty: c.qty, kien: c.kien, le: c.le, price: p.price });
      }
    });

    if (items.length === 0) return alert("Vui lòng chọn số lượng hàng!");

    const unpaidOrdersTotal = orders
      .filter(o => o.storeId === activeVisitedStore.id && o.paymentStatus !== 'Đã thanh toán' && o.status !== 'Đã hủy')
      .reduce((s, o) => s + (o.amount || 0), 0);
    
    const storeCreditLimit = activeVisitedStore.creditLimit || 20000000;
    if (!isReturnOrderMode && (unpaidOrdersTotal + rawSubtotal) > storeCreditLimit) {
      return alert(`⛔ Khóa đơn: Vượt hạn mức nợ (${storeCreditLimit.toLocaleString()}đ)!`);
    }

    const finalAmount = rawSubtotal;
    const orderData = {
      salesUid: currentUser.uid, salesName: currentUser.name, salesCode: currentUser.code,
      storeId: activeVisitedStore.id, maDTPN: `${activeVisitedStore.code||'KH'}_${activeVisitedStore.name}`,
      items, amount: isReturnOrderMode ? -finalAmount : finalAmount, rawSubtotal,
      isReturnOrder: isReturnOrderMode, paymentStatus: 'Công nợ', status: 'Chờ duyệt', createdAt: new Date()
    };

    if (navigator.onLine) {
      await addDoc(collection(db, "orders"), { ...orderData, createdAt: serverTimestamp() });
      toast("🚀 Đã gửi đơn hàng thành công!");
    } else {
      await saveToOfflineStore("offlineOrders", orderData);
      toast("📴 Đã lưu đơn hàng vào Offline!");
    }
    
    currentCart = {}; activeVisitedStore = null; isReturnOrderMode = false; renderUI();
  };

  window.downloadCSV = function(filename, rows) {
    const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = filename; link.click();
  };

  window.exportDailyOrdersCSV = function() {
    const todayStr = new Date().toDateString();
    const rows = [["MaDTPN", "TenQuay", "MaNV", "TenNV", "NgayTao", "LoaiDon", "Ma VTHH", "TenVTHH", "Dvt", "SoLuong", "Kien", "Le", "DonGia", "ThanhTien", "TrangThai"]];
    orders.forEach(o => {
      const createdDate = o.createdAt?.toDate ? o.createdAt.toDate() : new Date();
      if (createdDate.toDateString() === todayStr && o.status !== 'Đã hủy') {
        (o.items || []).forEach(it => {
          rows.push([o.maDTPN, o.maDTPN.split('_')[1]||'', o.salesCode, o.salesName, createdDate.toLocaleString('vi-VN'), o.isReturnOrder?'TRẢ HÀNG':'BÁN HÀNG', it.code, it.name, it.dvt, it.qty, it.kien, it.le, it.price, (it.price*it.qty), o.status]);
        });
      }
    });
    downloadCSV(`ToaDonDay_${Date.now()}.csv`, rows);
  };

  window.importProductsExcel = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        toast("⏳ Đang đọc danh mục vật tư...");
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        
        let rawProducts = [];
        for (let i = 0; i < jsonRows.length; i++) {
          const r = jsonRows[i];
          const code = r[1] ? String(r[1]).trim() : '';
          const name = r[2] ? String(r[2]).trim() : '';
          if (code && code !== 'Ma VTHH' && code !== 'undefined') {
            rawProducts.push({
              code: code, name: name, dvt: r[4] ? String(r[4]).trim() : 'cây',
              stockDau: Number(r[5]) || 0, stockCuoi: Number(r[6]) || 0,
              tyLeQuyDoi: Number(r[7]) || 50, dvt1: r[8] ? String(r[8]).trim() : '', price: 15000
            });
          }
        }

        if (rawProducts.length > 0) {
          const uniqueMap = new Map();
          rawProducts.forEach(p => uniqueMap.set(p.code, p));
          const uniqueList = Array.from(uniqueMap.values());

          toast(`⏳ Đang lưu ${uniqueList.length} vật tư lên Firebase...`);
          for (let i = 0; i < uniqueList.length; i += 450) {
            const chunk = uniqueList.slice(i, i + 450);
            const batch = writeBatch(db);
            chunk.forEach(p => batch.set(doc(db, "products", p.code), p));
            await batch.commit();
          }
          toast(`✅ Đồng bộ thành công ${uniqueList.length} vật tư!`);
          renderUI();
        } else { alert("Không tìm thấy dữ liệu vật tư!"); }
      } catch (err) { alert("Lỗi: " + err.message); }
    };
    reader.readAsArrayBuffer(file);
  };

      let filteredCustomers = stores.filter(s => 
        (s.code||'').toLowerCase().includes(customerSearchKey) ||
        (s.name||'').toLowerCase().includes(customerSearchKey) || 
        (s.address||'').toLowerCase().includes(customerSearchKey) ||
        (s.phone||'').toLowerCase().includes(customerSearchKey) ||
        (s.zalo||'').toLowerCase().includes(customerSearchKey)
      );

      main.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <h2 style="font-size:18px; font-weight:800;"><i class="fa-solid fa-address-book" style="color:var(--amber);"></i> Khách Hàng (18.703)</h2>
          <label class="btn btn-green btn-sm" style="cursor:pointer;margin:0;"><i class="fa-solid fa-file-arrow-up"></i> Tải Excel <input type="file" accept=".xlsx, .csv" onchange="importCustomersExcel(event)" style="display:none;"></label>
        </div>
        <div class="card" style="margin-bottom:10px;">
          <input type="text" placeholder="🔍 Tìm kiếm nhanh (Mã, Tên, SĐT, Địa chỉ)..." oninput="onCustomerSearchInput(this.value)" value="${customerSearchKey}" style="margin:0;">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <small id="customerCount" style="color:var(--text-muted); font-weight:700;">Hiển thị: <b>${filteredCustomers.length}</b> / ${stores.length} khách hàng</small>
        </div>
        <div id="customerCardsContainer">
          ${filteredCustomers.slice(0, 100).map(s => `
            <div class="customer-card-mobile">
              <div class="cust-header">
                <span class="cust-code">${s.code || 'KH'}</span>
                ${s.lat && s.lng ? '<span class="badge badge-success"><i class="fa-solid fa-location-dot"></i> Đã ghim GPS</span>' : '<span class="badge badge-pending">Chưa ghim</span>'}
              </div>
              <div class="cust-name">${s.name}</div>
              <div class="cust-info"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${s.address || 'Chưa cập nhật địa chỉ'}</div>
              <div class="cust-info"><i class="fa-solid fa-phone" style="color:var(--emerald);"></i> SĐT: <a href="tel:${s.phone}" style="color:var(--emerald);font-weight:700;text-decoration:none;">${s.phone || '—'}</a></div>
              <div class="cust-info"><i class="fa-brands fa-whatsapp" style="color:var(--primary);"></i> Zalo: ${s.zalo || '—'}</div>
              <div class="cust-actions">
                <button class="btn btn-amber btn-sm" style="flex:1;justify-content:center;" onclick="pinStoreGPS('${s.id}')"><i class="fa-solid fa-thumbtack"></i> Ghim GPS Nhanh</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    else if (currentTab === 'productsAdmin' && backOffice) {
      let filteredAdminProducts = products.filter(p => (p.code||'').toLowerCase().includes(adminSearchPrd) || (p.name||'').toLowerCase().includes(adminSearchPrd));
      main.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <h2 style="font-size:18px; font-weight:800;"><i class="fa-solid fa-boxes-stacked" style="color:var(--amber);"></i> Quản Lý Vật Tư</h2>
          <label class="btn btn-green btn-sm" style="cursor:pointer;margin:0;"><i class="fa-solid fa-file-arrow-up"></i> Tải Excel <input type="file" accept=".xlsx, .csv" onchange="importProductsExcel(event)" style="display:none;"></label>
        </div>
        <div class="card" style="margin-bottom:10px;">
          <input type="text" placeholder="🔍 Tìm vật tư..." oninput="onAdminSearchInput(this.value)" value="${adminSearchPrd}" style="margin:0;">
        </div>
        <div class="table-responsive">
          <table>
            <thead><tr><th>Mã VTHH</th><th>Tên Vật Tư</th><th>ĐVT</th><th>Giá</th></tr></thead>
            <tbody id="adminProductsTbody">
              ${filteredAdminProducts.slice(0, 100).map(p => `
                <tr><td><b>${p.code}</b></td><td style="font-weight:600;">${p.name}</td><td>${p.dvt}</td><td><b>${(p.price||0).toLocaleString()}đ</b></td></tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    else if (currentTab === 'orders') {
      const myOrders = isSales ? orders.filter(o => o.salesUid === currentUser.uid) : orders;
      const filteredOrders = myOrders.filter(o => {
        const matchKey = (o.maDTPN||'').toLowerCase().includes(orderFilterKeyword) || (o.salesName||'').toLowerCase().includes(orderFilterKeyword);
        const matchStatus = orderFilterStatus === 'ALL' || o.status === orderFilterStatus;
        return matchKey && matchStatus;
      });

      main.innerHTML = `
        <h2 style="font-size:18px; font-weight:800; margin-bottom:10px;"><i class="fa-solid fa-box-archive" style="color:var(--amber);"></i> Danh Sách Đơn Hàng</h2>
        <div class="card" style="margin-bottom:10px;">
          <input type="text" placeholder="🔍 Tìm đơn hàng..." onkeyup="setOrderFilterKeyword(this.value)" style="margin-bottom:6px;">
          <select onchange="setOrderFilterStatus(this.value)" style="margin:0;">
            <option value="ALL">-- Tất cả trạng thái --</option>
            <option value="Chờ duyệt">Chờ duyệt</option>
            <option value="Đã duyệt">Đã duyệt</option>
            <option value="Đã hủy">Đã hủy</option>
          </select>
        </div>
        <div class="table-responsive">
          <table>
            <thead><tr><th>Mã DTPN</th><th>Tổng Tiền</th><th>Trạng Thái</th><th>Thao Tác</th></tr></thead>
            <tbody>
              ${filteredOrders.map(o => `
                <tr>
                  <td><b>${o.maDTPN}</b></td>
                  <td><b style="color:var(--rose);">${(o.amount||0).toLocaleString()}đ</b></td>
                  <td><span class="badge ${o.status==='Đã hủy'?'badge-danger':(o.status==='Đã duyệt'?'badge-success':'badge-pending')}">${o.status}</span></td>
                  <td>
                    <button class="btn btn-amber btn-sm" onclick="printReceipt('${o.id}')"><i class="fa-solid fa-print"></i></button>
                    ${backOffice && o.status==='Chờ duyệt' ? `<button class="btn btn-green btn-sm" onclick="approveOrder('${o.id}')">Duyệt</button>` : ''}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    else if (currentTab === 'kpi') {
      main.innerHTML = `
        <h2 style="font-size:18px; font-weight:800; margin-bottom:10px;"><i class="fa-solid fa-bullseye" style="color:var(--amber);"></i> KPI & Doanh Số</h2>
        <div class="card"><p style="font-size:13px;color:var(--text-muted);">Đang theo dõi chỉ tiêu doanh số cá nhân và đội ngũ.</p></div>
      `;
    }

    else if (currentTab === 'audit' && backOffice) {
      main.innerHTML = `
        <h2 style="font-size:18px; font-weight:800; margin-bottom:10px;"><i class="fa-solid fa-shield-halved" style="color:var(--purple);"></i> Bằng Chứng Check-in</h2>
        <div class="grid">
          ${checkins.map(c => `
            <div class="card">
              <b>Tiệm: ${c.storeName}</b> <span class="badge badge-success">${c.status}</span><br>
              <small>Sales: [${c.salesCode}] ${c.salesName}</small><br>
              ${c.photo?`<img src="${c.photo}" class="watermark-img">`:''}
            </div>
          `).join('')}
        </div>
      `;
    }

    else if (currentTab === 'users' && isAdmin) {
      main.innerHTML = `
        <h2 style="font-size:18px; font-weight:800; margin-bottom:10px;"><i class="fa-solid fa-users" style="color:var(--primary);"></i> Quản Lý Nhân Viên</h2>
        <div class="table-responsive">
          <table>
            <thead><tr><th>Mã</th><th>Tên</th><th>Email</th><th>Vai Trò</th></tr></thead>
            <tbody>
              ${users.map(u => `<tr><td><b>${u.code}</b></td><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;
    }
  }

  function setNav(id, visible) { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !visible); }
  window.switchTab = function(tab) { currentTab = tab; window.location.hash = tab; renderUI(); };
</script>
</head>

<body>
<div class="app">
  <div id="loginView" class="login-container">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:20px;">
        <h1 class="brand-title" style="justify-content:center;font-size:24px;color:#fff;"><i class="fa-solid fa-cloud" style="color:var(--primary);"></i> DMS <span>SFA</span></h1>
        <p style="font-size:11px;color:#94A3B8;margin-top:4px;">ROYAL ELEGANT PRO</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <label style="font-size:12px;font-weight:700;color:#CBD5E1;">Email:</label>
        <div class="input-icon-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="logUser" required autocomplete="username" placeholder="admin@dms.com">
        </div>
        <label style="font-size:12px;font-weight:700;color:#CBD5E1;margin-top:6px;display:block;">Mật Khẩu:</label>
        <div class="input-icon-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="logPass" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn btn-amber" style="width:100%;padding:14px;margin-top:14px;justify-content:center;font-size:15px;border-radius:12px;font-weight:800;">ĐĂNG NHẬP</button>
      </form>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div>
        <div class="brand-title" style="font-size:16px;"><i class="fa-solid fa-network-wired" style="color:var(--amber);"></i> DMS SFA</div>
        <small id="userInfo" style="color:#94A3B8;font-size:10px; font-weight:600;"></small>
      </div>
      <div class="nav-btns">
        <button id="navDash" class="btn btn-amber btn-sm hidden" onclick="switchTab('dashboard')"><i class="fa-solid fa-chart-pie"></i> Dash</button>
        <button id="navSales" class="btn btn-sm hidden" onclick="switchTab('sales')"><i class="fa-solid fa-cart-shopping"></i> Bán Hàng</button>
        <button id="navStores" class="btn btn-sm hidden" onclick="switchTab('stores')"><i class="fa-solid fa-store"></i> Tuyến</button>
        <button id="navCustomers" class="btn btn-sm hidden" onclick="switchTab('customers')"><i class="fa-solid fa-address-book"></i> Khách Hàng</button>
        <button id="navProductsAdmin" class="btn btn-sm hidden" onclick="switchTab('productsAdmin')"><i class="fa-solid fa-boxes-stacked"></i> Hàng Hóa</button>
        <button id="navOrders" class="btn btn-sm" onclick="switchTab('orders')"><i class="fa-solid fa-box-archive"></i> Đơn</button>
        <button id="navKpi" class="btn btn-sm" onclick="switchTab('kpi')"><i class="fa-solid fa-bullseye"></i> KPI</button>
        <button id="navAudit" class="btn btn-sm hidden" onclick="switchTab('audit')"><i class="fa-solid fa-shield-halved"></i> Audit</button>
        <button id="navUsers" class="btn btn-sm hidden" onclick="switchTab('users')"><i class="fa-solid fa-users"></i> NV</button>
        <button class="btn btn-purple btn-sm" onclick="openChangePasswordModal()"><i class="fa-solid fa-key"></i></button>
        <button class="btn btn-red btn-sm" onclick="handleLogout()"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
    <div class="panel" id="mainContent"></div>
  </div>
</div>

<div id="changePassModal" class="modal hidden"><div class="modal-content">
  <h3 style="font-size:16px; font-weight:800;"><i class="fa-solid fa-key"></i> Đổi Mật Khẩu</h3>
  <form onsubmit="submitChangePassword(event)" style="margin-top:10px;">
    <label>Mật Khẩu Cũ:</label><input type="password" id="oldPassInput" required>
    <label>Mật Khẩu Mới:</label><input type="password" id="newPassInput" required>
    <label>Xác Nhận Mật Khẩu:</label><input type="password" id="confirmPassInput" required>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button type="submit" class="btn btn-green" style="flex:1;justify-content:center;font-weight:800;">Lưu</button>
      <button type="button" class="btn btn-red" onclick="closeChangePasswordModal()" style="font-weight:800;">Hủy</button>
    </div>
  </form>
</div></div>

<div id="qrModal" class="modal hidden"><div class="modal-content">
  <h3 style="font-size:16px; font-weight:800;"><i class="fa-solid fa-qrcode"></i> Quét Mã QR</h3>
  <div id="reader" style="width:100%;margin-top:10px;border-radius:12px;overflow:hidden;"></div>
  <button class="btn btn-red" style="width:100%;margin-top:12px;justify-content:center;font-weight:800;" onclick="closeQRScanner()">Đóng Camera</button>
</div></div>

</body>
</html>
