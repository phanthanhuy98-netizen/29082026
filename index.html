<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMS Cloud SFA - Enterprise Ultimate Production System</title>
<meta name="theme-color" content="#12213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root { --navy:#12213D; --amber:#FCA311; --paper:#F6F1E6; --line:#D9D0BC; --muted:#6B6558; --green:#2D6A4F; --red:#C1121F; --purple:#5B3A8E; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--navy);color:#1a1a1a;padding:8px;}
  .app{max-width:1440px;margin:0 auto;}
  .panel{background:var(--paper);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,0.3);margin-top:10px;}
  h1,h2,h3,h4{font-family:'Oswald',sans-serif;color:var(--navy);}
  .topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;flex-wrap:wrap;gap:8px;}
  .nav-btns{display:flex;gap:4px;flex-wrap:wrap;}
  .btn{background:var(--navy);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-purple{background:var(--purple);color:#fff;}
  .btn-sm{padding:4px 8px;font-size:11px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .badge{display:inline-block;padding:3px 8px;background:#EFE7D6;border-radius:4px;font-size:11px;font-weight:700;}
  .badge-success{background:#D8F3DC;color:var(--green);}
  .badge-pending{background:#FFF3BF;color:#B57700;}
  .badge-danger{background:#F8D7DA;color:var(--red);}
  input, select, textarea { width:100%; padding:8px; margin:4px 0 8px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:13px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:6px; border-bottom:1px solid var(--line); font-size:12px; }
  th { background:#EFE7D6; color:var(--navy); }
  .login-box{max-width:400px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.4);}
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;z-index:999;}
  .modal-content{background:#fff;padding:20px;border-radius:16px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto;}
  .hidden{display:none !important;}
  .stat-number{font-size:24px;font-weight:700;color:var(--navy);margin-top:4px;}
  #map { height: 350px; width: 100%; border-radius: 12px; margin-top: 10px; z-index: 1; }
  .watermark-img{max-width:100%;border-radius:8px;margin-top:6px;border:2px solid var(--navy);}
  .alert-box{background:#F8D7DA;color:var(--red);padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px;font-weight:600;}
  .warn-box{background:#FFF3BF;color:#8a6300;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px;font-weight:600;}
  .progress-bar{background:#e0e0e0;border-radius:8px;height:12px;width:100%;margin-top:4px;overflow:hidden;}
  .progress-fill{background:var(--green);height:100%;width:0%;transition:width 0.3s;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:1200;}
  
  .sales-table th, .sales-table td { text-align: center; }
  .btn-qty-num { background: #e9ecef; border: 1px solid #ced4da; color: #333; width: 26px; height: 26px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  .btn-qty-num:hover { background: var(--amber); color: #000; }
  .history-box { background: #f8f9fa; border: 1px dashed var(--line); border-radius: 8px; padding: 10px; margin-top: 12px; max-height: 220px; overflow-y: auto; }
  .history-item { border-bottom: 1px solid #e9ecef; padding: 6px 0; font-size: 11px; }

  @media (max-width: 768px) {
    body { padding: 4px; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .nav-btns { width: 100%; overflow-x: auto; padding-bottom: 4px; flex-wrap: nowrap; }
    .grid { grid-template-columns: 1fr !important; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
    #map { height: 260px; }
  }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    updatePassword, reauthenticateWithCredential, EmailAuthProvider, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs,
    serverTimestamp, enableIndexedDbPersistence, query, orderBy, limit, where, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCGCHPxhUnZzwjXhfw3hcy-9VPi9RrZ6HY",
    authDomain: "project-4126159910229398131.firebaseapp.com",
    projectId: "project-4126159910229398131",
    storageBucket: "project-4126159910229398131.firebasestorage.app",
    messagingSenderId: "87655220343",
    appId: "1:87655220343:web:15576d27653acbee16f272",
    measurementId: "G-JK9WGF52FY"
  };

  const app = initializeApp(firebaseConfig);
  const authSvc = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  const secondaryApp = initializeApp(firebaseConfig, "secondary");
  const secondaryAuth = getAuth(secondaryApp);

  let currentUser = null;
  let currentTab = 'sales';
  let stores = [], orders = [], users = [], checkins = [], products = [], promos = [], auditLogs = [];
  let currentCart = {};
  let activeVisitedStore = null;
  let html5QrScanner = null;
  let isMapVisible = false;
  let leafletMapInstance = null;
  let searchStoreTerm = "", searchProductTerm = "", filterRoute = "ALL";
  let isReturnOrderMode = false;

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
    const R = 6371e3, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  const MAX_PHOTO_BASE64_BYTES = 700 * 1024;

  function createWatermarkedImage(file, infoText) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const draw = (maxWidth, quality) => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const stripH = Math.max(50, Math.round(canvas.height * 0.16));
            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            ctx.fillRect(0, canvas.height - stripH, canvas.width, stripH);
            ctx.fillStyle = "#FCA311";
            ctx.font = "bold 13px Inter, sans-serif";
            ctx.fillText(`📍 DMS: ${infoText.storeName}`, 10, canvas.height - stripH + 18);
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "10px Inter, sans-serif";
            ctx.fillText(`NV: [${infoText.salesCode}] ${infoText.salesName}`, 10, canvas.height - stripH + 34);
            ctx.fillText(`GPS: ${infoText.lat.toFixed(5)}, ${infoText.lng.toFixed(5)} | ${new Date().toLocaleString('vi-VN')}`, 10, canvas.height - stripH + 48);
            return canvas.toDataURL("image/jpeg", quality);
          };

          let dataUrl = draw(480, 0.55);
          if (dataUrl.length > MAX_PHOTO_BASE64_BYTES) dataUrl = draw(360, 0.45);
          if (dataUrl.length > MAX_PHOTO_BASE64_BYTES) dataUrl = draw(280, 0.35);
          resolve(dataUrl);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function parsePackRatio(quycachStr) {
    if (!quycachStr) return 24;
    const parts = quycachStr.toLowerCase().split('x');
    return parts.length === 2 ? (Number(parts[1]) || 24) : 24;
  }

  async function writeAuditLog(action, targetType, targetId, detail) {
    try {
      await addDoc(collection(db, "auditLogs"), {
        actorUid: currentUser.uid, actorName: currentUser.name, action, targetType, targetId, detail,
        createdAt: serverTimestamp()
      });
    } catch (e) {}
  }

  async function autoCleanOldOrders(storeId) {
    try {
      const tenDaysAgoMs = Date.now() - (10 * 24 * 60 * 60 * 1000);
      const qOld = query(collection(db, "orders"), where("storeId", "==", storeId));
      const snap = await getDocs(qOld);
      snap.forEach(async (dSnap) => {
        const data = dSnap.data();
        if (data.createdAt && data.createdAt.toMillis() < tenDaysAgoMs) {
          await deleteDoc(doc(db, "orders", dSnap.id));
        }
      });
    } catch (e) {}
  }

  function isPromoActive(p) {
    const now = new Date();
    if (p.startDate && new Date(p.startDate) > now) return false;
    if (p.endDate && new Date(p.endDate) < now) return false;
    return true;
  }

  window.handleLogin = async function(e) {
    e.preventDefault();
    const email = document.getElementById('logUser').value.trim();
    const pass = document.getElementById('logPass').value.trim();
    try {
      await signInWithEmailAndPassword(authSvc, email, pass);
    } catch (err) { alert("Sai tài khoản hoặc mật khẩu."); }
  };

  onAuthStateChanged(authSvc, async (user) => {
    if (!user) {
      currentUser = null;
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('appView').classList.add('hidden');
      return;
    }
    const profileSnap = await getDoc(doc(db, "users", user.uid));
    if (!profileSnap.exists()) return alert("Tài khoản chưa phân quyền.");
    const profile = profileSnap.data();
    if (profile.active === false) { alert("⛔ Tài khoản bị khóa."); await signOut(authSvc); return; }
    currentUser = { uid: user.uid, email: user.email, name: profile.name, code: profile.code, role: profile.role };
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    currentTab = (profile.role === 'sales') ? 'sales' : 'dashboard';
    attachListeners();
    renderUI();
  });

  window.handleLogout = async function() { await signOut(authSvc); };
  window.openChangePasswordModal = function() { document.getElementById('changePassModal').classList.remove('hidden'); };
  window.closeChangePasswordModal = function() { document.getElementById('changePassModal').classList.add('hidden'); };

  window.submitChangePassword = async function(e) {
    e.preventDefault();
    const oldP = document.getElementById('oldPassInput').value;
    const newP = document.getElementById('newPassInput').value;
    const confirmP = document.getElementById('confirmPassInput').value;
    if (newP !== confirmP) return alert("Mật khẩu mới không trùng khớp!");
    try {
      const cred = EmailAuthProvider.credential(authSvc.currentUser.email, oldP);
      await reauthenticateWithCredential(authSvc.currentUser, cred);
      await updatePassword(authSvc.currentUser, newP);
      alert("✅ Đổi mật khẩu thành công!");
      closeChangePasswordModal();
    } catch (err) { alert("⛔ Mật khẩu cũ không đúng."); }
  };

  window.pinStoreGPS = function(storeId) {
    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      await updateDoc(doc(db, "stores", storeId), { lat, lng });
      toast(`📌 Đã ghim tọa độ GPS chuẩn cho quầy!`);
      renderUI();
    }, () => alert("Lỗi lấy vị trí GPS điện thoại."));
  };

  window.doCheckinWithPhoto = function(storeId) {
    const store = stores.find(s => s.id === storeId);
    const fileInput = document.getElementById(`img_${store.id}`);
    if (!fileInput || !fileInput.files[0]) return alert("⛔ BẮT BUỘC CHỤP ẢNH TẠI ĐIỂM BÁN!");
    const file = fileInput.files[0];

    navigator.geolocation.getCurrentPosition(async pos => {
      const userLat = pos.coords.latitude, userLng = pos.coords.longitude, accuracy = pos.coords.accuracy;
      let distance = 0;
      if (store.lat && store.lng) {
        distance = getDistanceMeters(userLat, userLng, store.lat, store.lng);
        if (distance > 30) return alert(`⛔ CHECK-IN THẤT BẠI!\nKhoảng cách: ${Math.round(distance)}m (>30m).`);
      }

      try {
        const photo = await createWatermarkedImage(file, { storeName: store.name, salesCode: currentUser.code, salesName: currentUser.name, lat: userLat, lng: userLng });
        await addDoc(collection(db, "checkins"), {
          salesUid: currentUser.uid, salesName: currentUser.name, salesCode: currentUser.code,
          storeName: store.name, storeId: store.id, lat: userLat, lng: userLng, accuracy, distance,
          photo, status: 'Checked-in (<30m)', createdAt: serverTimestamp()
        });

        activeVisitedStore = store;
        autoCleanOldOrders(store.id);
        toast(`✅ Checked-in: ${store.code||'KH'}_${store.name}`);
        renderUI();
      } catch (err) { alert("Lỗi lưu check-in: " + err.message); }
    }, () => alert("⛔ LỖI GPS: Hãy bật GPS."), { enableHighAccuracy: true });
  };

  window.uploadPOSMPhoto = function(storeId) {
    const fileInput = document.getElementById(`posm_${storeId}`);
    if (!fileInput || !fileInput.files[0]) return alert("Chọn ảnh POSM!");
    navigator.geolocation.getCurrentPosition(async pos => {
      const photo = await createWatermarkedImage(fileInput.files[0], { storeName: activeVisitedStore.name, salesCode: currentUser.code, salesName: currentUser.name, lat: pos.coords.latitude, lng: pos.coords.longitude });
      await addDoc(collection(db, "auditLogs"), { actorUid: currentUser.uid, actorName: currentUser.name, action: "POSM_DISPLAY_PHOTO", targetType: "stores", targetId: storeId, detail: photo, createdAt: serverTimestamp() });
      toast("📸 Đã gửi ảnh POSM thành công!");
    });
  };

  window.startQRScanner = function(storeId) {
    const store = stores.find(s => s.id === storeId);
    document.getElementById('qrModal').classList.remove('hidden');
    html5QrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrScanner.render(async (decodedText) => {
      if (decodedText === store.id || decodedText === store.name || decodedText === store.code) {
        html5QrScanner.clear();
        document.getElementById('qrModal').classList.add('hidden');
        activeVisitedStore = store;
        autoCleanOldOrders(store.id);
        toast(`✅ Xác thực QR thành công: ${store.name}`);
        renderUI();
      } else alert(`❌ Không đúng mã QR quầy.`);
    });
  };
  window.closeQRScanner = function() { if (html5QrScanner) html5QrScanner.clear(); document.getElementById('qrModal').classList.add('hidden'); };

  window.selectQuickQty = function(prdId, qty) {
    const p = products.find(x => x.id === prdId);
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    currentCart[prdId].qty = qty;
    const packRatio = parsePackRatio(p?.quycach);
    currentCart[prdId].kien = Math.floor(qty / packRatio);
    currentCart[prdId].le = qty % packRatio;
    renderUI();
  };

  window.updateCartDetail = function(prdId, field, val) {
    const p = products.find(x => x.id === prdId);
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    currentCart[prdId][field] = Number(val) || 0;
    
    const packRatio = parsePackRatio(p?.quycach);
    if (field === 'kien' || field === 'le') {
      currentCart[prdId].qty = (currentCart[prdId].kien * packRatio) + currentCart[prdId].le;
    }
    renderUI();
  };

  window.loadLastOrder = function() {
    if (!activeVisitedStore) return;
    const lastOrd = orders.filter(o => o.storeId === activeVisitedStore.id && o.status !== 'Đã hủy').sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0))[0];
    if (!lastOrd || !lastOrd.items) return alert("Quầy này chưa có toa đơn cũ!");
    currentCart = {};
    lastOrd.items.forEach(it => { currentCart[it.id] = { qty: it.qty||0, kien: it.kien||0, le: it.le||0 }; });
    toast("🔄 Đã tải lại toa đơn gần nhất!");
    renderUI();
  };

  window.toggleReturnMode = function() {
    isReturnOrderMode = !isReturnOrderMode;
    toast(isReturnOrderMode ? "🔄 Chuyển chế độ: LẬP ĐƠN TRẢ HÀNG" : "🛒 Chuyển chế độ: ĐƠN BÁN HÀNG THƯỜNG");
    renderUI();
  };

  window.submitOrder = async function() {
    if (!activeVisitedStore) return alert("Chưa chọn quầy hàng!");
    const items = [];
    let rawSubtotal = 0;
    let promoGiftList = [];

    products.forEach(p => {
      const c = currentCart[p.id];
      if (c && (c.qty > 0 || c.kien > 0 || c.le > 0)) {
        const itemTotal = (p.price || 0) * (c.qty || 1);
        rawSubtotal += itemTotal;
        items.push({ id: p.id, code: p.code, name: p.name, supplier: p.supplier || 'NPP', qty: c.qty, kien: c.kien, le: c.le, dvt: p.dvt || 'Hộp', price: p.price });

        promos.filter(isPromoActive).forEach(pr => {
          if (pr.buyPrdId === p.id && c.qty >= pr.buyQty) {
            const giftCount = Math.floor(c.qty / pr.buyQty) * pr.getQty;
            promoGiftList.push(`🎁 Tặng ${giftCount} x ${pr.getPrdName}`);
          }
        });
      }
    });

    if (items.length === 0) return alert("Vui lòng chọn số lượng hàng!");

    const unpaidOrdersTotal = orders
      .filter(o => o.storeId === activeVisitedStore.id && o.paymentStatus !== 'Đã thanh toán' && o.status !== 'Đã hủy')
      .reduce((s, o) => s + (o.amount || 0), 0);
    
    const storeCreditLimit = activeVisitedStore.creditLimit || 20000000;
    const totalPotentialDebt = unpaidOrdersTotal + rawSubtotal;

    if (!isReturnOrderMode && totalPotentialDebt > storeCreditLimit) {
      return alert(`⛔ KHÓA LẬP ĐƠN: Quầy đang vượt Hạn Mức Nợ!\n- Nợ cũ chưa trả: ${unpaidOrdersTotal.toLocaleString()}đ\n- Đơn mới: ${rawSubtotal.toLocaleString()}đ\n- Hạn mức cho phép: ${storeCreditLimit.toLocaleString()}đ\nLiên hệ Kế toán/Admin để giải tỏa.`);
    }

    let discountPercent = isReturnOrderMode ? 0 : (rawSubtotal >= 10000000 ? 5 : (rawSubtotal >= 5000000 ? 2 : 0));
    const finalAmount = rawSubtotal - (rawSubtotal * discountPercent / 100);

    await addDoc(collection(db, "orders"), {
      salesUid: currentUser.uid, salesName: currentUser.name, salesCode: currentUser.code,
      storeId: activeVisitedStore.id, maDTPN: `${activeVisitedStore.code||'KH'}_${activeVisitedStore.name}`,
      items, amount: isReturnOrderMode ? -finalAmount : finalAmount, rawSubtotal, discountPercent, promoGifts: promoGiftList,
      isReturnOrder: isReturnOrderMode,
      paymentStatus: 'Công nợ', status: 'Chờ duyệt', createdAt: serverTimestamp()
    });
    
    toast(isReturnOrderMode ? "✅ Đã gửi toa NHẬP TRẢ HÀNG!" : "🚀 Đã gửi toa BÁN HÀNG thành công!");
    currentCart = {}; activeVisitedStore = null; isReturnOrderMode = false; renderUI();
  };

  function downloadCSV(filename, rows) {
    const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = filename; link.click();
  }

  window.exportDailyOrdersCSV = function() {
    const todayStr = new Date().toDateString();
    const rows = [["MaDTPN", "TenQuay", "MaNV", "TenNV", "NgayTao", "LoaiDon", "MaVT", "TenVT", "NhaCungCap", "Dvt", "SoLuong", "Kien", "Le", "DonGia", "ThanhTien", "TrangThai"]];
    orders.forEach(o => {
      const createdDate = o.createdAt?.toDate ? o.createdAt.toDate() : new Date();
      if (createdDate.toDateString() === todayStr && o.status !== 'Đã hủy') {
        (o.items || []).forEach(it => {
          rows.push([
            o.maDTPN, o.maDTPN.split('_')[1]||'', o.salesCode, o.salesName,
            createdDate.toLocaleString('vi-VN'), o.isReturnOrder?'TRẢ HÀNG':'BÁN HÀNG', it.code, it.name, it.supplier||'',
            it.dvt, it.qty, it.kien, it.le, it.price, (it.price*it.qty), o.status
          ]);
        });
      }
    });
    downloadCSV(`ToaDonDay_${Date.now()}.csv`, rows);
  };

  window.importStoresCSV = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();

  window.approveOrder = async function(orderId) {
    try {
      await runTransaction(db, async (tx) => {
        const orderRef = doc(db, "orders", orderId);
        const orderSnap = await tx.get(orderRef);
        if (!orderSnap.exists()) throw new Error("Không tìm thấy đơn hàng.");
        const order = orderSnap.data();
        if (order.status !== 'Chờ duyệt') throw new Error("Đơn đã xử lý.");
        
        const productRefs = order.items.map(it => doc(db, "products", it.id));
        const productSnaps = await Promise.all(productRefs.map(r => tx.get(r)));
        
        productSnaps.forEach((snap, idx) => {
          const item = order.items[idx];
          if (!order.isReturnOrder && snap.exists() && snap.data().stock < item.qty) {
            throw new Error(`Sản phẩm ${item.name} không đủ tồn kho.`);
          }
        });

        productSnaps.forEach((snap, idx) => {
          if (snap.exists()) {
            const item = order.items[idx];
            const currentStock = snap.data().stock || 0;
            const newStock = order.isReturnOrder ? (currentStock + item.qty) : (currentStock - item.qty);
            tx.update(productRefs[idx], { stock: newStock });
          }
        });

        tx.update(orderRef, { status: 'Đã duyệt', approvedBy: currentUser.uid, approvedAt: serverTimestamp() });
      });
      writeAuditLog("DUYET_DON", "orders", orderId, "Duyệt toa đơn & Cập nhật kho");
      toast("Đã duyệt đơn hàng thành công!");
    } catch (err) { alert("Lỗi duyệt đơn: " + err.message); }
  };

                        <td>${p.name}</td>
                        <td>${p.dvt || 'Hộp'}</td>
                        <td><input type="number" value="${c.kien}" style="width:50px;margin:0;" onchange="updateCartDetail('${p.id}', 'kien', this.value)"></td>
                        <td><input type="number" value="${c.le}" style="width:50px;margin:0;" onchange="updateCartDetail('${p.id}', 'le', this.value)"></td>
                        <td><b style="color:var(--navy);">${c.qty}</b></td>
                        <td><small>${p.quycach || '1x24'}</small></td>
                        <td><b>${(p.price||0).toLocaleString()}đ</b></td>
                        <td><span class="badge ${p.stock<=10?'badge-danger':'badge-success'}">${p.stock || 0}</span></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>

              <button class="btn ${isReturnOrderMode?'btn-red':'btn-green'}" style="width:100%; margin-top:16px; padding:12px; font-size:16px;" onclick="submitOrder()">
                ${isReturnOrderMode ? '🔄 GỬI TOA NHẬP TRẢ HÀNG' : '🚀 GỬI TOA ĐƠN BÁN HÀNG'}
              </button>
            ` : `<div style="text-align:center;padding:40px;color:var(--muted);"><h3>🔒 Vui lòng Check-in GPS tại quầy để mở Toa Đơn Hàng.</h3></div>`}
          </div>
        </div>
      `;
    }

    else if (currentTab === 'stores' && backOffice) {
      main.innerHTML = `
        <h2>Quản Lý Tuyến & Phân Tuyến Điểm Bán (3.000 Tiệm)</h2>
        <div class="grid">
          <div class="card">
            <h3>📥 Nạp 3.000 Cửa Hàng Từ CSV/Excel</h3>
            <p style="font-size:11px;color:var(--muted);margin-bottom:8px;">File mẫu: MaDTPN, TenQuay, DiaChi, Tuyen, HanMuc, Lat, Lng</p>
            <input type="file" accept=".csv" onchange="importStoresCSV(event)">
            <hr style="margin:12px 0;">
            <h3>+ Thêm / Phân Tuyến Mới</h3>
            <form id="stForm" onsubmit="addStore(event)">
              <label>Mã Khách Hàng (Mã DTPN):</label><input type="text" id="stCode" placeholder="20Anh" required>
              <label>Tên Quầy / Tiệm:</label><input type="text" id="stName" placeholder="Quầy Ánh Đồng Xoài" required>
              <label>Địa Chỉ:</label><input type="text" id="stAddr" placeholder="Đồng Xoài" required>
              <label>Tuyến Phân Phối:</label>
              <select id="stRoute"><option>Tuyến Thứ 2 - Thứ 4 - Thứ 6</option><option>Tuyến Thứ 3 - Thứ 5 - Thứ 7</option><option>Tuyến Cả Tuần</option></select>
              <label>Hạn Mức Nợ:</label><input type="number" id="stCredit" value="20000000" required>
              <label>Lat:</label><input type="number" step="any" id="stLat" placeholder="10.7769">
              <label>Lng:</label><input type="number" step="any" id="stLng" placeholder="106.7009">
              <button class="btn btn-green" style="width:100%;">+ Lưu Điểm Bán</button>
            </form>
          </div>
          <div class="card" style="grid-column: span 2;">
            <h3>Danh Sách Tuyến Điểm Bán</h3>
            <table>
              <thead><tr><th>Mã DTPN</th><th>Tên Quầy</th><th>Địa Chỉ</th><th>Tuyến</th><th>Hạn Mức Nợ</th><th>Thao Tác</th></tr></thead>
              <tbody>
                ${stores.map(s => `<tr>
                  <td><b>${s.code||'KH'}</b></td><td><b>${s.name}</b></td><td>${s.address||''}</td>
                  <td><span class="badge badge-pending">${s.routeDay||'Cả tuần'}</span></td>
                  <td><b>${(s.creditLimit||0).toLocaleString()}đ</b></td>
                  <td><button class="btn btn-red btn-sm" onclick="deleteStore('${s.id}')">Xóa</button></td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    else if (currentTab === 'orders') {
      const myOrders = currentUser.role === 'sales' ? orders.filter(o => o.salesUid === currentUser.uid) : orders;
      main.innerHTML = `
        <h2>Danh Sách Toa Đơn Hàng</h2>
        <div class="card">
          <table>
            <thead><tr><th>Sales</th><th>MaDTPN (Quầy)</th><th>Chi Tiết Hàng</th><th>Tổng Tiền</th><th>Thanh Toán</th><th>Trạng Thái</th><th>Thao Tác</th></tr></thead>
            <tbody>
              ${myOrders.map(o => `
                <tr>
                  <td><b>[${o.salesCode||'NV'}]</b><br>${o.salesName||''}</td>
                  <td><b>${o.maDTPN||''}</b> ${o.isReturnOrder?'<br><span class="badge badge-danger">Trả hàng</span>':''}</td>
                  <td><small>${(o.items||[]).map(i => `${i.name} (SL:${i.qty}, K:${i.kien}, L:${i.le})`).join(', ')}</small>
                    ${o.promoGifts?.length?`<br><small style="color:var(--green);">${o.promoGifts.join('<br>')}</small>`:''}
                  </td>
                  <td><b style="color:var(--red);">${(o.amount||0).toLocaleString()}đ</b>${o.discountPercent?`<br><small style="color:var(--green);">(Chiết khấu ${o.discountPercent}%)</small>`:''}</td>
                  <td><span class="badge ${o.paymentStatus==='Đã thanh toán'?'badge-success':'badge-pending'}">${o.paymentStatus||'Công nợ'}</span></td>
                  <td><span class="badge ${o.status==='Đã hủy'?'badge-danger':(o.status==='Đã duyệt'?'badge-success':'badge-pending')}">${o.status}</span></td>
                  <td style="display:flex;gap:4px;flex-wrap:wrap;">
                    <button class="btn btn-amber btn-sm" onclick="printReceipt('${o.id}')">🖨️ In Toa Đơn</button>
                    ${backOffice && o.status==='Chờ duyệt' ? `<button class="btn btn-green btn-sm" onclick="approveOrder('${o.id}')">Duyệt</button>` : ''}
                    ${backOffice && o.status==='Chờ duyệt' ? `<button class="btn btn-red btn-sm" onclick="cancelOrder('${o.id}')">Hủy</button>` : ''}
                    ${(isAdmin||isAccountant) && o.paymentStatus!=='Đã thanh toán' ? `<button class="btn btn-amber btn-sm" onclick="confirmPayment('${o.id}')">Đã TT</button>` : ''}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    else if (currentTab === 'products' && isAdmin) {
      main.innerHTML = `
        <h2>Quản Lý Danh Mục Vật Tư / Hàng Hóa (60 Đối Tác)</h2>
        <div class="grid">
          <div class="card">
            <h3>📥 Nạp Danh Mục Mã Hàng Từ CSV/Excel</h3>
            <p style="font-size:11px;color:var(--muted);margin-bottom:8px;">File mẫu: MaVTHH, TenHang, NhaCungCap, Dvt, QuyCach, DonGia, TonKho</p>
            <input type="file" accept=".csv" onchange="importProductsCSV(event)">
            <hr style="margin:12px 0;">
            <h3>+ Thêm Hàng Hóa</h3>
            <form id="prdForm" onsubmit="addProduct(event)">
              <label>Mã VTHH:</label><input type="text" id="prdCode" required>
              <label>Tên Hàng Hóa:</label><input type="text" id="prdName" required>
              <label>Nhà Cung Cấp / Đối Tác:</label><input type="text" id="prdSupplier" placeholder="Tên đối tác (ví dụ: Uniben, Vinamilk...)" required>
              <label>Đơn Vị Tính (Dvt):</label><input type="text" id="prdDvt" value="Hộp" required>
              <label>Quy Cách:</label><input type="text" id="prdQuyCach" value="1x24" required>
              <label>Đơn Giá:</label><input type="number" id="prdPrice" required>
              <label>Số Lượng Tồn:</label><input type="number" id="prdStock" required>
              <button class="btn btn-green" style="width:100%;">+ Lưu Hàng Hóa</button>
            </form>
          </div>
          <div class="card" style="grid-column: span 2;">
            <h3>Danh Sách Hàng Hóa</h3>
            <table>
              <thead><tr><th>MaVT</th><th>TenVT</th><th>Đối Tác</th><th>Dvt</th><th>Quy cách</th><th>Đơn Giá</th><th>SL Tồn</th><th></th></tr></thead>
              <tbody>
                ${products.map(p => `<tr>
                  <td><b>${p.code}</b></td><td>${p.name}</td><td><b>${p.supplier||'NPP'}</b></td>
                  <td>${p.dvt||'Hộp'}</td><td>${p.quycach||'1x24'}</td><td><b>${(p.price||0).toLocaleString()}đ</b></td>
                  <td><span class="badge ${p.stock<=10?'badge-danger':'badge-success'}">${p.stock||0}</span></td>
                  <td><button class="btn btn-red btn-sm" onclick="deleteProduct('${p.id}')">Xóa</button></td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    else if (currentTab === 'promos' && isAdmin) {
      main.innerHTML = `
        <h2>Chương Trình Khuyến Mãi (Mua - Tặng)</h2>
        <div class="grid">
          <div class="card">
            <h3>+ Thêm Khuyến Mãi</h3>
            <form id="promoForm" onsubmit="addPromo(event)">
              <label>Sản phẩm mua:</label><select id="pmBuyPrd">${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
              <label>SL mua:</label><input type="number" id="pmBuyQty" value="10" required>
              <label>Quà tặng:</label><input type="text" id="pmGetName" required>
              <label>SL tặng:</label><input type="number" id="pmGetQty" value="1" required>
              <label>Bắt đầu:</label><input type="date" id="pmStart">
              <label>Kết thúc:</label><input type="date" id="pmEnd">
              <button class="btn btn-green" style="width:100%;">+ Lưu KM</button>
            </form>
          </div>
          <div class="card" style="grid-column: span 2;">
            <h3>Danh Sách Chương Trình KM</h3>
            <table>
              <thead><tr><th>Mua</th><th>Quà Tặng</th><th>Hiệu Lực</th><th>Thao Tác</th></tr></thead>
              <tbody>
                ${promos.map(p => { const prd=products.find(x=>x.id===p.buyPrdId);
                  return `<tr>
                    <td>${prd?prd.name:'?'} (mua ${p.buyQty})</td>
                    <td>${p.getPrdName} (x${p.getQty})</td>
                    <td><small>${p.startDate||'—'} → ${p.endDate||'—'}</small></td>
                    <td><button class="btn btn-red btn-sm" onclick="deletePromo('${p.id}')">Xóa</button></td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    else if (currentTab === 'audit' && backOffice) {
      main.innerHTML = `
        <h2>Audit Log & Bằng Chứng Check-in</h2>
        <div class="grid">
          ${checkins.map(c => `
            <div class="card">
              <b>Tiệm: ${c.storeName}</b> <span class="badge badge-success">${c.status}</span><br>
              <small>Sales: [${c.salesCode}] ${c.salesName}</small><br>
              <small>GPS: ${c.lat?c.lat.toFixed(4):''}, ${c.lng?c.lng.toFixed(4):''} | Cách: ${Math.round(c.distance||0)}m</small><br>
              ${c.photo?`<img src="${c.photo}" class="watermark-img">`:''}
            </div>
          `).join('')}
        </div>
        <h3 style="margin-top:20px;">📜 Lịch Sử POSM & Thao Tác</h3>
        <div class="card"><table><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Chi tiết</th></tr></thead>
          <tbody>${auditLogs.map(l => `<tr><td><small>${l.createdAt?.toDate?l.createdAt.toDate().toLocaleString('vi-VN'):''}</small></td>
            <td>${l.actorName||''}</td><td><span class="badge">${l.action}</span></td>
            <td>${l.action==='POSM_DISPLAY_PHOTO'?`<img src="${l.detail}" style="max-width:120px;border-radius:4px;">`:`<small>${l.detail||''}</small>`}</td></tr>`).join('')}</tbody>
        </table></div>
      `;
    }

    else if (currentTab === 'users' && isAdmin) {
      main.innerHTML = `
        <h2>Quản Lý Nhân Viên Sales & Giám Sát</h2>
        <div class="grid">
          <div class="card">
            <h3>+ Tạo Nhân Viên</h3>
            <form id="userForm" onsubmit="addUser(event)">
              <input type="text" id="usCode" placeholder="Mã NV" required>
              <input type="text" id="usName" placeholder="Tên NV" required>
              <input type="email" id="usEmail" placeholder="Email" required>
              <input type="text" id="usPass" placeholder="Mật khẩu" required>
              <select id="usRole"><option value="sales">Sales</option><option value="manager">Giám Sát</option><option value="accountant">Kế Toán</option><option value="admin">Admin</option></select>
              <button class="btn btn-green" style="width:100%;">+ Tạo</button>
            </form>
          </div>
          <div class="card" style="grid-column: span 2;">
            <h3>Danh Sách Nhân Viên</h3>
            <table>
              <thead><tr><th>Mã</th><th>Tên</th><th>Email</th><th>Vai Trò</th><th>Trạng Thái</th></tr></thead>
              <tbody>
                ${users.map(u => `<tr>
                  <td><b>${u.code}</b></td><td>${u.name}</td><td>${u.email}</td><td><span class="badge">${roleLabel(u.role)}</span></td>
                  <td><button class="btn ${u.active!==false?'btn-red':'btn-green'} btn-sm" onclick="toggleUserActive('${u.uid}', ${u.active===false})">${u.active!==false?'Khóa':'Mở khóa'}</button></td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
  }

  function roleLabel(r) { return { admin: 'Admin', manager: 'Giám Sát', accountant: 'Kế Toán', sales: 'Sales' }[r] || r; }
  function setNav(id, visible) { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !visible); }
  window.switchTab = function(tab) { currentTab = tab; renderUI(); };
</script>
</head>

<body>
<div class="app">
  <div id="loginView" class="login-box">
    <h2 style="text-align:center;margin-bottom:12px;">DMS SFA ENTERPRISE</h2>
    <form onsubmit="handleLogin(event)">
      <label>Email:</label><input type="email" id="logUser" required autocomplete="username">
      <label>Mật Khẩu:</label><input type="password" id="logPass" required autocomplete="current-password">
      <button class="btn btn-amber" style="width:100%;padding:12px;margin-top:10px;">🔑 ĐĂNG NHẬP HỆ THỐNG</button>
    </form>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div><h1 style="color:var(--amber);">DMS CLOUD SFA — PRODUCTION ULTIMATE</h1><small id="userInfo"></small></div>
      <div class="nav-btns">
        <button id="navDash" class="btn btn-amber hidden" onclick="switchTab('dashboard')">📊 Dashboard</button>
        <button id="navSales" class="btn" onclick="switchTab('sales')">🛒 Toa Bán Hàng</button>
        <button id="navStores" class="btn hidden" onclick="switchTab('stores')">🏬 Tuyến / Tiệm</button>
        <button id="navOrders" class="btn" onclick="switchTab('orders')">📦 Đơn Hàng</button>
        <button id="navPrd" class="btn hidden" onclick="switchTab('products')">🥛 Hàng Hóa / Đối Tác</button>
        <button id="navPromo" class="btn hidden" onclick="switchTab('promos')">🎁 Khuyến Mãi</button>
        <button id="navAudit" class="btn hidden" onclick="switchTab('audit')">📷 Audit Log</button>
        <button id="navUsers" class="btn hidden" onclick="switchTab('users')">👥 Nhân Viên</button>
        <button class="btn btn-amber" onclick="openChangePasswordModal()">🔒 Đổi Pass</button>
        <button class="btn btn-red" onclick="handleLogout()">Đăng Xuất</button>
      </div>
    </div>
    <div class="panel" id="mainContent"></div>
  </div>
</div>

<div id="changePassModal" class="modal hidden"><div class="modal-content">
  <h3>🔑 Đổi Mật Khẩu</h3>
  <form onsubmit="submitChangePassword(event)" style="margin-top:12px;">
    <label>Mật Khẩu Hiện Tại:</label><input type="password" id="oldPassInput" required>
    <label>Mật Khẩu Mới:</label><input type="password" id="newPassInput" required>
    <label>Xác Nhận:</label><input type="password" id="confirmPassInput" required>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button type="submit" class="btn btn-green" style="flex:1;">Lưu</button>
      <button type="button" class="btn btn-red" onclick="closeChangePasswordModal()">Hủy</button>
    </div>
  </form>
</div></div>

<div id="qrModal" class="modal hidden"><div class="modal-content">
  <h3>📷 Quét Mã QR</h3><div id="reader" style="width:100%;margin-top:10px;"></div>
  <button class="btn btn-red" style="width:100%;margin-top:12px;" onclick="closeQRScanner()">Đóng Camera</button>
</div></div>

</body>
</html>
