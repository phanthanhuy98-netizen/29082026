  function initIndexedDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open("DMS_OfflineDB", 15);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { idbDb = request.result; resolve(idbDb); };
      request.onupgradeneeded = (e) => {
        const dbInstance = e.target.result;
        if (!dbInstance.objectStoreNames.contains("offlineOrders")) dbInstance.createObjectStore("offlineOrders", { keyPath: "id", autoIncrement: true });
        if (!dbInstance.objectStoreNames.contains("localProducts")) dbInstance.createObjectStore("localProducts", { keyPath: "code" });
        if (!dbInstance.objectStoreNames.contains("localStores")) dbInstance.createObjectStore("localStores", { keyPath: "id" });
        if (!dbInstance.objectStoreNames.contains("offlineCheckins")) dbInstance.createObjectStore("offlineCheckins", { keyPath: "id", autoIncrement: true });
        if (!dbInstance.objectStoreNames.contains("metaInfo")) dbInstance.createObjectStore("metaInfo", { keyPath: "key" });
      };
    });
  }

  async function saveProductsToLocalCache(list) {
    if (!idbDb) await initIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = idbDb.transaction(["localProducts"], "readwrite");
      const store = transaction.objectStore("localProducts");
      store.clear();
      list.forEach(p => store.put(p));
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    });
  }

  async function loadProductsFromLocalCache() {
    if (!idbDb) await initIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = idbDb.transaction(["localProducts"], "readonly");
      const store = transaction.objectStore("localProducts");
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(transaction.error);
    });
  }

  async function saveStoresToLocalCache(list) {
    if (!idbDb) await initIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = idbDb.transaction(["localStores"], "readwrite");
      const store = transaction.objectStore("localStores");
      store.clear();
      list.forEach(s => store.put(s));
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);

  window.syncOfflineCheckins = async function() {
    if (!navigator.onLine || !idbDb) return;
    const tx = idbDb.transaction(["offlineCheckins"], "readwrite");
    const store = tx.objectStore("offlineCheckins");
    const request = store.getAll();
    
    request.onsuccess = async () => {
      const items = request.result;
      if (items && items.length > 0) {
        for (const item of items) {
          try {
            await addDoc(collection(db, "checkins"), {
              ...item,
              createdAt: serverTimestamp()
            });
            const delTx = idbDb.transaction(["offlineCheckins"], "readwrite");
            delTx.objectStore("offlineCheckins").delete(item.id);
          } catch (e) {
            console.error("Đồng bộ check-in lỗi:", e);
          }
        }
      }
    };
  };

  window.syncOfflineOrders = async function() {
    if (!navigator.onLine || !idbDb) return;
    const tx = idbDb.transaction(["offlineOrders"], "readwrite");
    const store = tx.objectStore("offlineOrders");
    const request = store.getAll();
    
    request.onsuccess = async () => {
      const items = request.result;
      if (items && items.length > 0) {
        for (const item of items) {
          try {
            const nextSoCtu = await getNextSoCtu();
            const { id, ...payload } = item;
            payload.soCtu = nextSoCtu;
            payload.createdAt = serverTimestamp();
            await addDoc(collection(db, "orders"), payload);
            
            const delTx = idbDb.transaction(["offlineOrders"], "readwrite");
            delTx.objectStore("offlineOrders").delete(item.id);
          } catch (e) {
            console.error("Đồng bộ đơn hàng offline lỗi:", e);
          }
        }
      }
    };
  };

  function removeAccents(str) {
    if (!str) return '';
    return str.normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/đ/g, 'd').replace(/Đ/g, 'D')
              .toLowerCase();
  }

  function formatDateDDMMYYYY(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    return dateStr;
  }

  function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
    if (!lat1 || !lon1 || !lat2 || !lon2) return Infinity;
    const R = 6371e3;
    const φ1 = lat1 * Math.PI/180;
    const φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180;
    const Δλ = (lon2-lon1) * Math.PI/180;

    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function getHighAccuracyPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error("Trình duyệt không hỗ trợ GPS."));
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude, accuracy } = pos.coords;
          resolve({ lat: latitude, lng: longitude, accuracy });
        },
        err => reject(err),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  function fallbackCopyText(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
    } catch (err) {
      alert("Không thể sao chép tọa độ: " + err);
    }
    document.body.removeChild(textArea);
  }

  async function backgroundSyncMetadataAndCache() {
    if (!navigator.onLine) return;
    try {
      const metaRef = doc(db, "systemMetadata", "appVersionControl");
      const metaSnap = await getDoc(metaRef);
      if (metaSnap.exists()) {
        const cloudDataVersion = metaSnap.data().dataVersion || 1;
        const localDataVersion = await getMetaVersion("cachedDataVersion") || 0;

        if (cloudDataVersion > localDataVersion) {
          const [prdSnap, storeSnap] = await Promise.all([
            getDocs(collection(db, "products")),
            getDocs(collection(db, "stores"))
          ]);

          const cloudPrds = prdSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const cloudStores = storeSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          if (cloudPrds.length > 0) {
            products = cloudPrds;
            buildProductIndex();
            await saveProductsToLocalCache(cloudPrds);
          }
          if (cloudStores.length > 0) {
            stores = cloudStores;
            buildStoreIndex();
            await saveStoresToLocalCache(cloudStores);
          }

          await saveMetaVersion("cachedDataVersion", cloudDataVersion);
        }
      }
    } catch (e) {
      console.warn("Lỗi đồng bộ ngầm:", e);
    }
  }

  window.updateCartDetail = async function(prdId, field, val) {
    const safeK = getSafeKey(prdId);
    const p = products.find(x => x.id === prdId || x.code === prdId);
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    
    let cleanStr = String(val !== undefined && val !== null ? val : '').replace(/[^0-9]/g, '');
    let cleanVal = cleanStr === '' ? 0 : Math.max(0, parseInt(cleanStr, 10));
    
    currentCart[prdId][field] = cleanVal;
    
    const packRatio = p?.tyLeQuyDoi || 50;
    
    if (field === 'kien' || field === 'le') {
      currentCart[prdId].qty = (Number(currentCart[prdId].kien || 0) * packRatio) + Number(currentCart[prdId].le || 0);
    } else if (field === 'qty') {
      const totalQ = cleanVal;
      currentCart[prdId].kien = packRatio > 0 ? Math.floor(totalQ / packRatio) : 0;
      currentCart[prdId].le = packRatio > 0 ? totalQ % packRatio : totalQ;
    }
    
    const totalQDisplay = currentCart[prdId].qty;
    const itemTotal = (p?.price || 0) * totalQDisplay;

    if (itemTotal > 20000000) {
      const confirmContinue = await window.showCustomConfirm(
        "Cảnh Báo Vượt Mức Giá Trị",
        `Sản phẩm "${p ? p.name : prdId}" có tổng tiền ${itemTotal.toLocaleString()}đ vượt quá ngưỡng 20.000.000đ.\n\nBạn có chắc chắn muốn tiếp tục số lượng này không?`,
        "fa-triangle-exclamation",
        "Tiếp tục",
        "Hủy bỏ"
      );
      if (!confirmContinue) {
        currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
      }
    }

    const finalLe = currentCart[prdId].le;
    const finalKien = currentCart[prdId].kien;
    const finalQty = currentCart[prdId].qty;
    const finalItemTotal = (p?.price || 0) * finalQty;

    document.querySelectorAll(`.input-le-${safeK}`).forEach(el => {
      if (document.activeElement !== el) el.value = (finalLe === 0 ? '' : finalLe);
    });
    document.querySelectorAll(`.input-kien-${safeK}`).forEach(el => {
      if (document.activeElement !== el) el.value = (finalKien === 0 ? '' : finalKien);
    });

    const rowTotalEl = document.getElementById(`row_total_${safeK}`);
    const mobileRowTotalEl = document.getElementById(`mobile_row_total_${safeK}`);
    const totalQtyEl = document.getElementById(`total_qty_${safeK}`);

    if (rowTotalEl) rowTotalEl.innerText = finalItemTotal.toLocaleString() + 'đ';
    if (mobileRowTotalEl) mobileRowTotalEl.innerText = finalItemTotal.toLocaleString() + 'đ';
    if (totalQtyEl) totalQtyEl.innerText = finalQty;

    const rowEl = document.getElementById(`row_item_${safeK}`);
    const cardEl = document.getElementById(`card_item_${safeK}`);
    const hasQty = finalQty > 0;
    
    if (rowEl) rowEl.classList.toggle('has-selected', hasQty);
    if (cardEl) cardEl.classList.toggle('has-selected', hasQty);

    saveCartDraftToLocal();
    updateCartTotalsUI();
  };

  window.adjustQty = function(prdId, field, delta) {
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    let curVal = Number(currentCart[prdId][field]) || 0;
    let newVal = curVal + delta;
    if (newVal < 0) newVal = 0;
    
    const safeK = getSafeKey(prdId);
    const inputClass = field === 'le' ? `.input-le-${safeK}` : `.input-kien-${safeK}`;
    document.querySelectorAll(inputClass).forEach(el => {
      el.value = (newVal === 0 ? '' : newVal);
    });

    window.updateCartDetail(prdId, field, newVal);
  };

  window.filterSalesCustomers = function(val) {
    if (val !== undefined) customerSearchKeyword = removeAccents(val.trim());
    const container = document.getElementById('salesCustomerResultContainer');
    if (!container) return;

    if (customerSearchKeyword === "" && !selectedRouteCode) {
      container.innerHTML = `<div style="text-align:center; padding:18px; color:var(--text-muted); font-weight:700;">Gõ từ khóa để tìm kiếm khách hàng nhanh...</div>`;
      const hintEl = document.getElementById('customerSearchHint');
      if (hintEl) hintEl.innerText = "Vui lòng gõ từ khóa hoặc chọn tuyến...";
      return;
    }

    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;

    const soldStoreIdsToday = new Set(
      orders.filter(o => o.ngayCtu === todayStr && (o.salesCode === currentUser.code || o.salesUid === currentUser.uid) && o.status !== 'Đã hủy')
            .map(o => String(o.storeId))
    );

    let matched = [];
    for (const [id, entry] of storeIndexMap.entries()) {
      const s = entry.store;
      const sCode = (s.code || '').trim();
      
      let matchRoute = true;
      if (selectedRouteCode) {
        const sCodeUpper = sCode.toUpperCase();
        const routeCodeUpper = selectedRouteCode.toUpperCase();
        matchRoute = sCodeUpper.startsWith(routeCodeUpper);
      }

      let matchKey = true;
      if (customerSearchKeyword !== "") {
        matchKey = entry.searchableText.includes(customerSearchKeyword);
      }

      if (matchRoute && matchKey) {
        let dist = Infinity;
        if (currentSalesGPS && s.lat && s.lng) {
          dist = calculateDistanceMeters(currentSalesGPS.lat, currentSalesGPS.lng, s.lat, s.lng);
        }
        matched.push({ store: s, distance: dist });
      }
    }

    matched.sort((a, b) => a.distance - b.distance);
    const slicedMatched = matched.slice(0, 25);

    container.innerHTML = slicedMatched.length > 0 ? slicedMatched.map(item => {
      const s = item.store;
      const isSoldToday = soldStoreIdsToday.has(String(s.id)) || soldStoreIdsToday.has(String(s.code));
      const distStr = item.distance !== Infinity ? (item.distance > 1000 ? (item.distance / 1000).toFixed(1) + ' km' : Math.round(item.distance) + ' m') : 'Chưa có GPS';
      const isClosest = item.distance !== Infinity && item.distance <= 100;
      const pName = s.pinnedByName ? `[${s.pinnedByCode || ''}] ${s.pinnedByName}` : 'Chưa có';

      return `
        <div class="mobile-item-card" style="display:flex; flex-direction:column; gap:8px; border:1px solid ${isClosest ? 'rgba(52, 211, 153, 0.4)' : 'rgba(255, 255, 255, 0.08)'};">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="item-code" style="background:rgba(99, 102, 241, 0.2); color:#818CF8; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:800;">${s.code || 'KH'} ${isSoldToday ? '✅' : ''}</span>
            <span style="font-size:11px; font-weight:700; color:${isClosest ? 'var(--emerald)' : 'var(--text-muted)'};"><i class="fa-solid fa-location-arrow"></i> ${distStr} ${isClosest ? '(Gần nhất 📍)' : ''}</span>
          </div>
          <div style="font-size:13px; font-weight:800; color:#F8FAFC; line-height:1.3;">${s.name}</div>
          <div style="font-size:12px; color:var(--text-muted);"><i class="fa-solid fa-location-dot" style="color:var(--rose);"></i> ${s.address || 'Chưa có địa chỉ'}</div>
          <div style="font-size:11px; color:var(--text-muted);">👤 NV ghim: <b style="color:#818CF8;">${pName}</b></div>
          <button type="button" class="btn ${isSoldToday ? 'btn-green' : 'btn-amber'}" style="width:100%; justify-content:center; margin-top:4px; padding:9px; font-size:12px; font-weight:800;" onclick="selectStoreDirectly('${s.id}', event)">
            <i class="fa-solid fa-check"></i> ${isSoldToday ? 'ĐÃ BÁN HÔM NAY - BÁN TIẾP' : 'CHỌN TIỆM NÀY'}
          </button>
        </div>
      `;
    }).join('') : `<div style="text-align:center; padding:18px; color:var(--text-muted); background:rgba(17, 24, 39, 0.5); border-radius:12px;">Không tìm thấy khách hàng phù hợp tuyến và từ khóa.</div>`;

    const hintEl = document.getElementById('customerSearchHint');
    if (hintEl) hintEl.innerText = slicedMatched.length > 0 ? `Hiển thị ${slicedMatched.length} khách hàng phù hợp.` : "Không tìm thấy khách hàng phù hợp.";
  };

  window.filterSoGocCards = function(val) {
    if (val !== undefined) soGocFilterKeyword = val.toLowerCase();
    const queryKey = removeAccents(soGocFilterKeyword.trim());
    const cards = document.querySelectorAll('.so-goc-card-item');
    let cleanSoCtuKey = queryKey.replace('#', '').trim();

    let totalFilteredAmount = 0;

    cards.forEach(card => {
      const soCtu = card.getAttribute('data-so-ctu') || '';
      const maDtpn = card.getAttribute('data-ma-dtpn') || '';
      const maNv = card.getAttribute('data-ma-nv') || '';
      const tenNv = card.getAttribute('data-ten-nv') || '';
      const ngayCtu = card.getAttribute('data-ngay-ctu') || '';
      const orderAmount = Number(card.getAttribute('data-order-amount')) || 0;

      const matchSoCtu = cleanSoCtuKey === "" || soCtu.includes(cleanSoCtuKey);
      const matchOther = queryKey === "" || 
        matchSoCtu ||
        maDtpn.includes(queryKey) || 
        maNv.includes(queryKey) || 
        tenNv.includes(queryKey);

      const matchDate = soGocFilterDate === "" || ngayCtu === soGocFilterDate;
      const matchSales = soGocSalesFilter === "" || maNv === soGocSalesFilter;

      const isVisible = matchOther && matchDate && matchSales;
      card.style.display = isVisible ? '' : 'none';

      if (isVisible) {
        totalFilteredAmount += orderAmount;
      }
    });

    const sumEl = document.getElementById('soGocTotalRevenueVal');
    if (sumEl) sumEl.innerText = totalFilteredAmount.toLocaleString() + ' đ';
  };

  window.editOrder = function(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (!order) return alert("Không tìm thấy thông tin đơn hàng!");

    const isOwner = currentUser.code === order.salesCode || currentUser.uid === order.salesUid;
    const isAdmin = currentUser.role === 'admin';
    if (!isOwner && !isAdmin) {
      return alert("⛔ Bạn không có quyền sửa đơn hàng của nhân viên khác!");
    }

    const todayStr = new Date().toISOString().slice(0, 10);
    if (order.ngayCtu !== todayStr && !isAdmin) {
      return alert(`⛔ Đơn hàng lập ngày ${order.ngayCtu} đã qua ngày mới, không thể chỉnh sửa! (Chỉ được sửa đơn trong ngày).`);
    }

    let targetStore = stores.find(s => String(s.id) === String(order.storeId));
    if (!targetStore && order.maDTPNNo) {
      targetStore = stores.find(s => String(s.code) === String(order.maDTPNNo));
    }
    if (!targetStore) {
      return alert("Không tìm thấy dữ liệu điểm bán của đơn hàng này trong hệ thống!");
    }

    activeVisitedStore = targetStore;
    editingOrderId = order.id;

    currentCart = {};
    if (order.items && order.items.length > 0) {
      order.items.forEach(item => {
        const pKey = item.id || item.code;
        const productObj = products.find(p => p.id === pKey || p.code === pKey || p.code === item.code);
        const ratio = productObj?.tyLeQuyDoi || 50;
        
        const totalQty = Number(item.qty || 0);
        const kien = ratio > 0 ? Math.floor(totalQty / ratio) : 0;
        const le = ratio > 0 ? totalQty % ratio : totalQty;

        currentCart[pKey] = {
          qty: totalQty,
          kien: kien,
          le: le
        };
      });
    }

    switchTab('sales');
  };

  function updateCartTotalsUI() {
    let cartTotalAmount = 0;
    let selectedSkuCount = 0;

    Object.values(currentCart).forEach(c => {
      if (c && c.qty > 0) {
        selectedSkuCount++;
      }
    });

    products.forEach(p => {
      const keyId = p.id || p.code;
      const c = currentCart[keyId];
      if (c && c.qty > 0) {
        cartTotalAmount += (p.price || 0) * c.qty;
      }
    });

    const footerTotalEl = document.getElementById('stickyCartTotalAmount');
    const footerSkuCountEl = document.getElementById('stickyCartSkuCount');
    const floatTriggerAmount = document.getElementById('floatTriggerAmount');
    const floatTriggerCount = document.getElementById('floatTriggerCount');
    
    if (footerTotalEl) footerTotalEl.innerText = cartTotalAmount.toLocaleString() + ' đ';
    if (footerSkuCountEl) footerSkuCountEl.innerText = `Đã chọn: ${selectedSkuCount} mã hàng`;
    if (floatTriggerAmount) floatTriggerAmount.innerText = cartTotalAmount.toLocaleString() + ' đ';
    if (floatTriggerCount) floatTriggerCount.innerText = selectedSkuCount;
  }

  async function getNextSoCtu() {
    try {
      const counterRef = doc(db, "systemCounters", "soCtuCounter");
      const counterSnap = await getDoc(counterRef);
      let currentVal = 0;
      if (counterSnap.exists()) {
        currentVal = Number(counterSnap.data().currentVal) || 0;
      }
      currentVal++;
      if (currentVal > 900000) {
        currentVal = 1;
      }
      await setDoc(counterRef, { currentVal });
      return currentVal;
    } catch (err) {
      console.error("Lỗi cấp phát số chứng từ:", err);
      return Math.floor(Math.random() * 900000) + 1;
    }
  }

  window.submitOrder = async function() {
    if (!activeVisitedStore) {
      alert("⚠️ Vui lòng chọn khách hàng trước khi gửi đơn hàng!");
      const custInput = document.getElementById('customerSearchInput');
      if (custInput) custInput.focus();
      return;
    }

    const items = [];
    let rawSubtotal = 0;

    products.forEach(p => {
      const possibleKeys = [p.id, p.code].filter(Boolean);
      let c = null;

      for (const k of possibleKeys) {
        if (currentCart[k] && currentCart[k].qty > 0) {
          c = currentCart[k];
          break;
        }
      }

      if (c && c.qty > 0) {
        const itemTotal = (p.price || 0) * c.qty;
        rawSubtotal += itemTotal;
        items.push({ 
          id: p.id || p.code, 
          code: p.code, 
          name: p.name, 
          dvt: p.dvt || 'hộp', 
          qty: c.qty, 
          kien: c.kien || 0, 
          le: c.le || 0, 
          price: p.price || 0 
        });
      }
    });

    if (items.length === 0) {
      return alert("Vui lòng chọn số lượng hàng trước khi gửi đơn!");
    }

    const finalAmount = rawSubtotal;
    const currentSalesString = `${currentUser.name}`;
    const currentCustomerString = `${activeVisitedStore.code || 'KH'} - ${activeVisitedStore.name}`;

    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;

    const orderData = {
      ngayCtu: todayStr,
      maDTPNNo: activeVisitedStore.code || '',
      maNhanVien: currentUser.code || '',
      tenNhanVien: currentUser.name || '',
      maKH: currentCustomerString,
      nvBan: currentSalesString,
      salesUid: currentUser.uid, 
      salesName: currentUser.name, 
      salesCode: currentUser.code,
      storeId: activeVisitedStore.id, 
      items, 
      amount: finalAmount, 
      rawSubtotal,
      isReturnOrder: false, 
      paymentStatus: 'Công nợ', 
      status: 'Chờ duyệt'
    };

    try {
      if (editingOrderId) {
        const orderRef = doc(db, "orders", editingOrderId);
        await updateDoc(orderRef, {
          ...orderData,
          updatedAt: serverTimestamp()
        });
      } else {
        if (navigator.onLine) {
          const nextSoCtu = await getNextSoCtu();
          orderData.soCtu = nextSoCtu;
          orderData.createdAt = serverTimestamp();
          await addDoc(collection(db, "orders"), orderData);
        } else {
          await saveOfflineOrder(orderData);
        }
      }
      
      clearCartDraftFromLocal();
      currentCart = {}; 
      activeVisitedStore = null; 
      editingOrderId = null;
      productSearchKeyword = ""; 
      customerSearchKeyword = "";
      selectedCompanyCode = "";
      showOnlySelectedItems = false; 

      switchTab('soGocBH');
    } catch (err) {
      console.error("Lỗi lưu đơn hàng lên Firestore:", err);
      alert("Không thể lưu đơn hàng: " + err.message);
    }
  };

  window.importProductsExcel = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        
        let rawProducts = [];
        for (let i = 0; i < jsonRows.length; i++) {
          const r = jsonRows[i];
          const code = r[0] ? String(r[0]).trim() : '';
          const name = r[1] ? String(r[1]).trim() : '';
          const dvt = r[2] ? String(r[2]).trim() : 'hộp';
          
          if (code && code !== 'Ma VTHH' && code !== 'undefined') {
            rawProducts.push({
              id: code,
              code: code, name: name, dvt: dvt,
              stockDau: Number(r[3]) || 0, stockCuoi: Number(r[4]) || 0,
              price: Number(r[5]) || 0, tyLeQuyDoi: Number(r[6]) || 50
            });
          }
        }

        if (rawProducts.length > 0) {
          const uniqueMap = new Map();
          rawProducts.forEach(p => { if (!uniqueMap.has(p.code)) uniqueMap.set(p.code, p); });
          const uniqueList = Array.from(uniqueMap.values());

          const existingSnap = await getDocs(collection(db, "products"));
          const docsArr = existingSnap.docs;
          for (let i = 0; i < docsArr.length; i += 250) {
            const chunk = docsArr.slice(i, i + 250);
            const deleteBatch = writeBatch(db);
            chunk.forEach(d => deleteBatch.delete(d.ref));
            await deleteBatch.commit();
          }

          for (let i = 0; i < uniqueList.length; i += 300) {
            const chunk = uniqueList.slice(i, i + 300);
            const batch = writeBatch(db);
            chunk.forEach(p => batch.set(doc(db, "products", p.code), p));
            await batch.commit();
            await new Promise(r => setTimeout(r, 40));
          }

          await saveProductsToLocalCache(uniqueList);
          products = uniqueList;
          buildProductIndex();
          renderUI();
          alert("✅ Nhập danh sách vật tư thành công!");
        } else { alert("Không tìm thấy dữ liệu vật tư hợp lệ!"); }
      } catch (err) { alert("Lỗi: " + err.message); }
    };
    reader.readAsArrayBuffer(file);
  };

            <div class="mobile-item-card company-card-item" style="display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="background:rgba(99, 102, 241, 0.2); color:#818CF8; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:800;">Mã: ${c.maCtu || ''}</span>
                <div style="display:flex; gap:6px; align-items:center;">
                  ${isAdmin ? `
                    <select onchange="updateCompanyField(${idx}, 'status', this.value)" style="margin:0; padding:5px 10px; font-size:11px; background:${c.status === 'Đóng' ? 'rgba(159, 18, 57, 0.4)' : 'rgba(6, 78, 59, 0.4)'}; color:${c.status === 'Đóng' ? '#FB7185' : '#34D399'}; font-weight:700; width:auto;">
                      <option value="Mở" ${c.status === 'Mở' ? 'selected' : ''}>Mở</option>
                      <option value="Đóng" ${c.status === 'Đóng' ? 'selected' : ''}>Đóng</option>
                    </select>
                    <button class="btn btn-red btn-sm" style="padding:5px 10px; font-size:10px;" onclick="deleteCompanyItem(${idx})"><i class="fa-solid fa-trash"></i></button>
                  ` : `
                    <span class="badge ${c.status === 'Đóng' ? 'badge-danger' : 'badge-success'}">${c.status || 'Mở'}</span>
                  `}
                </div>
              </div>
              <div style="font-size:13px; font-weight:800; color:#F8FAFC;">${isAdmin ? `<input type="text" value="${c.tenCtu || ''}" onchange="updateCompanyField(${idx}, 'tenCtu', this.value)" style="margin:6px 0 0; padding:8px 12px; font-size:12px;">` : (c.tenCtu || '')}</div>
              ${isAdmin ? `
                <div style="margin-top:4px;">
                  <label style="font-size:10px; font-weight:800; color:var(--text-muted); display:block;">Sửa mã công ty:</label>
                  <input type="text" value="${c.maCtu || ''}" onchange="updateCompanyField(${idx}, 'maCtu', this.value)" style="margin:4px 0 0; padding:8px 12px; font-size:12px; width:130px;">
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    else if (tab === 'users') {
      container.innerHTML = `
        <h2 style="font-size:16px; font-weight:800; margin-bottom:12px;"><i class="fa-solid fa-users" style="color:var(--primary);"></i> Quản Lý Nhân Viên</h2>
        <div class="grid-users">
          <div class="card">
            <h3 style="font-size:13px; font-weight:800; margin-bottom:10px; color:#F8FAFC;">Tạo Tài Khoản</h3>
            <form id="userForm" onsubmit="addUser(event)">
              <input type="text" id="usCode" placeholder="Mã NV" required>
              <input type="text" id="usName" placeholder="Tên NV" required>
              <input type="email" id="usEmail" placeholder="Email" required>
              <input type="text" id="usPass" placeholder="Mật khẩu" required>
              <select id="usRole"><option value="sales">Sales</option><option value="manager">Giám Sát</option><option value="accountant">Kế Toán</option><option value="admin">Admin</option></select>
              <button class="btn btn-green" style="width:100%;margin-top:10px;justify-content:center;font-weight:800;padding:11px;">Tạo NV</button>
            </form>
          </div>
          <div class="card">
            <h3 style="font-size:13px; font-weight:800; margin-bottom:10px; color:#F8FAFC;">Danh Sách Nhân Viên (${users.length})</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${users.map(u => `
                <div class="mobile-item-card" style="display:flex; flex-direction:column; gap:6px; margin:0;">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="background:rgba(99, 102, 241, 0.2); color:#818CF8; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:800;">[${u.code}] ${u.role}</span>
                    <button class="btn ${u.active!==false?'btn-red':'btn-green'} btn-sm" style="padding:5px 12px; font-size:11px;" onclick="toggleUserActive('${u.uid}', ${u.active===false})">${u.active!==false?'Khóa':'Mở'}</button>
                  </div>
                  <div style="font-size:13px; font-weight:800; color:#F8FAFC;">${u.name}</div>
                  <div style="font-size:11px; color:var(--text-muted);">📧 ${u.email}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }
  }

  function setNav(id, visible) { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !visible); }
  window.switchTab = function(tab) { currentTab = tab; window.location.hash = tab; renderUI(); };
</script>
</head>

<body>
<div class="app">
  <div id="loginView" class="login-container">
    <div class="login-card">
      <div style="text-align:center; margin-bottom: 24px;">
        <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5);">
          <i class="fa-solid fa-cloud" style="font-size: 26px; color: #fff;"></i>
        </div>
        <h1 class="brand-title" style="justify-content:center; font-size:20px; color:#fff; margin-bottom: 4px; white-space: nowrap;">DMS ĐẠI ĐÔNG <span>SALES PRO</span></h1>
      </div>

      <form onsubmit="handleLogin(event)">
        <label style="font-size: 12px; font-weight: 700; color: #E2E8F0; display: block; margin-bottom: 6px;">Tài khoản Email:</label>
        <div class="input-icon-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="logUser" required autocomplete="username" placeholder="nhanvien@dms.com">
        </div>

        <label style="font-size: 12px; font-weight: 700; color: #E2E8F0; display: block; margin-bottom: 6px;">Mật Khẩu:</label>
        <div class="input-icon-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="logPass" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <button class="btn btn-amber" style="width: 100%; padding: 14px; margin-top: 8px; justify-content: center; font-size: 15px; border-radius: 14px; font-weight: 800; box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);">
          <i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP HỆ THỐNG
        </button>
      </form>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div>
        <div class="brand-title" style="font-size:14px; white-space:nowrap;"><i class="fa-solid fa-network-wired" style="color:var(--amber);"></i> DMS ĐẠI ĐÔNG - SALES PRO</div>
        <small id="userInfo" style="color:#94A3B8;font-size:10px; font-weight:600;"></small>
      </div>
      <div class="nav-btns">
        <button id="navSales" class="btn btn-amber btn-sm hidden" onclick="switchTab('sales')"><i class="fa-solid fa-cart-shopping"></i> Bán Hàng</button>
        <button id="navSoGocBH" class="btn btn-green btn-sm hidden" onclick="switchTab('soGocBH')"><i class="fa-solid fa-book"></i> Sổ Gốc BH</button>
        <button id="navCustomers" class="btn btn-cyan btn-sm hidden" onclick="switchTab('customers')"><i class="fa-solid fa-address-book"></i> KH</button>
        <button id="navProductsAdmin" class="btn btn-blue btn-sm hidden" onclick="switchTab('productsAdmin')"><i class="fa-solid fa-boxes-stacked"></i> Hàng</button>
        <button id="navRoutes" class="btn btn-purple btn-sm hidden" onclick="switchTab('routes')"><i class="fa-solid fa-route"></i> DS Tuyến</button>
        <button id="navCompany" class="btn btn-pink btn-sm hidden" onclick="switchTab('company')"><i class="fa-solid fa-building"></i> DS Cty</button>
        <button id="navUsers" class="btn btn-amber btn-sm hidden" onclick="switchTab('users')"><i class="fa-solid fa-users"></i> NV</button>
        <button class="btn btn-purple btn-sm" onclick="openChangePasswordModal()"><i class="fa-solid fa-key"></i></button>
        <button class="btn btn-red btn-sm" onclick="handleLogout()"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
    
    <div class="panel">
      <div id="tabPane_sales" style="display:none;"></div>
      <div id="tabPane_customers" style="display:none;"></div>
      <div id="tabPane_soGocBH" style="display:none;"></div>
      <div id="tabPane_productsAdmin" style="display:none;"></div>
      <div id="tabPane_routes" style="display:none;"></div>
      <div id="tabPane_company" style="display:none;"></div>
      <div id="tabPane_users" style="display:none;"></div>
    </div>
  </div>
</div>

<div id="changePassModal" class="modal hidden"><div class="modal-content">
  <h3 style="font-size:16px; font-weight:800; margin-bottom:12px;"><i class="fa-solid fa-key"></i> Đổi Mật Khẩu</h3>
  <form onsubmit="submitChangePassword(event)" style="margin-top:10px;">
    <label style="font-size:12px; font-weight:700; color:var(--text-muted);">Mật Khẩu Cũ:</label><input type="password" id="oldPassInput" required>
    <label style="font-size:12px; font-weight:700; color:var(--text-muted);">Mật Khẩu Mới:</label><input id="newPassInput" required type="password">
    <label style="font-size:12px; font-weight:700; color:var(--text-muted);">Xác Nhận Mật Khẩu:</label><input type="password" id="confirmPassInput" required>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button type="submit" class="btn btn-green" style="flex:1;justify-content:center;font-weight:800;padding:11px;">Lưu</button>
      <button type="button" class="btn btn-red" onclick="closeChangePasswordModal()" style="font-weight:800;padding:11px 16px;">Hủy</button>
    </div>
  </form>
</div></div>

<div id="dynamicModalContainer" class="hidden"></div>

</body>
</html>
