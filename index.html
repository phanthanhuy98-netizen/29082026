<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  :root {
    --bg-dark: #0B0F19;
    --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --card-bg: #FFFFFF;
    --card-border: #E2E8F0;
    --primary: #4F46E5;
    --primary-gradient: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
    --amber: #F59E0B;
    --amber-gradient: linear-gradient(135deg, #FBBF24 0%, #D97706 100%);
    --emerald: #10B981;
    --emerald-gradient: linear-gradient(135deg, #34D399 0%, #059669 100%);
    --rose: #F43F5E;
    --rose-gradient: linear-gradient(135deg, #FB7185 0%, #E11D48 100%);
    --purple: #8B5CF6;
    --purple-gradient: linear-gradient(135deg, #A78BFA 0%, #7C3AED 100%);
    --text-main: #1E293B;
    --text-muted: #64748B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg-dark);background-image:var(--bg-gradient);color:var(--text-main);padding:14px;min-height:100vh;overflow-x:hidden;}
  .app{max-width:1440px;margin:0 auto;}
  .login-container { min-height: 95vh; display: flex; justify-content: center; align-items: center; position: relative; background: radial-gradient(circle at 30% 30%, #312E81 0%, #0F172A 70%); border-radius: 32px; overflow: hidden; }
  .login-card { width: 100%; max-width: 440px; padding: 44px 36px; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 32px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); color: #fff; z-index: 1; }
  .input-icon-group { position: relative; margin: 6px 0 14px; }
  .input-icon-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--amber); }
  .login-card input { background: #FFFFFF !important; border: 1px solid rgba(255, 255, 255, 0.2); color: #0F172A !important; padding: 14px 16px 14px 48px; border-radius: 16px; font-size: 14px; font-weight: 700; width: 100%; }
  .topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;background:rgba(15, 23, 42, 0.85);backdrop-filter:blur(16px);padding:18px 24px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.3);flex-wrap:wrap;gap:14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.1);}
  .brand-title{font-family:'Quicksand',sans-serif;font-size:26px;font-weight:700;color:#F8FAFC;display:flex;align-items:center;gap:10px;}
  .brand-title span{color:var(--amber);}
  .nav-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{background:#334155;color:#F8FAFC;border:none;padding:10px 18px;border-radius:14px;font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:8px;}
  .btn-amber{background:var(--amber-gradient);color:#0F172A;}
  .btn-green{background:var(--emerald-gradient);color:#fff;}
  .btn-red{background:var(--rose-gradient);color:#fff;}
  .btn-purple{background:var(--purple-gradient);color:#fff;}
  .btn-sm{padding:7px 14px;font-size:12px;border-radius:10px;}
  .panel{background:#F8FAFC;border-radius:28px;padding:26px;box-shadow:0 20px 40px rgba(0,0,0,0.4);border:1px solid #E2E8F0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;margin-top:14px;}
  .grid-products { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; margin-top: 14px; align-items: start; }
  .card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,0.03);}
  input, select, textarea { width:100%; padding:12px 16px; margin:8px 0 12px; border:1px solid #CBD5E1; border-radius:14px; font-family:inherit; font-size:13px; background:#F8FAFC; }
  .table-responsive { width: 100%; overflow-x: auto; margin-top: 12px; border-radius: 16px; border: 1px solid #E2E8F0; }
  table { width:100%; border-collapse:separate; border-spacing:0; }
  th, td { text-align:left; padding:14px 16px; border-bottom:1px solid #E2E8F0; font-size:13px; white-space:nowrap; }
  th { background:#F1F5F9; color:#334155; font-weight:800; text-transform:uppercase; font-size:11px; }
  .badge{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge-success{background:#ECFDF5;color:#059669;}
  .badge-pending{background:#FFFBEB;color:#D97706;}
  .badge-danger{background:#FEF2F2;color:#DC2626;}
  .stat-card{background:linear-gradient(135deg, #1E1B4B 100%, #312E81 0%);color:#fff;border-radius:22px;padding:22px;}
  .stat-number{font-size:30px;font-weight:800;color:#F8FAFC;margin-top:6px;font-family:'Quicksand',sans-serif;}
  #map { height: 420px; width: 100%; border-radius: 18px; margin-top: 12px; }
  .watermark-img{max-width:100%;border-radius:14px;margin-top:10px;border:3px solid #1E1B4B;}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:14px 32px;border-radius:36px;font-size:13px;font-weight:700;z-index:1200;}
  .sales-table th, .sales-table td { text-align: center; }
  .btn-qty-num { background: #F1F5F9; border: 1px solid #CBD5E1; color: #334155; width: 36px; height: 36px; border-radius: 12px; font-weight: 700; cursor: pointer; }
  .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .cat-tab-btn { background: #E2E8F0; color: #334155; border: none; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .cat-tab-btn.active { background: var(--primary-gradient); color: #fff; }
  .route-checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0 14px; background: #F1F5F9; padding: 12px; border-radius: 14px; }
  .history-box { background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 16px; padding: 16px; margin-top: 18px; max-height: 260px; overflow-y: auto; }
  .history-item { border-bottom: 1px solid #E2E8F0; padding: 10px 0; font-size: 12px; }
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15, 23, 42, 0.8);display:flex;justify-content:center;align-items:center;z-index:999;}
  .modal-content{background:#fff;padding:32px;border-radius:28px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;}
  .hidden{display:none !important;}
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    updatePassword, reauthenticateWithCredential, EmailAuthProvider, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs,
    serverTimestamp, enableIndexedDbPersistence, query, orderBy, limit, where, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCGCHPxhUnZzwjXhfw3hcy-9VPi9RrZ6HY",
    authDomain: "project-4126159910229398131.firebaseapp.com",
    projectId: "project-4126159910229398131",
    storageBucket: "project-4126159910229398131.firebasestorage.app",
    messagingSenderId: "87655220343",
    appId: "1:87655220343:web:15576d27653acbee16f272"
  };

  const app = initializeApp(firebaseConfig);
  const authSvc = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(function() {});

  const secondaryApp = initializeApp(firebaseConfig, "secondary");
  const secondaryAuth = getAuth(secondaryApp);

  let currentUser = null;
  let currentTab = 'sales';
  let stores = [], orders = [], users = [], checkins = [], products = [], promos = [], auditLogs = [], kpiTargets = [];
  let currentCart = {};
  let activeVisitedStore = null;
  let html5QrScanner = null;
  let isMapVisible = false;
  let leafletMapInstance = null;
  let managerMarker = null;
  let searchStoreTerm = "", searchProductTerm = "", filterRoute = "ALL", activeCategory = "ALL";
  let isReturnOrderMode = false;
  let orderFilterKeyword = "", orderFilterStatus = "ALL";

  let idbDb = null;
  function initIndexedDB() {
    return new Promise(function(resolve, reject) {
      const request = indexedDB.open("DMS_OfflineDB", 1);
      request.onerror = function() { reject(request.error); };
      request.onsuccess = function() { idbDb = request.result; resolve(idbDb); };
      request.onupgradeneeded = function(e) {
        const dbInstance = e.target.result;
        if (!dbInstance.objectStoreNames.contains("offlineOrders")) dbInstance.createObjectStore("offlineOrders", { keyPath: "id", autoIncrement: true });
        if (!dbInstance.objectStoreNames.contains("offlineCheckins")) dbInstance.createObjectStore("offlineCheckins", { keyPath: "id", autoIncrement: true });
      };
    });
  }

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 3200);
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
    const R = 6371e3, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function createWatermarkedImage(file, infoText) {
    return new Promise(function(resolve, reject) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const scale = Math.min(1, 480 / img.width);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const stripH = Math.max(50, Math.round(canvas.height * 0.16));
          ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
          ctx.fillRect(0, canvas.height - stripH, canvas.width, stripH);
          ctx.fillStyle = "#F59E0B";
          ctx.font = "bold 13px sans-serif";
          ctx.fillText("📍 DMS: " + infoText.storeName, 12, canvas.height - stripH + 18);
          ctx.fillStyle = "#FFFFFF";
          ctx.font = "10px sans-serif";
          ctx.fillText("NV: [" + infoText.salesCode + "] " + infoText.salesName, 12, canvas.height - stripH + 34);
          ctx.fillText("GPS: " + infoText.lat.toFixed(5) + ", " + infoText.lng.toFixed(5), 12, canvas.height - stripH + 48);
          resolve(canvas.toDataURL("image/jpeg", 0.55));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function parsePackRatio(quycachStr) {
    if (!quycachStr) return 24;
    const parts = quycachStr.toLowerCase().split('x');
    return parts.length === 2 ? (Number(parts[1]) || 24) : 24;
  }

  window.handleLogin = async function(e) {
    e.preventDefault();
    const email = document.getElementById('logUser').value.trim();
    const pass = document.getElementById('logPass').value.trim();
    try {
      await signInWithEmailAndPassword(authSvc, email, pass);
    } catch (err) { alert("Sai tài khoản hoặc mật khẩu."); }
  };

  onAuthStateChanged(authSvc, async function(user) {
    if (!user) {
      currentUser = null;
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('appView').classList.add('hidden');
      return;
    }
    const profileSnap = await getDoc(doc(db, "users", user.uid));
    if (!profileSnap.exists()) return alert("Tài khoản chưa phân quyền.");
    const profile = profileSnap.data();
    if (profile.active === false) { alert("⛔ Tài khoản bị khóa."); await signOut(authSvc); return; }
    currentUser = { uid: user.uid, email: user.email, name: profile.name, code: profile.code, role: profile.role };
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    currentTab = (profile.role === 'sales') ? 'sales' : 'dashboard';
    await initIndexedDB();
    attachListeners();
    renderUI();
  });

  window.handleLogout = async function() { await signOut(authSvc); };
  window.openChangePasswordModal = function() { document.getElementById('changePassModal').classList.remove('hidden'); };
  window.closeChangePasswordModal = function() { document.getElementById('changePassModal').classList.add('hidden'); };

  window.submitChangePassword = async function(e) {
    e.preventDefault();
    const oldP = document.getElementById('oldPassInput').value;
    const newP = document.getElementById('newPassInput').value;
    const confirmP = document.getElementById('confirmPassInput').value;
    if (newP !== confirmP) return alert("Mật khẩu mới không trùng khớp!");
    try {
      const cred = EmailAuthProvider.credential(authSvc.currentUser.email, oldP);
      await reauthenticateWithCredential(authSvc.currentUser, cred);
      await updatePassword(authSvc.currentUser, newP);
      alert("✅ Đổi mật khẩu thành công!");
      closeChangePasswordModal();
    } catch (err) { alert("⛔ Mật khẩu cũ không đúng."); }
  };

  window.doCheckinWithPhoto = function(storeId) {
    const store = stores.find(function(s) { return s.id === storeId; });
    const fileInput = document.getElementById('img_' + store.id);
    if (!fileInput || !fileInput.files[0]) return alert("⛔ BẮT BUỘC CHỤP ẢNH TẠI ĐIỂM BÁN!");
    const file = fileInput.files[0];

    navigator.geolocation.getCurrentPosition(async function(pos) {
      const userLat = pos.coords.latitude, userLng = pos.coords.longitude;
      let distance = 0;
      if (store.lat && store.lng) {
        distance = getDistanceMeters(userLat, userLng, store.lat, store.lng);
        if (distance > 30) return alert("⛔ CHECK-IN THẤT BẠI!\nKhoảng cách: " + Math.round(distance) + "m (>30m).");
      }
      try {
        const photo = await createWatermarkedImage(file, { storeName: store.name, salesCode: currentUser.code, salesName: currentUser.name, lat: userLat, lng: userLng });
        await addDoc(collection(db, "checkins"), {
          salesUid: currentUser.uid, salesName: currentUser.name, salesCode: currentUser.code,
          storeName: store.name, storeId: store.id, lat: userLat, lng: userLng, distance: distance,
          photo: photo, status: 'Checked-in (<30m)', createdAt: serverTimestamp()
        });
        activeVisitedStore = store;
        toast("✅ Checked-in thành công: " + store.name);
        renderUI();
      } catch (err) { alert("Lỗi lưu check-in: " + err.message); }
    }, function() { alert("⛔ LỖI GPS: Hãy bật GPS."); }, { enableHighAccuracy: true });
  };

  window.selectQuickQty = function(prdId, qty) {
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    currentCart[prdId].qty = qty;
    const p = products.find(function(x) { return x.id === prdId; });
    const packRatio = parsePackRatio(p ? p.quycach : '');
    currentCart[prdId].kien = Math.floor(qty / packRatio);
    currentCart[prdId].le = qty % packRatio;
    renderUI();
  };

  window.updateCartDetail = function(prdId, field, val) {
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    currentCart[prdId][field] = Number(val) || 0;
    const p = products.find(function(x) { return x.id === prdId; });
    const packRatio = parsePackRatio(p ? p.quycach : '');
    if (field === 'kien' || field === 'le') {
      currentCart[prdId].qty = (currentCart[prdId].kien * packRatio) + currentCart[prdId].le;
    }
    renderUI();
  };

  window.toggleReturnMode = function() {
    isReturnOrderMode = !isReturnOrderMode;
    toast(isReturnOrderMode ? "🔄 Chế độ: TRẢ HÀNG" : "🛒 Chế độ: BÁN HÀNG");
    renderUI();
  };

  window.submitOrder = async function() {
    if (!activeVisitedStore) return alert("Chưa chọn quầy hàng!");
    const items = [];
    let rawSubtotal = 0;

    products.forEach(function(p) {
      const c = currentCart[p.id];
      if (c && (c.qty > 0 || c.kien > 0 || c.le > 0)) {
        const itemTotal = (p.price || 0) * (c.qty || 1);
        rawSubtotal += itemTotal;
        items.push({ id: p.id, code: p.code, name: p.name, category: p.category || 'Khác', qty: c.qty, kien: c.kien, le: c.le, dvt: p.dvt || 'Hộp', price: p.price });
      }
    });

    if (items.length === 0) return alert("Vui lòng chọn số lượng hàng!");
    const finalAmount = isReturnOrderMode ? -rawSubtotal : rawSubtotal;

    await addDoc(collection(db, "orders"), {
      salesUid: currentUser.uid, salesName: currentUser.name, salesCode: currentUser.code,
      storeId: activeVisitedStore.id, maDTPN: (activeVisitedStore.code || 'KH') + "_" + activeVisitedStore.name,
      items: items, amount: finalAmount, rawSubtotal: rawSubtotal, isReturnOrder: isReturnOrderMode,
      paymentStatus: 'Công nợ', status: 'Chờ duyệt', createdAt: serverTimestamp()
    });

    toast("🚀 Gửi toa hàng thành công!");
    currentCart = {}; activeVisitedStore = null; isReturnOrderMode = false; renderUI();
  };

  window.approveOrder = async function(orderId) {
    await updateDoc(doc(db, "orders", orderId), { status: 'Đã duyệt' });
    toast("Đã duyệt đơn hàng!");
  };

  window.cancelOrder = async function(orderId) {
    await updateDoc(doc(db, "orders", orderId), { status: 'Đã hủy' });
    toast("Đã hủy đơn hàng.");
  };

  window.confirmPayment = async function(orderId) {
    await updateDoc(doc(db, "orders", orderId), { paymentStatus: 'Đã thanh toán' });
    toast("Đã xác nhận thanh toán.");
  };

  window.toggleLiveMap = function() {
    isMapVisible = !isMapVisible;
    const container = document.getElementById('mapContainer');
    const btn = document.getElementById('toggleMapBtn');
    if (isMapVisible) {
      container.classList.remove('hidden');
      btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> Ẩn Bản Đồ';
      setTimeout(function() {
        if (leafletMapInstance) leafletMapInstance.remove();
        leafletMapInstance = L.map('map').setView([10.7769, 106.7009], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(leafletMapInstance);
        checkins.forEach(function(c) {
          if (c.lat && c.lng) L.marker([c.lat, c.lng]).addTo(leafletMapInstance).bindPopup(c.salesName + " - " + c.storeName);
        });
      }, 200);
    } else {
      container.classList.add('hidden');
      btn.innerHTML = '<i class="fa-solid fa-map-location-dot"></i> Mở Bản Đồ Live Tracking';
    }
  };

  window.locateManagerOnMap = function() {
    if (!leafletMapInstance) return alert("Mở bản đồ trước!");
    navigator.geolocation.getCurrentPosition(function(pos) {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      if (managerMarker) leafletMapInstance.removeLayer(managerMarker);
      managerMarker = L.marker([lat, lng]).addTo(leafletMapInstance).bindPopup("Vị trí của bạn").openPopup();
      leafletMapInstance.setView([lat, lng], 15);
      toast("📍 Đã định vị vị trí của bạn!");
    }, function() { alert("Không lấy được GPS."); }, { enableHighAccuracy: true });
  };

  window.setSearchStore = function(val) { searchStoreTerm = val.toLowerCase(); renderUI(); };
  window.setSearchProduct = function(val) { searchProductTerm = val.toLowerCase(); renderUI(); };
  window.setActiveCategory = function(cat) { activeCategory = cat; renderUI(); };
  window.setOrderFilterKeyword = function(val) { orderFilterKeyword = val.toLowerCase(); renderUI(); };
  window.setOrderFilterStatus = function(val) { orderFilterStatus = val; renderUI(); };

  function attachListeners() {
    onSnapshot(collection(db, "stores"), function(snap) { stores = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }); renderUI(); });
    onSnapshot(collection(db, "products"), function(snap) { products = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }); renderUI(); });
    onSnapshot(collection(db, "orders"), function(snap) { orders = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }); renderUI(); });
    onSnapshot(collection(db, "promos"), function(snap) { promos = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }); renderUI(); });
    onSnapshot(collection(db, "kpiTargets"), function(snap) { kpiTargets = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }); renderUI(); });
    onSnapshot(query(collection(db, "checkins"), orderBy("createdAt", "desc"), limit(300)), function(snap) { checkins = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }); renderUI(); });
    if (currentUser.role === 'admin') {
      onSnapshot(collection(db, "users"), function(snap) { users = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }); renderUI(); });
    }
    if (currentUser.role === 'admin' || currentUser.role === 'manager') {
      onSnapshot(query(collection(db, "auditLogs"), orderBy("createdAt", "desc"), limit(200)), function(snap) { auditLogs = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }); renderUI(); });
    }
  }

  function renderUI() {
    if (!currentUser) return;
    document.getElementById('userInfo').innerHTML = '<i class="fa-solid fa-user-shield" style="color:var(--amber);"></i> [' + currentUser.code + '] ' + currentUser.name + ' (' + currentUser.role + ')';
    const isAdmin = currentUser.role === 'admin', isManager = currentUser.role === 'manager', isAccountant = currentUser.role === 'accountant';
    const backOffice = isAdmin || isManager || isAccountant;
    const isSales = currentUser.role === 'sales';

    setNav('navDash', backOffice); 
    setNav('navSales', isSales);
    setNav('navStores', backOffice);
    setNav('navOrders', true); 
    setNav('navPrd', isAdmin); 
    setNav('navPromo', isAdmin); 
    setNav('navKpi', true); 
    setNav('navAudit', backOffice); 
    setNav('navUsers', isAdmin);

    const main = document.getElementById('mainContent');

    if (currentTab === 'dashboard' && backOffice) {
      const totalRev = orders.filter(function(o) { return o.status !== 'Đã hủy'; }).reduce(function(sum, o) { return sum + (o.amount || 0); }, 0);
      main.innerHTML = '<h2 style="font-size:22px;font-weight:800;">Điều Hành Doanh Nghiệp</h2>' +
        '<div class="grid"><div class="stat-card"><span class="badge badge-pending">Tổng Doanh Số</span><div class="stat-number">' + totalRev.toLocaleString('vi-VN') + ' đ</div></div></div>' +
        '<div class="card" style="margin-top:18px;"><button id="toggleMapBtn" class="btn btn-purple" onclick="toggleLiveMap()">Mở Bản Đồ Live Tracking</button><div id="mapContainer" class="hidden"><button class="btn btn-green btn-sm" style="margin-top:10px;" onclick="locateManagerOnMap()">Định vị bản thân</button><div id="map"></div></div></div>';
    } else if (currentTab === 'sales' && isSales) {
      const filteredStores = stores.filter(function(s) {
        return (s.code || '').toLowerCase().includes(searchStoreTerm) || (s.name || '').toLowerCase().includes(searchStoreTerm);
      });
      const filteredProducts = products.filter(function(p) {
        return (p.code || '').toLowerCase().includes(searchProductTerm) || (p.name || '').toLowerCase().includes(searchProductTerm);
      });

      let storesHTML = filteredStores.slice(0, 50).map(function(s) {
        return '<div style="padding:12px 0;border-bottom:1px solid #E2E8F0;">' +
          '<b>' + (s.code || 'KH') + '_' + s.name + '</b><br>' +
          '<input type="file" id="img_' + s.id + '" accept="image/*" capture="environment" style="margin:6px 0;">' +
          '<button class="btn btn-amber btn-sm" onclick="doCheckinWithPhoto(\'' + s.id + '\')">Check-in GPS</button>' +
        '</div>';
      }).join('');

      let productsHTML = filteredProducts.map(function(p) {
        const c = currentCart[p.id] || { kien: 0, le: 0, qty: 0 };
        return '<tr>' +
          '<td><b>' + p.code + '</b></td><td>' + p.name + '</td>' +
          '<td><input type="number" value="' + c.kien + '" onchange="updateCartDetail(\'' + p.id + '\', \'kien\', this.value)"></td>' +
          '<td><input type="number" value="' + c.le + '" onchange="updateCartDetail(\'' + p.id + '\', \'le\', this.value)"></td>' +
          '<td><b style="color:var(--primary);">' + c.qty + '</b></td>' +
        '</tr>';
      }).join('');

      main.innerHTML = '<div class="grid">' +
        '<div class="card"><h3>Danh Sách Tiệm</h3><input type="text" placeholder="Tìm tiệm..." onkeyup="setSearchStore(this.value)"><div style="max-height:400px;overflow-y:auto;">' + storesHTML + '</div></div>' +
        '<div class="card" style="grid-column: span 2;">' + (activeVisitedStore ? 
          '<h3>Đặt Hàng: ' + activeVisitedStore.name + '</h3>' +
          '<button class="btn ' + (isReturnOrderMode ? 'btn-green' : 'btn-red') + ' btn-sm" onclick="toggleReturnMode()">' + (isReturnOrderMode ? 'Đơn Bán Hàng' : 'Đơn Trả Hàng') + '</button>' +
          '<input type="text" placeholder="Tìm hàng hóa..." onkeyup="setSearchProduct(this.value)" style="margin-top:10px;">' +
          '<table><thead><tr><th>Mã</th><th>Tên</th><th>Kiện</th><th>Lẻ</th><th>Tổng</th></tr></thead><tbody>' + productsHTML + '</tbody></table>' +
          '<button class="btn btn-green" style="width:100%;margin-top:14px;justify-content:center;" onclick="submitOrder()">GỬI TOA ĐƠN</button>'
          : '<p style="color:var(--text-muted);">Vui lòng Check-in GPS tại quầy để lập toa đơn.</p>') + '</div>' +
      '</div>';
    } else if (currentTab === 'orders') {
      const myOrders = isSales ? orders.filter(function(o) { return o.salesUid === currentUser.uid; }) : orders;
      const filteredOrders = myOrders.filter(function(o) {
        const matchKey = (o.maDTPN || '').toLowerCase().includes(orderFilterKeyword) || (o.salesName || '').toLowerCase().includes(orderFilterKeyword);
        const matchStatus = orderFilterStatus === 'ALL' || o.status === orderFilterStatus;
        return matchKey && matchStatus;
      });

      let ordersHTML = filteredOrders.map(function(o) {
        return '<tr>' +
          '<td><b>[' + (o.salesCode || 'NV') + ']</b> ' + (o.salesName || '') + '</td>' +
          '<td><b>' + o.maDTPN + '</b> ' + (o.isReturnOrder ? '<span class="badge badge-danger">Trả hàng</span>' : '') + '</td>' +
          '<td><b style="color:var(--rose);">' + (o.amount || 0).toLocaleString() + 'đ</b></td>' +
          '<td><span class="badge badge-success">' + o.status + '</span></td>' +
          '<td>' +
            (backOffice && o.status === 'Chờ duyệt' ? '<button class="btn btn-green btn-sm" onclick="approveOrder(\'' + o.id + '\')">Duyệt</button> <button class="btn btn-red btn-sm" onclick="cancelOrder(\'' + o.id + '\')">Hủy</button>' : '') +
          '</td>' +
        '</tr>';
      }).join('');

      main.innerHTML = '<h2>Danh Sách Đơn Hàng</h2>' +
        '<div class="card" style="margin-bottom:12px;"><input type="text" placeholder="Tìm kiếm đơn hàng..." onkeyup="setOrderFilterKeyword(this.value)"></div>' +
        '<div class="card"><div class="table-responsive"><table><thead><tr><th>Sales</th><th>Mã DTPN</th><th>Tổng Tiền</th><th>Trạng Thái</th><th>Thao Tác</th></tr></thead><tbody>' + ordersHTML + '</tbody></table></div></div>';
    } else {
      main.innerHTML = '<h2>Khu Vực Quản Trị Hệ Thống</h2><p>Chọn các danh mục trên thanh điều hướng để cấu hình chi tiết.</p>';
    }
  }

  function setNav(id, visible) { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !visible); }
  window.switchTab = function(tab) { currentTab = tab; renderUI(); };
</script>
</head>

<body>
<div class="app">
  <div id="loginView" class="login-container">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:30px;">
        <h1 class="brand-title" style="justify-content:center;font-size:32px;color:#fff;"><i class="fa-solid fa-cloud" style="color:var(--primary);"></i> DMS <span>SFA</span> PRO</h1>
        <p style="font-size:12px;color:#94A3B8;margin-top:6px;font-weight:600;">HỆ THỐNG PHÂN PHỐI DOANH NGHIỆP ROYAL ELEGANT</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <label style="font-size:12px;font-weight:700;color:#CBD5E1;">Email Tài Khoản:</label>
        <div class="input-icon-group"><i class="fa-solid fa-envelope"></i><input type="email" id="logUser" required placeholder="admin@dms.com"></div>
        <label style="font-size:12px;font-weight:700;color:#CBD5E1;margin-top:10px;display:block;">Mật Khẩu:</label>
        <div class="input-icon-group"><i class="fa-solid fa-lock"></i><input type="password" id="logPass" required placeholder="••••••••"></div>
        <button class="btn btn-amber" style="width:100%;padding:15px;margin-top:22px;justify-content:center;font-size:15px;border-radius:16px;font-weight:800;"><i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP HỆ THỐNG</button>
      </form>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div>
        <div class="brand-title"><i class="fa-solid fa-network-wired" style="color:var(--amber);"></i> DMS <span>CLOUD SFA</span></div>
        <small id="userInfo" style="color:#94A3B8;font-size:11px;font-weight:600;"></small>
      </div>
      <div class="nav-btns">
        <button id="navDash" class="btn btn-amber hidden" onclick="switchTab('dashboard')">Dashboard</button>
        <button id="navSales" class="btn hidden" onclick="switchTab('sales')">Toa Bán Hàng</button>
        <button id="navStores" class="btn hidden" onclick="switchTab('stores')">Tuyến / Tiệm</button>
        <button id="navOrders" class="btn" onclick="switchTab('orders')">Đơn Hàng</button>
        <button id="navPrd" class="btn hidden" onclick="switchTab('products')">Hàng Hóa</button>
        <button id="navPromo" class="btn hidden" onclick="switchTab('promos')">Khuyến Mãi</button>
        <button id="navKpi" class="btn" onclick="switchTab('kpi')">KPI</button>
        <button id="navAudit" class="btn hidden" onclick="switchTab('audit')">Audit Log</button>
        <button id="navUsers" class="btn hidden" onclick="switchTab('users')">Nhân Viên</button>
        <button class="btn btn-purple" onclick="openChangePasswordModal()">Đổi Pass</button>
        <button class="btn btn-red" onclick="handleLogout()">Đăng Xuất</button>
      </div>
    </div>
    <div class="panel" id="mainContent"></div>
  </div>
</div>

<div id="changePassModal" class="modal hidden"><div class="modal-content">
  <h3 style="font-size:16px;font-weight:800;">Đổi Mật Khẩu</h3>
  <form onsubmit="submitChangePassword(event)" style="margin-top:14px;">
    <label>Mật Khẩu Hiện Tại:</label><input type="password" id="oldPassInput" required>
    <label>Mật Khẩu Mới:</label><input type="password" id="newPassInput" required>
    <label>Xác Nhận Mật Khẩu:</label><input type="password" id="confirmPassInput" required>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button type="submit" class="btn btn-green" style="flex:1;justify-content:center;">Lưu</button>
      <button type="button" class="btn btn-red" onclick="closeChangePasswordModal()">Hủy</button>
    </div>
  </form>
</div></div>

</body>
</html>
