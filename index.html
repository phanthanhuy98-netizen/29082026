  function initIndexedDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open("DMS_OfflineDB", 10);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { idbDb = request.result; resolve(idbDb); };
      request.onupgradeneeded = (e) => {
        const dbInstance = e.target.result;
        if (!dbInstance.objectStoreNames.contains("offlineOrders")) dbInstance.createObjectStore("offlineOrders", { keyPath: "id", autoIncrement: true });
        if (!dbInstance.objectStoreNames.contains("localProducts")) dbInstance.createObjectStore("localProducts", { keyPath: "code" });
        if (!dbInstance.objectStoreNames.contains("localStores")) dbInstance.createObjectStore("localStores", { keyPath: "id" });
      };
    });
  }

  async function saveProductsToLocalCache(list) {
    if (!idbDb) await initIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = idbDb.transaction(["localProducts"], "readwrite");
      const store = transaction.objectStore("localProducts");
      store.clear();
      list.forEach(p => store.put(p));
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    });
  }

  async function loadProductsFromLocalCache() {
    if (!idbDb) await initIndexedDB();
    return new Promise((resolve, reject) => {
      const transaction = idbDb.transaction(["localProducts"], "readonly");
      const store = transaction.objectStore("localProducts");
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

    return "k_" + btoa(unescape(encodeURIComponent(code))).replace(/[^a-zA-Z0-9]/g, "");

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);

  function removeAccents(str) {
    if (!str) return '';
    return str.normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/đ/g, 'd').replace(/Đ/g, 'D')
              .toLowerCase();
  }

  function buildStoreIndex() {
    storeIndexMap.clear();
    stores.forEach(s => {
      const textTokens = removeAccents(`${s.code || ''} ${s.name || ''} ${s.address || ''} ${s.phone || ''}`);
      storeIndexMap.set(String(s.id), { store: s, searchableText: textTokens });
    });
  }

  function buildProductIndex() {
    productIndexMap.clear();
    products.forEach(p => {
      const textTokens = removeAccents(`${p.code || ''} ${p.name || ''}`);
      productIndexMap.set(p.id || p.code, { product: p, searchableText: textTokens });
    });
  }

  window.updateCartDetail = function(prdId, field, val) {
    const safeK = getSafeKey(prdId);
    const p = products.find(x => x.id === prdId || x.code === prdId);
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    
    let cleanStr = String(val !== undefined && val !== null ? val : '').replace(/[^0-9]/g, '');
    let cleanVal = cleanStr === '' ? 0 : Math.max(0, parseInt(cleanStr, 10));
    
    currentCart[prdId][field] = cleanVal;
    
    const packRatio = p?.tyLeQuyDoi || 50;
    
    if (field === 'kien' || field === 'le') {
      currentCart[prdId].qty = (Number(currentCart[prdId].kien || 0) * packRatio) + Number(currentCart[prdId].le || 0);
    } else if (field === 'qty') {
      const totalQ = cleanVal;
      currentCart[prdId].kien = packRatio > 0 ? Math.floor(totalQ / packRatio) : 0;
      currentCart[prdId].le = packRatio > 0 ? totalQ % packRatio : totalQ;
    }
    
    const leDisplay = currentCart[prdId].le;
    const kienDisplay = currentCart[prdId].kien;
    const totalQDisplay = currentCart[prdId].qty;
    const itemTotal = (p?.price || 0) * totalQDisplay;

    document.querySelectorAll(`.input-le-${safeK}`).forEach(el => {
      if (document.activeElement !== el) el.value = leDisplay;
    });
    document.querySelectorAll(`.input-kien-${safeK}`).forEach(el => {
      if (document.activeElement !== el) el.value = kienDisplay;
    });

    const rowTotalEl = document.getElementById(`row_total_${safeK}`);
    const mobileRowTotalEl = document.getElementById(`mobile_row_total_${safeK}`);
    const totalQtyEl = document.getElementById(`total_qty_${safeK}`);

    if (rowTotalEl) rowTotalEl.innerText = itemTotal.toLocaleString() + 'đ';
    if (mobileRowTotalEl) mobileRowTotalEl.innerText = itemTotal.toLocaleString() + 'đ';
    if (totalQtyEl) totalQtyEl.innerText = totalQDisplay;

    const rowEl = document.getElementById(`row_item_${safeK}`);
    const cardEl = document.getElementById(`card_item_${safeK}`);
    const hasQty = totalQDisplay > 0;
    
    if (rowEl) rowEl.classList.toggle('has-selected', hasQty);
    if (cardEl) cardEl.classList.toggle('has-selected', hasQty);

    updateCartTotalsUI();
  };

  window.adjustQty = function(prdId, field, delta) {
    if (!currentCart[prdId]) currentCart[prdId] = { qty: 0, kien: 0, le: 0 };
    let curVal = Number(currentCart[prdId][field]) || 0;
    let newVal = curVal + delta;
    if (newVal < 0) newVal = 0;
    
    const safeK = getSafeKey(prdId);
    const inputClass = field === 'le' ? `.input-le-${safeK}` : `.input-kien-${safeK}`;
    document.querySelectorAll(inputClass).forEach(el => {
      el.value = newVal;
    });

    window.updateCartDetail(prdId, field, newVal);
  };

  window.filterSoGocRows = function(val) {
    if (val !== undefined) soGocFilterKeyword = val.toLowerCase();
    const queryKey = removeAccents(soGocFilterKeyword.trim());
    const rows = document.querySelectorAll('#soGocTableBody tr[data-so-ctu]');
    let cleanSoCtuKey = queryKey.replace('#', '').trim();

    let totalFilteredAmount = 0;

    rows.forEach(r => {
      const soCtu = r.getAttribute('data-so-ctu') || '';
      const maDtpn = r.getAttribute('data-ma-dtpn') || '';
      const maNv = r.getAttribute('data-ma-nv') || '';
      const tenNv = r.getAttribute('data-ten-nv') || '';
      const ngayCtu = r.getAttribute('data-ngay-ctu') || '';
      const orderAmount = Number(r.getAttribute('data-order-amount')) || 0;

      const matchSoCtu = cleanSoCtuKey === "" || soCtu.includes(cleanSoCtuKey);
      const matchOther = queryKey === "" || 
        matchSoCtu ||
        maDtpn.includes(queryKey) || 
        maNv.includes(queryKey) || 
        tenNv.includes(queryKey);

      const matchDate = soGocFilterDate === "" || ngayCtu === soGocFilterDate;
      const matchSales = soGocSalesFilter === "" || maNv === soGocSalesFilter;

      const isVisible = matchOther && matchDate && matchSales;
      r.style.display = isVisible ? '' : 'none';

      if (isVisible) {
        totalFilteredAmount += orderAmount;
      }
    });

    const sumEl = document.getElementById('soGocTotalRevenueVal');
    if (sumEl) sumEl.innerText = totalFilteredAmount.toLocaleString() + ' đ';
  };

  async function getNextSoCtu() {
    try {
      const counterRef = doc(db, "systemCounters", "soCtuCounter");
      const counterSnap = await getDoc(counterRef);
      let currentVal = 0;
      if (counterSnap.exists()) {
        currentVal = Number(counterSnap.data().currentVal) || 0;
      }
      currentVal++;
      if (currentVal > 100000) {
        currentVal = 1;
      }
      await setDoc(counterRef, { currentVal });
      return currentVal;
    } catch (err) {
      console.error("Lỗi cấp phát số chứng từ:", err);
      return Math.floor(Math.random() * 100000) + 1;
    }
  }

  window.submitOrder = async function() {
    if (!activeVisitedStore) return alert("Chưa chọn quầy hàng!");
    const items = [];
    let rawSubtotal = 0;

    products.forEach(p => {
      const possibleKeys = [p.id, p.code].filter(Boolean);
      let c = null;

      for (const k of possibleKeys) {
        if (currentCart[k] && currentCart[k].qty > 0) {
          c = currentCart[k];
          break;
        }
      }

      if (c && c.qty > 0) {
        const itemTotal = (p.price || 0) * c.qty;
        rawSubtotal += itemTotal;
        items.push({ 
          id: p.id || p.code, 
          code: p.code, 
          name: p.name, 
          dvt: p.dvt || 'hộp', 
          qty: c.qty, 
          kien: c.kien || 0, 
          le: c.le || 0, 
          price: p.price || 0 
        });
      }
    });

    if (items.length === 0) {
      return alert("Vui lòng chọn số lượng hàng trước khi gửi đơn!");
    }

    const unpaidOrdersTotal = orders
      .filter(o => o.storeId === activeVisitedStore.id && o.paymentStatus !== 'Đã thanh toán' && o.status !== 'Đã hủy')
      .reduce((s, o) => s + (o.amount || 0), 0);
    
    const storeCreditLimit = activeVisitedStore.creditLimit || 20000000;
    if ((unpaidOrdersTotal + rawSubtotal) > storeCreditLimit) {
      return alert(`⛔ Khóa đơn: Vượt hạn mức nợ (${storeCreditLimit.toLocaleString()}đ)!`);
    }

    const nextSoCtu = await getNextSoCtu();
    const finalAmount = rawSubtotal;
    
    const currentSalesString = `${currentUser.name}`;
    const currentCustomerString = `${activeVisitedStore.code || 'KH'} - ${activeVisitedStore.name}`;

    const orderData = {
      soCtu: nextSoCtu,
      ngayCtu: new Date().toISOString().slice(0, 10),
      maDTPNNo: activeVisitedStore.code || '',
      maNhanVien: currentUser.code || '',
      tenNhanVien: currentUser.name || '',
      maKH: currentCustomerString,
      nvBan: currentSalesString,
      salesUid: currentUser.uid, 
      salesName: currentUser.name, 
      salesCode: currentUser.code,
      storeId: activeVisitedStore.id, 
      items, 
      amount: finalAmount, 
      rawSubtotal,
      isReturnOrder: false, 
      paymentStatus: 'Công nợ', 
      status: 'Chờ duyệt', 
      createdAt: serverTimestamp()
    };

    try {
      await addDoc(collection(db, "orders"), orderData);
      toast(`🚀 Lưu đơn thành công! Số chứng từ: ${nextSoCtu}`);
      
      currentCart = {}; 
      activeVisitedStore = null; 
      productSearchKeyword = ""; 
      salesSearchKeyword = "";
      customerSearchKeyword = "";
      selectedCompanyCode = "";
      showOnlySelectedItems = false; 

      switchTab('soGocBH');
    } catch (err) {
      console.error("Lỗi lưu đơn hàng lên Firestore:", err);
      alert("Không thể lưu đơn hàng: " + err.message);
    }
  };

  window.importProductsExcel = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        toast("⏳ Đang đọc file Excel...");
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        
        let rawProducts = [];
        for (let i = 0; i < jsonRows.length; i++) {
          const r = jsonRows[i];
          const code = r[0] ? String(r[0]).trim() : '';
          const name = r[1] ? String(r[1]).trim() : '';
          const dvt = r[2] ? String(r[2]).trim() : 'hộp';
          
          if (code && code !== 'Ma VTHH' && code !== 'undefined') {
            rawProducts.push({
              id: code,
              code: code, name: name, dvt: dvt,
              stockDau: Number(r[3]) || 0, stockCuoi: Number(r[4]) || 0,
              price: Number(r[5]) || 0, tyLeQuyDoi: Number(r[6]) || 50
            });
          }
        }

        if (rawProducts.length > 0) {
          const uniqueMap = new Map();
          rawProducts.forEach(p => { if (!uniqueMap.has(p.code)) uniqueMap.set(p.code, p); });
          const uniqueList = Array.from(uniqueMap.values());

          toast("⏳ Đang làm sạch cơ sở dữ liệu cũ trên Firestore...");
          const existingSnap = await getDocs(collection(db, "products"));
          const docsArr = existingSnap.docs;
          for (let i = 0; i < docsArr.length; i += 250) {
            const chunk = docsArr.slice(i, i + 250);
            const deleteBatch = writeBatch(db);
            chunk.forEach(d => deleteBatch.delete(d.ref));
            await deleteBatch.commit();
          }

          toast(`⏳ Đang đẩy ${uniqueList.length} vật tư lên Cloud Firestore...`);
          for (let i = 0; i < uniqueList.length; i += 300) {
            const chunk = uniqueList.slice(i, i + 300);
            const batch = writeBatch(db);
            chunk.forEach(p => batch.set(doc(db, "products", p.code), p));
            await batch.commit();
            await new Promise(r => setTimeout(r, 40));
          }

          await saveProductsToLocalCache(uniqueList);
          products = uniqueList;
          buildProductIndex();
          toast(`✅ Đã đồng bộ thành công ${uniqueList.length} vật tư!`);
          renderUI();
        } else { alert("Không tìm thấy dữ liệu vật tư hợp lệ!"); }
      } catch (err) { alert("Lỗi: " + err.message); }
    };
    reader.readAsArrayBuffer(file);
  };

        const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        
        let newList = [];
        for (let i = 0; i < jsonRows.length; i++) {
          const r = jsonRows[i];
          const maCtu = r[0] ? String(r[0]).trim() : '';
          const tenCtu = r[1] ? String(r[1]).trim() : '';
          if (maCtu && maCtu !== 'MaCTu') {
            newList.push({ maCtu, tenCtu, status: "Mở" });
          }
        }
        if (newList.length > 0) {
          companyList = newList;
          renderUI();
          toast(`✅ Đã tải thành công ${newList.length} dòng công ty!`);
        } else {
          alert("Không tìm thấy dữ liệu hợp lệ trong file!");
        }
      } catch (err) { alert("Lỗi đọc file: " + err.message); }
    };
    reader.readAsArrayBuffer(file);
  };

  window.importRoutesExcel = function(event) {
    if (currentUser.role !== 'admin') return alert("⛔ Chỉ Admin mới có quyền tải file này!");
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        toast("⏳ Đang đọc file Excel Tuyến...");
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        
        let newList = [];
        for (let i = 0; i < jsonRows.length; i++) {
          const r = jsonRows[i];
          const nhomDoiTuong = r[0] !== undefined && r[0] !== '' ? String(r[0]).trim() : '';
          const noiDung = r[1] ? String(r[1]).trim() : '';
          const ghiChu = r[2] ? String(r[2]).trim() : '';
          if (nhomDoiTuong && nhomDoiTuong !== 'Nhóm đối tượng') {
            newList.push({ nhomDoiTuong, noiDung, ghiChu });
          }
        }
        if (newList.length > 0) {
          routeGroupsList = newList;
          renderUI();
          toast(`✅ Đã tải thành công ${newList.length} dòng tuyến!`);
        } else {
          alert("Không tìm thấy dữ liệu hợp lệ trong file!");
        }
      } catch (err) { alert("Lỗi đọc file: " + err.message); }
    };
    reader.readAsArrayBuffer(file);
  };

  function attachListeners() {
    onSnapshot(collection(db, "stores"), async snap => {
      stores = snap.docs.map(d => ({id:d.id, ...d.data()}));
      buildStoreIndex();
      await saveStoresToLocalCache(stores);
      renderUI();
    });
    onSnapshot(collection(db, "orders"), snap => { orders = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
    onSnapshot(query(collection(db, "checkins"), orderBy("createdAt","desc"), limit(100)), snap => { checkins = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
    onSnapshot(collection(db, "products"), async snap => {
      const cloudProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (cloudProducts.length > 0) {
        products = cloudProducts;
        buildProductIndex();
        await saveProductsToLocalCache(cloudProducts);
      }
      renderUI();

    if (currentUser.role === 'admin') onSnapshot(collection(db, "users"), snap => { users = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
  }

              ${uniqueSalesList.map(code => `<option value="${code}" ${soGocSalesFilter===code?'selected':''}>${code}</option>`).join('')}
            </select>

            <button class="btn btn-green btn-sm" onclick="exportSoGocExcel()"><i class="fa-solid fa-file-excel"></i> Xuất Excel</button>
            ${isAdmin ? `<button class="btn btn-red btn-sm" onclick="adminDeleteAllOrders()"><i class="fa-solid fa-trash-can"></i> Xóa Tất Cả</button>` : ''}
          </div>
        </div>

        <div style="background: linear-gradient(135deg, #1E1B4B 0%, #312E81 100%); padding: 12px 18px; border-radius: 12px; color: #fff; margin-bottom: 12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div style="font-size:13px; font-weight:700; color:#CBD5E1;"><i class="fa-solid fa-chart-pie" style="color:var(--amber);"></i> Tổng doanh thu theo bộ lọc hiện tại:</div>
          <div style="font-size:18px; font-weight:800; color:var(--amber);" id="soGocTotalRevenueVal">0 đ</div>
        </div>

        <div class="card" style="margin-bottom:10px; padding:12px;">
          <input type="text" placeholder="🔍 Tìm kiếm số chứng từ (1, 2...), mã DTPN, nhân viên..." oninput="filterSoGocRows(this.value)" value="${soGocFilterKeyword}" style="margin:0; background:#fff; padding:10px 12px; font-size:13px;">
        </div>

        <div class="table-responsive">
          <table id="soGocTable">
            <thead>
              <tr>
                <th>So CTu</th>
                <th>Ngay CTu</th>
                <th>Ma DTPNNo</th>
                <th>Tên Khách Hàng</th>
                <th>Ma NV</th>
                <th>Tên Nhân Viên</th>
                <th>Tổng SL</th>
                <th>Tổng Thành Tiền</th>
                <th style="text-align:right;">Thao Tác</th>
              </tr>
            </thead>
            <tbody id="soGocTableBody">
              ${limitedOrders.length > 0 ? limitedOrders.map(o => `
                <tr data-so-ctu="${o.soCtu}" data-ma-dtpn="${removeAccents(o.maDTPNNo)}" data-ma-nv="${removeAccents(o.maNhanVien)}" data-ten-nv="${removeAccents(o.tenNhanVien)}" data-ngay-ctu="${o.ngayCtu}" data-order-amount="${o.amount}">
                  <td><b>${o.soCtu}</b></td>
                  <td style="white-space: nowrap;">${o.ngayCtuFormatted}</td>
                  <td><b>${o.maDTPNNo}</b></td>
                  <td>${o.maKH}</td>
                  <td><b>${o.maNhanVien}</b></td>
                  <td style="white-space: nowrap;">${o.tenNhanVien}</td>
                  <td><b style="color:var(--primary);">${o.totalQty}</b></td>
                  <td style="white-space: nowrap;"><b style="color:var(--rose);">${o.amount.toLocaleString()}đ</b></td>
                  <td style="text-align:right; white-space: nowrap;">
                    <button class="btn btn-amber btn-sm" style="padding:4px 8px; font-size:10px;" onclick="openOrderDetailsModal('${o.orderId}')"><i class="fa-solid fa-eye"></i> Xem Chi Tiết</button>
                    ${isAdmin ? `<button class="btn btn-red btn-sm" style="padding:4px 8px; font-size:10px; margin-left:4px;" onclick="adminDeleteOrder('${o.orderId}', '${o.soCtu}')"><i class="fa-solid fa-trash"></i> Xóa</button>` : ''}
                  </td>
                </tr>
              `).join('') : `
                <tr><td colspan="9" style="text-align:center; padding:30px; color:var(--text-muted); font-weight:700;">Chưa có dữ liệu giao dịch trong sổ gốc.</td></tr>
              `}
            </tbody>
          </table>
        </div>

        <div style="display:none;">
          <table id="soGocExportTable">
            <thead>
              <tr>
                <th>So CTu</th>
                <th>Ngay CTu</th>
                <th>Ma DTPNNo</th>
                <th>Ma Nhan Vien</th>
                <th>TenNhanVien</th>
                <th>Ma VTHHCo</th>
                <th>Ten Hang Hoa</th>
                <th>Don Vi Tinh</th>
                <th>So Luong</th>
                <th>VND Don Gia</th>
                <th>VND Thanh Tien</th>
              </tr>
            </thead>
            <tbody>
              ${flatExcelRows.map(r => `
                <tr>
                  <td><b>${r.soCtu}</b></td>
                  <td>${r.ngayCtuFormatted}</td>
                  <td><b>${r.maDTPNNo}</b></td>
                  <td><b>${r.maNhanVien}</b></td>
                  <td>${r.tenNhanVien}</td>
                  <td><b>${r.maVTHHCo}</b></td>
                  <td>${r.tenHangHoa}</td>
                  <td>${r.donViTinh}</td>
                  <td><b>${r.soLuong}</b></td>
                  <td>${r.vndDonGia}</td>
                  <td><b>${r.vndThanhTien}</b></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        ${allGroupedList.length > soGocLimitCount ? `
          <div style="text-align:center; margin-top:12px;">
            <button class="btn btn-amber" onclick="loadMoreSoGoc()"><i class="fa-solid fa-angles-down"></i> Tải thêm đơn hàng cũ hơn (${soGocLimitCount}/${allGroupedList.length})</button>
          </div>
        ` : ''}
      `;
      setTimeout(() => filterSoGocRows(), 0);
    }

    else if (tab === 'productsAdmin') {
      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <h2 style="font-size:16px; font-weight:800;"><i class="fa-solid fa-boxes-stacked" style="color:var(--amber);"></i> Quản Lý Vật Tư (${products.length})</h2>
          <label class="btn btn-green btn-sm" style="cursor:pointer;margin:0;"><i class="fa-solid fa-file-arrow-up"></i> Tải Excel <input type="file" accept=".xlsx, .csv" onchange="importProductsExcel(event)" style="display:none;"></label>
        </div>
        <div class="card" style="margin-bottom:10px;">
          <input type="text" placeholder="🔍 Gõ nhanh mã hoặc tên vật tư để tìm kiếm..." oninput="filterTabProducts(this.value)" value="" style="margin:0; background:#fff; padding:10px 12px; font-size:13px;">
        </div>
        <div id="productCardsContainer">
          <div style="text-align:center; padding:20px; color:var(--text-muted); font-weight:700;">Nhập mã hoặc tên vật tư để tìm kiếm...</div>
        </div>
        <small id="tabPrdSearchHint" style="color:var(--text-muted); font-weight:700; display:block; margin-top:8px;">
          Vui lòng gõ mã hoặc tên vật tư để tìm kiếm...
        </small>
      `;
    }

    else if (tab === 'routes') {
      const isAdmin = currentUser && currentUser.role === 'admin';
      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
          <h2 style="font-size:15px; font-weight:800;"><i class="fa-solid fa-route" style="color:var(--amber);"></i> DS Tuyến (${routeGroupsList.length})</h2>
          <div style="display:flex; gap:6px;">
            ${isAdmin ? `<button class="btn btn-amber btn-sm" onclick="addNewRoute()"><i class="fa-solid fa-plus"></i> Thêm Tuyến</button>` : ''}
            ${isAdmin ? `<label class="btn btn-green btn-sm" style="cursor:pointer;margin:0;"><i class="fa-solid fa-file-arrow-up"></i> Tải Excel Tuyến <input type="file" accept=".xlsx, .csv" onchange="importRoutesExcel(event)" style="display:none;"></label>` : ''}
          </div>
        </div>
        <div class="card" style="margin-bottom:10px; padding:10px;">
          <input type="text" placeholder="🔍 Tìm kiếm nhóm đối tượng, nội dung, ghi chú..." style="margin:0; background:#fff; padding:10px 12px; font-size:14px;" oninput="filterRouteTable(this.value)">
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Nhóm đối tượng</th>
                <th>Nội dung</th>
                <th>Ghi chú</th>
                ${isAdmin ? '<th style="text-align:right;">Thao Tác</th>' : ''}
              </tr>
            </thead>
            <tbody id="routeTableBody">
              ${routeGroupsList.map((r, idx) => `
                <tr>
                  <td><b>${r.nhomDoiTuong || ''}</b></td>
                  <td>${isAdmin ? `<input type="text" value="${r.noiDung || ''}" onchange="updateRouteField(${idx}, 'noiDung', this.value)" style="margin:0; padding:8px; background:#fff; font-size:14px;">` : (r.noiDung || '')}</td>
                  <td>${isAdmin ? `<input type="text" value="${r.ghiChu || ''}" onchange="updateRouteField(${idx}, 'ghiChu', this.value)" style="margin:0; padding:8px; background:#fff; font-size:14px;">` : (r.ghiChu || '')}</td>
                  ${isAdmin ? `<td style="text-align:right;"><button class="btn btn-red btn-sm" onclick="deleteRouteItem(${idx})"><i class="fa-solid fa-trash"></i></button></td>` : ''}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    else if (tab === 'company') {
      const isAdmin = currentUser && currentUser.role === 'admin';
      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
          <h2 style="font-size:15px; font-weight:800;"><i class="fa-solid fa-building" style="color:var(--primary);"></i> DS Mã Công Ty (${companyList.length})</h2>
          <div style="display:flex; gap:6px;">
            ${isAdmin ? `<button class="btn btn-amber btn-sm" onclick="addNewCompany()"><i class="fa-solid fa-plus"></i> Thêm Công Ty</button>` : ''}
            ${isAdmin ? `<label class="btn btn-green btn-sm" style="cursor:pointer;margin:0;"><i class="fa-solid fa-file-arrow-up"></i> Tải Excel Cty <input type="file" accept=".xlsx, .csv" onchange="importCompanyExcel(event)" style="display:none;"></label>` : ''}
          </div>
        </div>
        <div class="card" style="margin-bottom:10px; padding:10px;">
          <input type="text" placeholder="🔍 Tìm kiếm mã công ty, tên công ty..." style="margin:0; background:#fff; padding:10px 12px; font-size:14px;" oninput="filterCompanyTable(this.value)">
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>MaCTu</th>
                <th>TenCTu</th>
                <th>Trạng Thái</th>
                ${isAdmin ? '<th style="text-align:right;">Thao Tác</th>' : ''}
              </tr>
            </thead>
            <tbody id="companyTableBody">
              ${companyList.map((c, idx) => `
                <tr>
                  <td><b>${isAdmin ? `<input type="text" value="${c.maCtu || ''}" onchange="updateCompanyField(${idx}, 'maCtu', this.value)" style="margin:0; width:80px; padding:8px; background:#fff; font-size:14px;">` : (c.maCtu || '')}</b></td>
                  <td>${isAdmin ? `<input type="text" value="${c.tenCtu || ''}" onchange="updateCompanyField(${idx}, 'tenCtu', this.value)" style="margin:0; padding:8px; background:#fff; font-size:14px;">` : (c.tenCtu || '')}</td>
                  <td>
                    ${isAdmin ? `
                      <select onchange="updateCompanyField(${idx}, 'status', this.value)" style="margin:0; padding:6px; font-size:13px; background:${c.status === 'Đóng' ? '#FEF2F2' : '#ECFDF5'}; color:${c.status === 'Đóng' ? '#DC2626' : '#059669'}; font-weight:700;">
                        <option value="Mở" ${c.status === 'Mở' ? 'selected' : ''}>Mở</option>
                        <option value="Đóng" ${c.status === 'Đóng' ? 'selected' : ''}>Đóng</option>
                      </select>
                    ` : `
                      <span class="badge ${c.status === 'Đóng' ? 'badge-danger' : 'badge-success'}">${c.status || 'Mở'}</span>
                    `}
                  </td>
                  ${isAdmin ? `<td style="text-align:right;"><button class="btn btn-red btn-sm" onclick="deleteCompanyItem(${idx})"><i class="fa-solid fa-trash"></i></button></td>` : ''}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    else if (tab === 'users') {
      container.innerHTML = `
        <h2 style="font-size:16px; font-weight:800; margin-bottom:10px;"><i class="fa-solid fa-users" style="color:var(--primary);"></i> Quản Lý Nhân Viên</h2>
        <div class="grid-users">
          <div class="card">
            <h3 style="font-size:14px; font-weight:800; margin-bottom:8px;">Tạo Tài Khoản</h3>
            <form id="userForm" onsubmit="addUser(event)">
              <input type="text" id="usCode" placeholder="Mã NV" required>
              <input type="text" id="usName" placeholder="Tên NV" required>
              <input type="email" id="usEmail" placeholder="Email" required>
              <input type="text" id="usPass" placeholder="Mật khẩu" required>
              <select id="usRole"><option value="sales">Sales</option><option value="manager">Giám Sát</option><option value="accountant">Kế Toán</option><option value="admin">Admin</option></select>
              <button class="btn btn-green" style="width:100%;margin-top:8px;justify-content:center;font-weight:800;">Tạo NV</button>
            </form>
          </div>
          <div class="card" style="overflow-x: auto;">
            <h3 style="font-size:14px; font-weight:800; margin-bottom:8px;">Danh Sách Nhân Viên (${users.length})</h3>
            <div class="table-responsive">
              <table>
                <thead><tr><th>Mã</th><th>Tên</th><th>Email</th><th>Vai Trò</th><th>Thao Tác</th></tr></thead>
                <tbody>
                  ${users.map(u => `<tr><td><b>${u.code}</b></td><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td><button class="btn ${u.active!==false?'btn-red':'btn-green'} btn-sm" onclick="toggleUserActive('${u.uid}', ${u.active===false})">${u.active!==false?'Khóa':'Mở'}</button></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }
  }

  function setNav(id, visible) { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !visible); }
  window.switchTab = function(tab) { currentTab = tab; window.location.hash = tab; renderUI(); };
</script>
</head>

<body>
<div class="app">
  <div id="loginView" class="login-container">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:18px;">
        <h1 class="brand-title" style="justify-content:center;font-size:22px;color:#fff;"><i class="fa-solid fa-cloud" style="color:var(--primary);"></i> DMS <span>SFA</span></h1>
        <p style="font-size:11px;color:#94A3B8;margin-top:4px;">ROYAL ELEGANT PRO</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <label style="font-size:12px;font-weight:700;color:#CBD5E1;">Email:</label>
        <div class="input-icon-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="logUser" required autocomplete="username" placeholder="admin@dms.com">
        </div>
        <label style="font-size:12px;font-weight:700;color:#CBD5E1;margin-top:4px;display:block;">Mật Khẩu:</label>
        <div class="input-icon-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="logPass" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn btn-amber" style="width:100%;padding:13px;margin-top:12px;justify-content:center;font-size:14px;border-radius:12px;font-weight:800;">ĐĂNG NHẬP</button>
      </form>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div>
        <div class="brand-title" style="font-size:15px;"><i class="fa-solid fa-network-wired" style="color:var(--amber);"></i> DMS SFA</div>
        <small id="userInfo" style="color:#94A3B8;font-size:10px; font-weight:600;"></small>
      </div>
      <div class="nav-btns">
        <button id="navSales" class="btn btn-sm hidden" onclick="switchTab('sales')"><i class="fa-solid fa-cart-shopping"></i> Bán Hàng</button>
        <button id="navSoGocBH" class="btn btn-sm hidden" onclick="switchTab('soGocBH')"><i class="fa-solid fa-book"></i> Sổ Gốc BH</button>
        <button id="navCustomers" class="btn btn-sm hidden" onclick="switchTab('customers')"><i class="fa-solid fa-address-book"></i> KH</button>
        <button id="navProductsAdmin" class="btn btn-sm hidden" onclick="switchTab('productsAdmin')"><i class="fa-solid fa-boxes-stacked"></i> Hàng</button>
        <button id="navRoutes" class="btn btn-sm hidden" onclick="switchTab('routes')"><i class="fa-solid fa-route"></i> DS Tuyến</button>
        <button id="navCompany" class="btn btn-sm hidden" onclick="switchTab('company')"><i class="fa-solid fa-building"></i> DS Mã Công Ty</button>
        <button id="navUsers" class="btn btn-sm hidden" onclick="switchTab('users')"><i class="fa-solid fa-users"></i> NV</button>
        <button class="btn btn-purple btn-sm" onclick="openChangePasswordModal()"><i class="fa-solid fa-key"></i></button>
        <button class="btn btn-red btn-sm" onclick="handleLogout()"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
    
    <div class="panel">
      <div id="tabPane_sales" style="display:none;"></div>
      <div id="tabPane_customers" style="display:none;"></div>
      <div id="tabPane_soGocBH" style="display:none;"></div>
      <div id="tabPane_productsAdmin" style="display:none;"></div>
      <div id="tabPane_routes" style="display:none;"></div>
      <div id="tabPane_company" style="display:none;"></div>
      <div id="tabPane_users" style="display:none;"></div>
    </div>
  </div>
</div>

<div id="changePassModal" class="modal hidden"><div class="modal-content">
  <h3 style="font-size:15px; font-weight:800;"><i class="fa-solid fa-key"></i> Đổi Mật Khẩu</h3>
  <form onsubmit="submitChangePassword(event)" style="margin-top:10px;">
    <label>Mật Khẩu Cũ:</label><input type="password" id="oldPassInput" required>
    <label>Mật Khẩu Mới:</label><input type="password" id="newPassInput" required>
    <label>Xác Nhận Mật Khẩu:</label><input type="password" id="confirmPassInput" required>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button type="submit" class="btn btn-green" style="flex:1;justify-content:center;font-weight:800;">Lưu</button>
      <button type="button" class="btn btn-red" onclick="closeChangePasswordModal()" style="font-weight:800;">Hủy</button>
    </div>
  </form>
</div></div>

<div id="dynamicModalContainer" class="hidden"></div>

</body>
</html>
