<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMS/SFA Pro Ultimate - Giám Sát Kỷ Luật & Quản Lý Sales</title>
<meta name="theme-color" content="#12213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
  :root { --navy:#12213D; --amber:#FCA311; --paper:#F6F1E6; --line:#D9D0BC; --muted:#6B6558; --green:#2D6A4F; --red:#C1121F; --purple:#5B3A8E; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--navy);color:#1a1a1a;padding:12px;}
  .app{max-width:1360px;margin:0 auto;}
  .panel{background:var(--paper);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);margin-top:12px;}
  h1,h2,h3,h4{font-family:'Oswald',sans-serif;color:var(--navy);}
  code, .mono{font-family:'JetBrains Mono',monospace;}
  .topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;flex-wrap:wrap;gap:12px;}
  .nav-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{background:var(--navy);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-purple{background:var(--purple);color:#fff;}
  .btn-sm{padding:4px 8px;font-size:11px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:12px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
  .badge{display:inline-block;padding:3px 8px;background:#EFE7D6;border-radius:4px;font-size:11px;font-weight:700;}
  .badge-success{background:#D8F3DC;color:var(--green);}
  .badge-pending{background:#FFF3BF;color:#B57700;}
  .badge-danger{background:#F8D7DA;color:var(--red);}
  .badge-cat{background:#E0AFA0;color:#4A154B;font-size:10px;margin-left:4px;}
  input, select, textarea { width:100%; padding:8px; margin:4px 0 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:13px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); font-size:12px; }
  th { background:#EFE7D6; color:var(--navy); }
  .login-box{max-width:400px;margin:50px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.4);}
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;z-index:999;}
  .modal-content{background:#fff;padding:24px;border-radius:16px;width:90%;max-width:420px;max-height:85vh;overflow-y:auto;}
  .hidden{display:none !important;}
  .stat-number{font-size:24px;font-weight:700;color:var(--navy);margin-top:4px;}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);}
  #map { height: 350px; width: 100%; border-radius: 12px; margin-top: 10px; z-index: 1; }
  .cat-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;}
  .cat-chip{padding:4px 10px;background:#EFE7D6;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .cat-chip.active{background:var(--navy);color:#fff;}
  .watermark-img{max-width:100%;border-radius:8px;margin-top:6px;border:2px solid var(--navy);}
  .alert-box{background:#F8D7DA;color:var(--red);padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px;font-weight:600;}
  .warn-box{background:#FFF3BF;color:#8a6300;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px;font-weight:600;}
  .progress-bar{background:#e0e0e0;border-radius:8px;height:12px;width:100%;margin-top:4px;overflow:hidden;}
  .progress-fill{background:var(--green);height:100%;width:0%;transition:width 0.3s;}
  .suspicious{border:2px solid var(--red) !important;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:1200;box-shadow:0 6px 20px rgba(0,0,0,.4);}

  @media (max-width: 768px) {
    body { padding: 6px; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .nav-btns { width: 100%; overflow-x: auto; padding-bottom: 6px; flex-wrap: nowrap; }
    .grid { grid-template-columns: 1fr !important; }
    .card { overflow-x: auto; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
    #map { height: 260px; }
  }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; }
  }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    updatePassword, reauthenticateWithCredential, EmailAuthProvider, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs,
    serverTimestamp, enableIndexedDbPersistence, query, orderBy, limit, where, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCGCHPxhUnZzwjXhfw3hcy-9VPi9RrZ6HY",
    authDomain: "project-4126159910229398131.firebaseapp.com",
    projectId: "project-4126159910229398131",
    storageBucket: "project-4126159910229398131.firebasestorage.app",
    messagingSenderId: "87655220343",
    appId: "1:87655220343:web:15576d27653acbee16f272",
    measurementId: "G-JK9WGF52FY"
  };

  const app = initializeApp(firebaseConfig);
  const authSvc = getAuth(app);
  const db = getFirestore(app);
  
  enableIndexedDbPersistence(db).catch(() => {});

  const secondaryApp = initializeApp(firebaseConfig, "secondary");
  const secondaryAuth = getAuth(secondaryApp);

  let currentUser = null;
  let currentTab = 'sales';
  let stores = [], orders = [], users = [], checkins = [], products = [], promos = [], auditLogs = [];
  let currentCart = [];
  let activeVisitedStore = null;
  let selectedCategoryFilter = 'Tất cả';
  let html5QrScanner = null;

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
    const R = 6371e3, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  const MAX_PHOTO_BASE64_BYTES = 700 * 1024;

  function createWatermarkedImage(file, infoText) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const draw = (maxWidth, quality) => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const stripH = Math.max(50, Math.round(canvas.height * 0.16));
            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            ctx.fillRect(0, canvas.height - stripH, canvas.width, stripH);
            ctx.fillStyle = "#FCA311";
            ctx.font = "bold 13px Inter, sans-serif";
            ctx.fillText(`📍 DMS: ${infoText.storeName}`, 10, canvas.height - stripH + 18);
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "10px Inter, sans-serif";
            ctx.fillText(`NV: [${infoText.salesCode}] ${infoText.salesName} (${infoText.tag || 'Check-in'})`, 10, canvas.height - stripH + 34);
            ctx.fillText(`GPS: ${infoText.lat.toFixed(5)}, ${infoText.lng.toFixed(5)} | ${new Date().toLocaleString('vi-VN')}`, 10, canvas.height - stripH + 48);
            return canvas.toDataURL("image/jpeg", quality);
          };

          let dataUrl = draw(480, 0.55);
          if (dataUrl.length > MAX_PHOTO_BASE64_BYTES) dataUrl = draw(360, 0.45);
          if (dataUrl.length > MAX_PHOTO_BASE64_BYTES) dataUrl = draw(280, 0.35);
          resolve(dataUrl);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function writeAuditLog(action, targetType, targetId, detail) {
    try {
      await addDoc(collection(db, "auditLogs"), {
        actorUid: currentUser.uid, actorName: currentUser.name, action, targetType, targetId, detail,
        createdAt: serverTimestamp()
      });
    } catch (e) {}
  }

  window.handleLogin = async function(e) {
    e.preventDefault();
    const email = document.getElementById('logUser').value.trim();
    const pass = document.getElementById('logPass').value.trim();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerHTML = 'Đang đăng nhập...';
    try {
      await signInWithEmailAndPassword(authSvc, email, pass);
    } catch (err) {
      alert("Sai tài khoản hoặc mật khẩu.");
      btn.disabled = false; btn.innerHTML = '🔑 ĐĂNG NHẬP';
    }
  };

  onAuthStateChanged(authSvc, async (user) => {
    if (!user) {
      currentUser = null;
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('appView').classList.add('hidden');
      return;
    }
    const profileSnap = await getDoc(doc(db, "users", user.uid));
    if (!profileSnap.exists()) {
      alert("Tài khoản chưa có hồ sơ phân quyền. Liên hệ Admin.");
      await signOut(authSvc);
      return;
    }
    const profile = profileSnap.data();
    if (profile.active === false) {
      alert("⛔ Tài khoản của bạn đã bị khóa. Liên hệ Admin.");
      await signOut(authSvc);
      return;
    }
    currentUser = { uid: user.uid, email: user.email, name: profile.name, code: profile.code, role: profile.role };
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    currentTab = (profile.role === 'sales') ? 'sales' : 'dashboard';
    attachListeners();
    renderUI();
  });

  window.handleLogout = async function() { await signOut(authSvc); };
  window.openChangePasswordModal = function() { document.getElementById('changePassModal').classList.remove('hidden'); };
  window.closeChangePasswordModal = function() { document.getElementById('changePassModal').classList.add('hidden'); };

  window.submitChangePassword = async function(e) {
    e.preventDefault();
    const oldP = document.getElementById('oldPassInput').value;
    const newP = document.getElementById('newPassInput').value;
    const confirmP = document.getElementById('confirmPassInput').value;
    if (newP !== confirmP) return alert("Mật khẩu mới không trùng khớp!");
    if (newP.length < 6) return alert("Mật khẩu phải từ 6 ký tự trở lên!");
    try {
      const cred = EmailAuthProvider.credential(authSvc.currentUser.email, oldP);
      await reauthenticateWithCredential(authSvc.currentUser, cred);
      await updatePassword(authSvc.currentUser, newP);
      alert("✅ Đổi mật khẩu thành công!");
      closeChangePasswordModal();
    } catch (err) {
      alert("⛔ Mật khẩu cũ không đúng.");
    }
  };

  window.doCheckinWithPhoto = function(storeId) {
    const store = stores.find(s => s.id === storeId);
    if (!store) return;
    const fileInput = document.getElementById(`img_${store.id}`);
    if (!fileInput || !fileInput.files[0]) return alert("⛔ BẮT BUỘC CHỤP ẢNH TẠI ĐIỂM BÁN!");
    const file = fileInput.files[0];

    navigator.geolocation.getCurrentPosition(async pos => {
      const userLat = pos.coords.latitude, userLng = pos.coords.longitude, accuracy = pos.coords.accuracy;
      let distance = 0;
      if (store.lat && store.lng) {
        distance = getDistanceMeters(userLat, userLng, store.lat, store.lng);
        if (distance > 30) return alert(`⛔ CHECK-IN THẤT BẠI!\nKhoảng cách: ${Math.round(distance)}m (>30m).`);
      }

      let suspicious = false, suspiciousReasons = [];
      const prevQ = query(collection(db, "checkins"), where("salesUid", "==", currentUser.uid), orderBy("createdAt", "desc"), limit(1));
      const prevSnap = await getDocs(prevQ);
      if (!prevSnap.empty) {
        const prev = prevSnap.docs[0].data();
        if (prev.createdAt) {
          const distBetween = getDistanceMeters(prev.lat, prev.lng, userLat, userLng);
          const seconds = (Date.now() - prev.createdAt.toMillis()) / 1000;
          if (seconds > 0) {
            const speedKmh = (distBetween/1000) / (seconds/3600);
            if (speedKmh > 100) { suspicious = true; suspiciousReasons.push(`Di chuyển tốc độ bất thường (~${Math.round(speedKmh)}km/h)`); }
          }
        }
      }

      try {
        const photo = await createWatermarkedImage(file, { storeName: store.name, salesCode: currentUser.code, salesName: currentUser.name, lat: userLat, lng: userLng, tag: 'Check-in' });
        await addDoc(collection(db, "checkins"), {
          salesUid: currentUser.uid, salesName: currentUser.name, salesCode: currentUser.code,
          storeName: store.name, storeId: store.id, lat: userLat, lng: userLng, accuracy, distance,
          photo, status: 'Checked-in (<30m)', checkoutAt: null, durationMinutes: null,
          suspicious, suspiciousReasons, createdAt: serverTimestamp()
        });

        if (suspicious) writeAuditLog("CANH_BAO_CHECKIN_NGHI_VAN", "checkins", store.id, suspiciousReasons.join(" | "));
        activeVisitedStore = store;
        toast(`✅ Check-in thành công tại ${store.name}`);
        renderUI();
      } catch (err) { alert("Lỗi lưu check-in: " + err.message); }
    }, () => alert("⛔ LỖI GPS: Hãy bật GPS."), { enableHighAccuracy: true, timeout: 10000 });
  };

  window.uploadPOSMPhoto = function(storeId) {
    const fileInput = document.getElementById(`posm_${storeId}`);
    if (!fileInput || !fileInput.files[0]) return alert("Vui lòng chọn ảnh trưng bày POSM!");
    const file = fileInput.files[0];
    navigator.geolocation.getCurrentPosition(async pos => {
      const photo = await createWatermarkedImage(file, { storeName: activeVisitedStore.name, salesCode: currentUser.code, salesName: currentUser.name, lat: pos.coords.latitude, lng: pos.coords.longitude, tag: 'POSM Display' });
      await addDoc(collection(db, "auditLogs"), {
        actorUid: currentUser.uid, actorName: currentUser.name, action: "POSM_DISPLAY_PHOTO", targetType: "stores", targetId: storeId, detail: photo, createdAt: serverTimestamp()
      });
      toast("📸 Đã gửi ảnh trưng bày POSM thành công!");
    });
  };

  window.doCheckout = async function(checkinId) {
    const c = checkins.find(x => x.id === checkinId);
    if (!c || !c.createdAt) return;
    const startMs = c.createdAt.toMillis ? c.createdAt.toMillis() : Date.now();
    const durationMinutes = Math.round((Date.now() - startMs) / 60000);
    
    if (durationMinutes < 5) {
      if (!confirm(`⚠️ Kỷ luật: Thời gian chăm sóc cửa hàng mới được ${durationMinutes} phút (< 5 phút).\nBạn có chắc chắn muốn Check-out?`)) return;
    }

    await updateDoc(doc(db, "checkins", checkinId), { checkoutAt: serverTimestamp(), durationMinutes });
    toast(`Đã check-out. Thời gian ở lại: ${durationMinutes} phút.`);
    renderUI();
  };

  window.startQRScanner = function(storeId) {
    const store = stores.find(s => s.id === storeId);
    document.getElementById('qrModal').classList.remove('hidden');
    html5QrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrScanner.render(async (decodedText) => {
      if (decodedText === store.id || decodedText === store.name) {
        html5QrScanner.clear();
        document.getElementById('qrModal').classList.add('hidden');
        toast(`✅ Đúng mã QR tiệm: ${store.name}`);
        activeVisitedStore = store;
        renderUI();
      } else alert(`❌ Mã QR không khớp tiệm ${store.name}.`);
    });
  };
  window.closeQRScanner = function() { if (html5QrScanner) html5QrScanner.clear(); document.getElementById('qrModal').classList.add('hidden'); };

  window.loadLastOrder = function() {
    if (!activeVisitedStore) return;
    const lastOrd = orders.filter(o => o.storeName === activeVisitedStore.name && o.status !== 'Đã hủy').sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0))[0];
    if (!lastOrd || !lastOrd.items) return alert("Cửa hàng này chưa có đơn hàng cũ!");
    currentCart = JSON.parse(JSON.stringify(lastOrd.items));
    toast("🔄 Đã tải giỏ hàng từ đơn hàng gần nhất!");
    renderCartUI();
  };

  window.addToCartWithUnit = function(productId) {
    const prd = products.find(p => p.id === productId);
    if (!prd || prd.stock <= 0) return alert("Sản phẩm đã HẾT HÀNG!");
    const selectedUnit = document.getElementById(`unit_select_${productId}`).value;
    const unitRate = selectedUnit === 'Thùng' ? (prd.rateBox || 24) : (selectedUnit === 'Lốc' ? (prd.ratePack || 6) : 1);
    const calculatedPrice = prd.price * unitRate;
    const itemKey = `${productId}_${selectedUnit}`;
    const item = currentCart.find(c => c.cartKey === itemKey);
    if (item) {
      if ((item.qty + 1) * unitRate > prd.stock) return alert("Không đủ tồn kho!");
      item.qty += 1;
    } else {
      currentCart.push({ cartKey: itemKey, id: prd.id, code: prd.code, name: prd.name, unit: selectedUnit, unitRate, price: calculatedPrice, qty: 1 });
    }
    renderCartUI();
  };
  window.removeFromCart = function(cartKey) { currentCart = currentCart.filter(c => c.cartKey !== cartKey); renderCartUI(); };

  function isPromoActive(p) {
    const now = new Date();
    if (p.startDate && new Date(p.startDate) > now) return false;
    if (p.endDate && new Date(p.endDate) < now) return false;
    return true;
  }

  function renderCartUI() {
    const cartContainer = document.getElementById('cartList');
    if (!cartContainer) return;
    let rawSubtotal = 0, promoGiftList = [];
    currentCart.forEach(item => {
      rawSubtotal += item.price * item.qty;
      promos.filter(isPromoActive).forEach(p => {
        if (p.buyPrdId === item.id && (item.qty * item.unitRate) >= p.buyQty) {
          const giftCount = Math.floor((item.qty * item.unitRate) / p.buyQty) * p.getQty;
          promoGiftList.push(`🎁 Tặng ${giftCount} x ${p.getPrdName} (KM Mua ${p.buyQty} Tặng ${p.getQty})`);
        }
      });
    });

    let discountPercent = 0;
    if (rawSubtotal >= 10000000) discountPercent = 5;
    else if (rawSubtotal >= 5000000) discountPercent = 2;

    const discountAmount = (rawSubtotal * discountPercent) / 100;
    const finalTotal = rawSubtotal - discountAmount;

    cartContainer.innerHTML = currentCart.map(i => `
      <div class="cart-item"><div><b>[${i.code}] ${i.name}</b><br><small>ĐVT: <b style="color:var(--amber);">${i.unit}</b> (${i.price.toLocaleString()}đ) x ${i.qty}</small></div>
      <div><b>${(i.price*i.qty).toLocaleString()}đ</b> <button class="btn btn-red btn-sm" onclick="removeFromCart('${i.cartKey}')">X</button></div></div>`).join('')
      + (discountPercent > 0 ? `<div style="color:var(--green);font-size:11px;margin-top:6px;">💥 Chiết khấu đơn hàng (${discountPercent}%): -${discountAmount.toLocaleString()} đ</div>` : '')
      + (promoGiftList.length > 0 ? `<div style="color:var(--green);font-size:11px;margin-top:4px;">${promoGiftList.join('<br>')}</div>` : '');
    
    document.getElementById('cartTotal').innerText = `${finalTotal.toLocaleString('vi-VN')} đ`;
  }

  window.submitOrder = async function(e) {
    e.preventDefault();
    if (currentCart.length === 0) return alert("Vui lòng chọn sản phẩm!");
    const storeName = document.getElementById('ordStore').value;
    const storeObj = stores.find(s => s.name === storeName);
    const creditLimit = storeObj?.creditLimit || 20000000;
    const currentDebt = orders.filter(o => o.storeName === storeName && o.paymentStatus !== 'Đã thanh toán' && o.status !== 'Đã hủy').reduce((sum, o) => sum + (o.amount || 0), 0);
    
    let rawSubtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    let discountPercent = rawSubtotal >= 10000000 ? 5 : (rawSubtotal >= 5000000 ? 2 : 0);
    const finalAmount = rawSubtotal - (rawSubtotal * discountPercent / 100);

    if ((currentDebt + finalAmount) > creditLimit) {
      return alert(`⛔ VƯỢT HẠN MỨC CÔNG NỢ!\n- Dư nợ: ${currentDebt.toLocaleString()}đ\n- Đơn mới: ${finalAmount.toLocaleString()}đ\n- Hạn mức: ${creditLimit.toLocaleString()}đ`);
    }

    await addDoc(collection(db, "orders"), {
      salesUid: currentUser.uid, salesName: currentUser.name, salesCode: currentUser.code,
      storeId: storeObj?.id || null, storeName, items: currentCart, amount: finalAmount, discountPercent,
      paymentStatus: 'Công nợ', status: 'Chờ duyệt', createdAt: serverTimestamp()
    });
    toast("🚀 Đã gửi đơn hàng.");

  window.approveOrder = async function(orderId) {
    try {
      await runTransaction(db, async (tx) => {
        const orderRef = doc(db, "orders", orderId);
        const orderSnap = await tx.get(orderRef);
        if (!orderSnap.exists()) throw new Error("Không tìm thấy đơn hàng.");
        const order = orderSnap.data();
        if (order.status !== 'Chờ duyệt') throw new Error(`Đơn đang ở trạng thái "${order.status}".`);
        const productRefs = order.items.map(it => doc(db, "products", it.id));
        const productSnaps = await Promise.all(productRefs.map(r => tx.get(r)));
        productSnaps.forEach((snap, idx) => {
          const item = order.items[idx], need = item.qty * item.unitRate;
          if (!snap.exists()) throw new Error(`Sản phẩm ${item.name} không tồn tại.`);
          if (snap.data().stock < need) throw new Error(`Sản phẩm ${item.name} không đủ tồn kho (còn ${snap.data().stock}).`);
        });
        productSnaps.forEach((snap, idx) => {
          const item = order.items[idx], need = item.qty * item.unitRate;
          tx.update(productRefs[idx], { stock: snap.data().stock - need });
        });
        tx.update(orderRef, { status: 'Đã duyệt', approvedBy: currentUser.uid, approvedAt: serverTimestamp() });
      });
      writeAuditLog("DUYET_DON", "orders", orderId, "Duyệt đơn & trừ tồn kho");
      toast("Đã duyệt đơn & trừ tồn kho.");
    } catch (err) { alert("Lỗi duyệt đơn: " + err.message); }
  };

  window.cancelOrder = async function(orderId) {
    const reason = prompt("Lý do hủy đơn:", "");
    if (reason === null) return;
    try {
      await runTransaction(db, async (tx) => {
        const orderRef = doc(db, "orders", orderId);
        const orderSnap = await tx.get(orderRef);
        if (!orderSnap.exists()) throw new Error("Không tìm thấy đơn hàng.");
        const order = orderSnap.data();
        if (order.status === 'Đã hủy') return;
        if (['Đã duyệt', 'Đã giao hàng'].includes(order.status)) {
          const productRefs = order.items.map(it => doc(db, "products", it.id));
          const productSnaps = await Promise.all(productRefs.map(r => tx.get(r)));
          productSnaps.forEach((snap, idx) => {
            if (!snap.exists()) return;
            const item = order.items[idx], need = item.qty * item.unitRate;
            tx.update(productRefs[idx], { stock: snap.data().stock + need });
          });
        }
        tx.update(orderRef, { status: 'Đã hủy', cancelReason: reason || '', cancelledBy: currentUser.uid, cancelledAt: serverTimestamp() });
      });
      writeAuditLog("HUY_DON", "orders", orderId, reason || "");
      toast("Đã hủy đơn thành công.");
    } catch (err) { alert("Lỗi hủy đơn: " + err.message); }
  };

  function downloadCSV(filename, rows) {
    const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = filename; link.click();
  }
  window.exportOrdersCSV = function() {
    const rows = [["Mã NV","Tên NV","Điểm bán","Tổng tiền","Thanh toán","Trạng thái","Ngày tạo"]];

    downloadCSV(`don-hang-${Date.now()}.csv`, rows);

  function computeAlerts() {
    const lowStock = products.filter(p => p.stock <= (p.reorderLevel || 20));
    const debtByStore = {};
    orders.filter(o => o.paymentStatus !== 'Đã thanh toán' && o.status !== 'Đã hủy').forEach(o => { debtByStore[o.storeName] = (debtByStore[o.storeName]||0) + (o.amount||0); });
    const debtWarnings = stores.map(s => ({...s, currentDebt: debtByStore[s.name]||0})).filter(s => s.creditLimit && s.currentDebt >= 0.8*s.creditLimit);
    return { lowStock, debtWarnings };
  }

            <label>Tên:</label><input type="text" id="prdName" required>
            <label>Phân Loại:</label><select id="prdCategory"><option>Hộp</option><option>Chai</option><option>Lốc</option><option>Thùng</option><option>Khác</option></select>
            <label>Đơn Vị Cơ Bản:</label><select id="prdBaseUnit"><option>Hộp</option><option>Chai</option><option>Gói</option></select>
            <label>1 Lốc = ?:</label><input type="number" id="prdRatePack" value="6" required>
            <label>1 Thùng = ?:</label><input type="number" id="prdRateBox" value="24" required>
            <label>Đơn Giá:</label><input type="number" id="prdPrice" required>
            <label>Tồn Kho:</label><input type="number" id="prdStock" required>
            <label>Ngưỡng cảnh báo thấp:</label><input type="number" id="prdReorder" value="20" required>
            <button class="btn btn-green" style="width:100%;">+ Lưu</button></form></div>
          <div class="card" style="grid-column: span 2;"><h3>Danh Sách Sản Phẩm</h3><table>
            <thead><tr><th>SKU</th><th>Tên</th><th>Loại</th><th>Quy đổi</th><th>Giá</th><th>Tồn</th><th></th></tr></thead>
            <tbody>${products.map(p => `<tr class="${p.stock<=(p.reorderLevel||20)?'suspicious':''}">
              <td><b>${p.code||'SKU'}</b></td><td>${p.name}</td><td><span class="badge badge-cat">${p.category||'Khác'}</span></td>
              <td><small>Lốc=${p.ratePack||6} | Thùng=${p.rateBox||24}</small></td><td><b>${p.price.toLocaleString()}đ</b></td>
              <td><span class="badge ${p.stock<=(p.reorderLevel||20)?'badge-danger':''}">${p.stock}</span></td>
              <td><button class="btn btn-red btn-sm" onclick="deleteProduct('${p.id}')">Xóa</button></td></tr>`).join('')}</tbody>
          </table></div>
        </div>`;
    }

    else if (currentTab === 'promos' && isAdmin) {
      main.innerHTML = `
        <h2>Khuyến Mãi (Mua-Tặng, có thời hạn)</h2>
        <div class="grid">
          <div class="card"><h3>+ Thêm KM</h3><form id="promoForm" onsubmit="addPromo(event)">
            <label>Sản phẩm mua:</label><select id="pmBuyPrd">${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
            <label>SL mua:</label><input type="number" id="pmBuyQty" value="24" required>
            <label>Quà tặng:</label><input type="text" id="pmGetName" required>
            <label>SL tặng:</label><input type="number" id="pmGetQty" value="1" required>
            <label>Bắt đầu:</label><input type="date" id="pmStart">
            <label>Kết thúc:</label><input type="date" id="pmEnd">
            <button class="btn btn-green" style="width:100%;">+ Lưu</button></form></div>
          <div class="card" style="grid-column: span 2;"><h3>Danh Sách KM</h3><table>
            <thead><tr><th>Mua</th><th>Tặng</th><th>Hiệu lực</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody>${promos.map(p => { const prd=products.find(x=>x.id===p.buyPrdId); const active=isPromoActive(p);
              return `<tr><td>${prd?prd.name:'?'} (mua ${p.buyQty})</td><td>${p.getPrdName} x${p.getQty}</td>
              <td><small>${p.startDate||'—'} → ${p.endDate||'—'}</small></td>
              <td><span class="badge ${active?'badge-success':'badge-pending'}">${active?'Đang chạy':'Ngoài hiệu lực'}</span></td>
              <td><button class="btn btn-red btn-sm" onclick="deletePromo('${p.id}')">Xóa</button></td></tr>`; }).join('')}</tbody>
          </table></div>
        </div>`;
    }

    else if (currentTab === 'stores') {
      main.innerHTML = `
        <h2>Quản Lý Tuyến & Điểm Bán</h2>
        <div class="grid">
          ${isAdmin||isManager ? `<div class="card"><h3>+ Thêm Điểm Bán</h3><form id="stForm" onsubmit="addStore(event)">
            <label>Tên:</label><input type="text" id="stName" required>
            <label>Địa Chỉ:</label><input type="text" id="stAddr" required>
            <label>Tuyến:</label><select id="stRoute"><option>Thứ 2 - Thứ 4 - Thứ 6</option><option>Thứ 3 - Thứ 5 - Thứ 7</option><option>Cả tuần</option></select>
            <label>Hạn Mức Nợ:</label><input type="number" id="stCredit" value="20000000" required>
            <label>Lat:</label><input type="number" step="any" id="stLat" placeholder="10.7769">
            <label>Lng:</label><input type="number" step="any" id="stLng" placeholder="106.7009">
            <button class="btn btn-green" style="width:100%;">+ Lưu</button></form></div>` : ''}
          <div class="card" style="grid-column: span ${(isAdmin||isManager)?2:3};"><h3>Danh Sách Điểm Bán</h3><table>
            <thead><tr><th>Tên</th><th>Địa Chỉ</th><th>Tuyến</th><th>Hạn Mức</th>${(isAdmin||isManager)?'<th></th>':''}</tr></thead>
            <tbody>${stores.map(s => `<tr><td><b>${s.name}</b></td><td>${s.address}</td><td><span class="badge badge-pending">${s.routeDay||'Cả tuần'}</span></td>
              <td><b>${(s.creditLimit||0).toLocaleString()}đ</b></td>${(isAdmin||isManager)?`<td><button class="btn btn-red btn-sm" onclick="deleteStore('${s.id}')">Xóa</button></td>`:''}</tr>`).join('')}</tbody>
          </table></div>
        </div>`;
    }

    else if (currentTab === 'orders') {
      const myOrders = currentUser.role === 'sales' ? orders.filter(o => o.salesUid === currentUser.uid) : orders;
      main.innerHTML = `
        <h2>Đơn Hàng ${currentUser.role==='sales'?'(Của tôi)':'Toàn Hệ Thống'}</h2>
        ${backOffice ? `<button class="btn btn-amber btn-sm" onclick="exportOrdersCSV()">⬇️ Xuất CSV</button>` : ''}
        <div class="card"><table>
          <thead><tr><th>NV</th><th>Điểm Bán</th><th>Chi Tiết</th><th>Tổng Tiền</th><th>Thanh Toán</th><th>Trạng Thái</th><th>Thao Tác</th></tr></thead>
          <tbody>${myOrders.map(o => `<tr>
            <td><b>[${o.salesCode||'NV'}]</b><br>${o.salesName||''}</td><td><b>${o.storeName}</b></td>
            <td><small>${(o.items||[]).map(i => `${i.name} (${i.unit} x${i.qty})`).join(', ')}</small></td>
            <td><b style="color:var(--red);">${(o.amount||0).toLocaleString()}đ</b>${o.discountPercent?`<br><small style="color:var(--green); font-weight:bold;">(Đã ck ${o.discountPercent}%)</small>`:''}</td>
            <td><span class="badge ${o.paymentStatus==='Đã thanh toán'?'badge-success':'badge-pending'}">${o.paymentStatus}</span></td>
            <td><span class="badge ${o.status==='Đã hủy'?'badge-danger':(o.status==='Đã giao hàng'?'badge-success':'badge-pending')}">${o.status}</span></td>
            <td style="display:flex;gap:4px;flex-wrap:wrap;">
              <button class="btn btn-amber btn-sm" onclick="printReceipt('${o.id}')">🖨️ In Hóa Đơn</button>
              ${(isAdmin||isManager)&&o.status==='Chờ duyệt'?`<button class="btn btn-green btn-sm" onclick="approveOrder('${o.id}')">Duyệt</button>`:''}
              ${(isAdmin||isManager)&&['Chờ duyệt','Đã duyệt'].includes(o.status)?`<button class="btn btn-red btn-sm" onclick="cancelOrder('${o.id}')">Hủy</button>`:''}
              ${(isAdmin||isManager)&&o.status==='Đã duyệt'?`<button class="btn btn-purple btn-sm" onclick="markDelivered('${o.id}')">Đã giao</button>`:''}
              ${(isAdmin||isAccountant)&&o.paymentStatus!=='Đã thanh toán'?`<button class="btn btn-amber btn-sm" onclick="confirmPayment('${o.id}')">Xác nhận TT</button>`:''}
            </td></tr>`).join('')}</tbody>
        </table></div>`;
    }

    else if (currentTab === 'audit' && (isAdmin||isManager)) {
      main.innerHTML = `
        <h2>Nhật Ký Check-in & Ảnh Bằng Chứng</h2>
        <button class="btn btn-amber btn-sm" onclick="exportCheckinsCSV()">⬇️ Xuất CSV</button>
        <div class="grid">${checkins.map(c => `<div class="card ${c.suspicious?'suspicious':''}">
          <b>Tiệm: ${c.storeName}</b> <span class="badge ${c.suspicious?'badge-danger':'badge-success'}">${c.suspicious?'⚠️ Nghi vấn':c.status}</span><br>
          <small>Sales: [${c.salesCode||'NV'}] ${c.salesName}</small><br>
          <small>Tọa độ: ${c.lat?c.lat.toFixed(4):'N/A'}, ${c.lng?c.lng.toFixed(4):'N/A'} | Khoảng cách: ${Math.round(c.distance||0)}m | GPS: ±${Math.round(c.accuracy||0)}m</small><br>
          ${c.suspicious?`<small style="color:var(--red);">${(c.suspiciousReasons||[]).join(' | ')}</small><br>`:''}
          ${c.durationMinutes!=null?`<small>Ở lại: ${c.durationMinutes} phút</small><br>`:`<small style="color:var(--muted);">Chưa check-out</small><br>`}
          ${c.photo?`<img src="${c.photo}" class="watermark-img">`:''}
        </div>`).join('')}</div>
        <h3 style="margin-top:20px;">📜 Lịch Sử Thao Tác & POSM Display</h3>
        <div class="card"><table><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Chi tiết</th></tr></thead>
          <tbody>${auditLogs.map(l => `<tr><td><small>${l.createdAt?.toDate?l.createdAt.toDate().toLocaleString('vi-VN'):''}</small></td>
            <td>${l.actorName||''}</td><td><span class="badge">${l.action}</span></td>
            <td>${l.action==='POSM_DISPLAY_PHOTO'?`<img src="${l.detail}" style="max-width:120px;border-radius:4px;">`:`<small>${l.detail||''}</small>`}</td></tr>`).join('')}</tbody>
        </table></div>`;
    }

    else if (currentTab === 'users' && isAdmin) {
      main.innerHTML = `
        <h2>Quản Lý Tài Khoản Nhân Viên</h2>
        <div class="grid">
          <div class="card"><h3>+ Tạo Tài Khoản Mới</h3><form id="userForm" onsubmit="addUser(event)">
            <input type="text" id="usCode" placeholder="Mã NV" required>
            <input type="text" id="usName" placeholder="Tên NV" required>
            <input type="email" id="usEmail" placeholder="Email đăng nhập" required>
            <input type="text" id="usPass" placeholder="Mật khẩu (≥6 ký tự)" required>
            <select id="usRole"><option value="sales">Sales</option><option value="manager">Giám Sát</option><option value="accountant">Kế Toán</option><option value="admin">Admin</option></select>
            <button class="btn btn-green" style="width:100%;">+ Tạo</button></form></div>
          <div class="card" style="grid-column: span 2;"><h3>Danh Sách Nhân Viên</h3><table>
            <thead><tr><th>Mã</th><th>Tên</th><th>Email</th><th>Vai Trò</th><th>Trạng Thái</th><th></th></tr></thead>
            <tbody>${users.map(u => `<tr><td><b>${u.code||'NV'}</b></td><td>${u.name}</td><td><small>${u.email}</small></td>
              <td><select onchange="changeUserRole('${u.uid}', this.value)" style="margin:0;padding:2px;font-size:11px;">
                ${['sales','manager','accountant','admin'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${roleLabel(r)}</option>`).join('')}</select></td>
              <td><span class="badge ${u.active!==false?'badge-success':'badge-danger'}">${u.active!==false?'Hoạt động':'Đã khóa'}</span></td>
              <td><button class="btn ${u.active!==false?'btn-red':'btn-green'} btn-sm" onclick="toggleUserActive('${u.uid}', ${u.active===false})">${u.active!==false?'Khóa':'Mở khóa'}</button></td>
            </tr>`).join('')}</tbody>
          </table></div>
        </div>`;
    }
  }

  function roleLabel(r) { return { admin: 'Admin', manager: 'Giám Sát', accountant: 'Kế Toán', sales: 'Sales' }[r] || r; }
  function setNav(id, visible) { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !visible); }
</script>
</head>

<body>
<div class="app">
  <div id="loginView" class="login-box">
    <h2 style="text-align:center;margin-bottom:12px;">DMS/SFA PRO</h2>
    <p style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:20px;">Giám Sát Đi Thị Trường & Quản Lý Sales</p>
    <form onsubmit="handleLogin(event)">
      <label>Email:</label><input type="email" id="logUser" placeholder="ten@congty.com" required autocomplete="username">
      <label>Mật Khẩu:</label><input type="password" id="logPass" placeholder="Mật khẩu" required autocomplete="current-password">
      <button id="loginBtn" class="btn btn-amber" style="width:100%;padding:12px;margin-top:10px;font-size:14px;">🔑 ĐĂNG NHẬP</button>
    </form>
    <div style="margin-top:16px;padding:10px;background:#f8f8f8;border-radius:8px;font-size:11px;color:var(--muted);">Tài khoản do Admin cấp trong mục "Nhân Viên".</div>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div><h1 style="color:var(--amber);">DMS CLOUD SFA — ULTIMATE</h1><small id="userInfo">XIN CHÀO...</small></div>
      <div class="nav-btns">
        <button id="navDash" class="btn btn-amber hidden" onclick="switchTab('dashboard')">📊 Dashboard</button>
        <button id="navSales" class="btn" onclick="switchTab('sales')">🛒 Đi Thị Trường</button>
        <button id="navStores" class="btn" onclick="switchTab('stores')">🏬 Tuyến / Tiệm</button>
        <button id="navOrders" class="btn" onclick="switchTab('orders')">📦 Đơn Hàng</button>
        <button id="navPrd" class="btn hidden" onclick="switchTab('products')">🥛 Sản Phẩm</button>
        <button id="navPromo" class="btn hidden" onclick="switchTab('promos')">🎁 Khuyến Mãi</button>
        <button id="navAudit" class="btn hidden" onclick="switchTab('audit')">📷 Audit Log</button>
        <button id="navUsers" class="btn hidden" onclick="switchTab('users')">👥 Nhân Viên</button>
        <button class="btn btn-amber" onclick="openChangePasswordModal()">🔒 Đổi Pass</button>
        <button class="btn btn-red" onclick="handleLogout()">Đăng Xuất</button>
      </div>
    </div>
    <div class="panel" id="mainContent"></div>
  </div>
</div>

<div id="changePassModal" class="modal hidden"><div class="modal-content">
  <h3>🔑 Đổi Mật Khẩu</h3>
  <form onsubmit="submitChangePassword(event)" style="margin-top:12px;">
    <label>Mật Khẩu Hiện Tại:</label><input type="password" id="oldPassInput" required>
    <label>Mật Khẩu Mới:</label><input type="password" id="newPassInput" required>
    <label>Xác Nhận:</label><input type="password" id="confirmPassInput" required>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button type="submit" class="btn btn-green" style="flex:1;">Lưu</button>
      <button type="button" class="btn btn-red" onclick="closeChangePasswordModal()">Hủy</button>
    </div>
  </form>
</div></div>

<div id="qrModal" class="modal hidden"><div class="modal-content">
  <h3>📷 Quét Mã QR</h3><div id="reader" style="width:100%;margin-top:10px;"></div>
  <button class="btn btn-red" style="width:100%;margin-top:12px;" onclick="closeQRScanner()">Đóng Camera</button>
</div></div>

</body>
</html>
